 #events
 
 AtM_TUR.1.t: "Meeting with Abdulaziz"
 AtM_TUR.1.d: "Celal Bayar met with the leader of the autonomous region of Ottoman Central Arabia today and has come back with fantasic news. The central arabian leader has agreed upon integration into the Ottoman federation under the condition that sufficent investment is made into the country. This is a great day for map painting."
 Atm_TUR.1.a: "Excellent News"
 
 AtM_TUR.2.t: "Election of 1946"
 AtM_TUR.2.d: "Celal Bayar has been a popular leader among the ottoman people with liberlization across the empire taking place and winning World War 2. However, an Ismet from the more conservative CHP party is on the rise."
 Atm_TUR.2.a: "Celal Bayar wins"
 Atm_TUR.2.b: "İsmet İnönü wins"