 ###########################
 #   World War 3 Events   #
 ##########################
 
 AtM_WW3.1.t:0 "Europe has Fallen"
 AtM_WW3.1.desc:0 "The Soviet tide has washed over Europe. Despite our best efforts and the courage of our allies, the Red Army now stands triumphant from the Urals to the Atlantic. France has capitulated, our armies have been pushed off the continent, and the Iron Curtain has descended with finality. This is a dark hour for democracy, but the war is not over. We must regroup, rebuild, and prepare for the long struggle ahead. The beacon of liberty may have dimmed in Europe, but it will not be extinguished. Our fleets still patrol the seas, our factories still turn, and our people remain steadfast. The struggle continues, and we will see it through to the end."
 AtM_WW3.1.a:0 "We must retreat and regroup."
 AtM_WW3.1.b:0 "A dark day for democracy."
 AtM_WW3.1.c:0 "The Revolution is unstoppable!"
 
 #######################
 #   Wargames Events   #
 #######################
 
 AtM_wargames.1.t:0 "Wargames Hosted in [FROM.GetNameDefCap]"
 AtM_wargames.1.desc:0 "[FROM.GetNameDefCap] has officially launched its military exercises, drawing attention from neighboring nations. The war games feature large-scale troop movements, strategy testing, and equipment drills aimed at improving readiness and coordination within their armed forces. The exercises also serve as an opportunity to refine defensive strategies and adapt to evolving military challenges. Neighboring countries are observing the event with a mix of interest and curiosity, noting the potential for regional collaboration and mutual understanding through such demonstrations. While primarily focused on enhancing internal military capabilities, these exercises underline the shared importance of stability and preparedness in the region, fostering discussions on the broader implications for defense and diplomacy."
 AtM_wargames.1.a:0 "Interesting"
 AtM_wargames.2.t:0 "[FROM.GetNameDefCap] Joined Wargames"
 AtM_wargames.2.desc:0 "In a significant step toward bolstering regional cooperation, [FROM.GetNameDef] has agreed to participate in the war games hosted by [THIS.GetNameDef]. The decision marks an important moment in fostering stronger military ties between the two nations, with the goal of enhancing mutual defense readiness. The joint exercises will involve coordinated troop movements, simulated combat scenarios, and logistical operations designed to test interoperability and strategic alignment. Both nations aim to improve mutual understanding of their military doctrines, enhance communication channels, and share expertise on modern battlefield challenges. The exercises will also provide an opportunity to evaluate both countries' ability to cooperate in the face of regional threats, ensuring that their forces can function seamlessly together."
 AtM_wargames.2.a:0 "Interesting"
 
 #############################
 #   War Exhaustion Events   #
 #############################
 
 war_exhaustion.1.t:0 "Fall of [target_state.getName]"
 war_exhaustion.1.d:0 "We have lost control of [target_state.getName] to the enemy. The [ROOT.GetAdjective] people's faith in our war effort has been shaken, and voices calling for peace talks are growing louder. War weariness is spreading, and people are looking for someone to blame for this setback. Our position has been weakened, and doubts about our leadership are emerging. We must retake the initiative and push the hostile forces out of [ROOT.getNameDef]. A successful counteroffensive is needed to restore confidence in our war effort."
 war_exhaustion.1.a:0 "This is a catastrophe!"
 war_exhaustion.2.t:0 "Liberation of [target_state.getName]"
 war_exhaustion.2.d:0 "We have retaken control of [target_state.getName] from the enemy. This victory has begun to restore the [ROOT.GetAdjective] people's confidence in our war effort. The successful counteroffensive demonstrates that our forces are capable of reversing earlier setbacks. Morale among our troops has improved, and public support for the war is recovering. The voices calling for peace talks have grown quieter. This operation proves that we can reclaim what was lost and push back against enemy aggression."
 war_exhaustion.2.a:0 "Our forces have prevailed."
 
 ##########################
 #   Indochinese Events   #
 ##########################
 
 AtM_indochina.1.t:0 "Saigon has been recaptured!"
 AtM_indochina.1.desc:0 "We have managed to take back Saigon from the rebels! This is an important step on the way to victory. With Saigon back in our hands, we have shown that the French presence in this area is anything but over."
 AtM_indochina.1.a:0 "Interesting"
 AtM_indochina.2.t:0 "The Indochina War – Victory!"
 AtM_indochina.2.desc:0 "The communist threat in Vietnam has been eliminated. The so-called Democratic Republic of Vietnam is no more and once again, Indochina is under control of its rightful owner. Time will tell how the colony will be ruled in the future, but for now, we remain unchallenged masters of the region."
 AtM_indochina.2.a:0 "Great!"
 AtM_indochina.3.t:0 "Fall of Saigon"
 AtM_indochina.3.desc:0 "In recent days, Saigon falls to the advancing forces of the Allies and the French, following Japan's defeat in World War II. The city, previously controlled by the Viet Minh, is recaptured by the French as they attempt to reassert their colonial dominance in Vietnam. French colonial troops, supported by British forces, have swept through the southern districts, overwhelming the hastily organized Viet Minh defenses. The fall of this strategic port city represents not only a military defeat but also a symbolic blow to Vietnamese aspirations for immediate independence. This marks a pivotal moment in the struggle for Vietnamese independence, as the Viet Minh’s efforts to hold the south are crushed. The streets that once echoed with cries of liberation now witness the return of colonial authority, foreshadowing a long and bitter struggle that lies ahead."
 AtM_indochina.3.a:0 "Interesting"
 AtM_indochina.3.b:0 "..."
 AtM_indochina.4.t:0 "Fall of Hue"
 AtM_indochina.4.desc:0 "Today, Hue falls to the advancing French forces after the Japanese surrender. The city, previously under the control of the Viet Minh, is recaptured by the French as they move to restore their colonial authority in Vietnam. This marks a significant blow to the Viet Minh’s resistance in central Vietnam and sets the stage for continued conflict as the struggle for independence intensifies. The ancient imperial capital, with its historic citadel and royal palaces, holds deep cultural significance for the Vietnamese people, making its loss particularly devastating to nationalist morale. French colonial administrators are already moving to reestablish their administrative control over the region, while Viet Minh forces retreat to the countryside to continue their guerrilla campaign."
 AtM_indochina.4.a:0 "Interesting."
 AtM_indochina.4.b:0 "Bastards"
 AtM_indochina.5.t:0 "Vietnamese Rebels are fighting us!"
 AtM_indochina.5.desc:0 "TODO"
 AtM_indochina.5.a:0 "Those damn rebels!"
 AtM_indochina.6.t:0 "The French Requests Our Help on the Occupation of Saigon"
 AtM_indochina.6.desc:0 "French authorities have requested our assistance in securing Saigon and restoring order in southern Indochina. With Japanese forces still awaiting disarmament and nationalist unrest spreading through the city, the situation threatens to collapse before French control can be reestablished. Our commanders in Southeast Asia argue that a limited British presence would stabilize the region, protect Allied prisoners and civilians, and ensure a proper occupation of the territory."
 AtM_indochina.6.a:0 "Certainly."
 AtM_indochina.6.b:0 "The Empire will not be affiliated with other territories."
 AtM_indochina.7.t:0 "London Accepts"
 AtM_indochina.7.desc:0 "London has agreed to assist in the occupation of Saigon and the restoration of order in southern Indochina. British forces will help oversee the disarmament of remaining Japanese troops, secure key positions in the city, and protect Allied prisoners and civilians while French authority is reestablished. Though nationalist unrest continues to spread, British cooperation gives our return to Indochina the military weight and international legitimacy needed to begin Operation Masterdom."
 AtM_indochina.7.a:0 "Excellent! Let the operation begin."
 AtM_indochina.8.t:0 "London Refuses"
 AtM_indochina.8.desc:0 "London has refused to commit British forces to the occupation of Saigon, citing its own imperial burdens and reluctance to become involved in the restoration of French colonial authority. This decision leaves our position in southern Indochina far more uncertain, with Japanese forces still awaiting disarmament and nationalist unrest spreading through the city. Nevertheless, France cannot abandon its rights in Indochina. Operation Masterdom will proceed, with or without British support."
 AtM_indochina.8.a:0 "Masterdom will still be executed!"
 AtM_indochina.9.t:0 "The French Retake Hanoi"
 AtM_indochina.9.desc:0 "The French decided to set an end to the communist rebellion in northern Vietnam. Now that the control of the region is no longer in doubt, all Chinese troops have been withdrawn. We did, however, get a financial compensation from the French government"
 AtM_indochina.9.a:0 "Interesting"
 AtM_indochina.10.t:0 "Transfer of Control in Nha Trang to Paris"
 AtM_indochina.10.desc:0 "The British forces have successfully completed their mission in Nha Trang, and control of the city has been transferred back to the French administration. With the region now secure and French authority reestablished, our troops will begin their withdrawal, leaving the responsibility of maintaining order and stability to the local authorities. The operation has demonstrated our commitment to supporting our allies and ensuring the security of Indochina during this critical period of transition."
 AtM_indochina.10.a:0 "Our Job in Indochina is done"
 AtM_indochina.11.t:0 "British Troops Withdraw from Nha Trang"
 AtM_indochina.11.desc:0 "The British forces have completed their mission in Nha Trang and are now withdrawing from the region. With the city secured and French authority reestablished, our troops will return home, leaving the responsibility of maintaining order and stability to the French administration. The successful operation has demonstrated our commitment to supporting our allies and ensuring the security of Indochina during this critical period of transition."
 AtM_indochina.11.a:0 "Good, we can now open another front against the rebels"
 AtM_indochina.12.t:0 "Lao Issara Coup"
 AtM_indochina.12.desc:0 "The Lao Issara, a nationalist movement in Laos, has staged a coup against the existing government. The group, which has been advocating for independence from French colonial rule, has seized key government buildings and declared itself the new authority in the country. This sudden political upheaval has thrown Laos into uncertainty, with the potential for civil unrest and conflict. The international community is closely monitoring the situation, as the coup could have significant implications for regional stability and the future of French influence in Southeast Asia."
 AtM_indochina.12.a:0 "New age for Laos"
 AtM_indochina.13.t:0 "Signing the Franco-Chinese Accord"
 AtM_indochina.13.desc:0 "On this day, the Franco-Chinese Accord was signed, The French agreed to renounce their concessions in China, including Shanghai, to return Guangzhouwan to the Republic of China, and to improve the legal status and privileges of the overseas Chinese living in Indochina among other things. In exchange, the Chinese agreed to pull their troops out of northern Indochina and to recognize the French protectorate over Annam, Tonkin, and Laos. The accord was a significant diplomatic achievement, reflecting the complex interplay of colonial interests and regional politics in Southeast Asia during this period."
 AtM_indochina.13.a:0 "We agree to the accord."
 AtM_indochina.13.b:0 "We disagree with the terms..."
 AtM_indochina.14.t:0 "China agrees to the Franco-Chinese Accord"
 AtM_indochina.14.desc:0 "The Chinese government has agreed to the terms of the Franco-Chinese Accord, marking a significant diplomatic development in the region."
 AtM_indochina.14.a:0 "This is a step in the right direction."
 FRA_give_concessions_1946_franco_chinese_accord:0 ""...We will renounce our concessions in China, including Shanghai, and return Guangzhouwan to the Republic of China. We will also improve the legal status and privileges of the overseas Chinese living in Indochina. In exchange, we expect the Chinese to pull their troops out of northern Indochina and recognize our protectorate over Annam, Tonkin, and Laos...""
 AtM_indochina.15.t:0 "China fully retreats from the 16th Parallel"
 AtM_indochina.15.desc:0 "The Chinese government has decided to withdraw all its forces from the 16th Parallel, effectively ending its involvement in the Indochina conflict."
 AtM_indochina.15.a:0 "Good Breakthrough."
 AtM_indochina.16.t:0 "China disagrees with the Franco-Chinese Accord"
 AtM_indochina.16.desc:0 "The Chinese government has expressed reservations about the terms of the Franco-Chinese Accord, citing concerns over sovereignty and territorial integrity."
 AtM_indochina.16.a:0 "This complicates matters."
 AtM_indochina.17.t:0 "Fall of Hanoi"
 AtM_indochina.17.desc:0 "The city of Hanoi has fallen to the French Forces, marking a significant defeat for Viet Minh in the Indochina War."
 AtM_indochina.17.a:0 "This is a major setback for the Viet Minh."
 AtM_indochina.17.b:0 "Fuck."
 AtM_indochina.18.t: "Ratification of the Geneva Accords"
 AtM_indochina.18.desc:0 "The Geneva Accords have been ratified, officially ending the Indochina War and establishing a framework for peace and the future political landscape of Vietnam."
 AtM_indochina.18.a:0 "Victory of the Vietnamese people!"
 AtM_indochina.18.b:0 "We lost the war, but we will recover."
 AtM_indochina.18.c:0 "This is a significant step towards peace."
 
 ##########################
 #   PRC Chinese Events   #
 ##########################
 
 AtM_PRC.1.t:0 "Victory in the People's Liberation War!"
 AtM_PRC.1.desc:0 "Our People's Liberation Army, backed by the whole nation, has been fighting heroically and selflessly to defend the territorial sovereignty of our homeland, to protect the people's lives and property, and to relieve the people of their sufferings. Now, the People's War of Liberation has been essentially won, the reactionary rule of the Nationalist government overthrown, and the majority of the people in the country have been liberated. The Central People's Government Council has decided to declare to the governments of all other countries that our regime is the sole legal government representing all the people of the People's Republic of China."
 AtM_PRC.1.a:0 "A glorious day"
 
 AtM_PRC.2.t:0 "People's Republic of China Declared"
 AtM_PRC.2.desc:0 "Amidst the ruins of a long and brutal civil war, the Chinese Communist Party (CCP) declared the establishment of the People's Republic of China in a ceremony held in Tiananmen Square, Beijing. Mao Zedong, the chairman of the CCP, proclaimed the dawn of a new era, emphasizing the party's commitment to national unity, socialism, and the empowerment of the Chinese people. The proclamation marks the end of the Chinese Civil War, which has left the nation deeply divided and in turmoil. With the Nationalist government retreating to Taiwan, the PRC stands as the legitimate government of China, promising to restore order, reclaim sovereignty, and lead the country towards prosperity."
 AtM_PRC.2.a:0 "Retreat into Taiwan"
 AtM_PRC.2.b:0 "Fight on"
 AtM_PRC.2.c:0 "Interesting"
 
 AtM_PRC.3.t:0 "People's Republic of China Declared"
 AtM_PRC.3.desc:0 "Amidst the ruins of a long and brutal civil war, the Chinese Communist Party (CCP) declared the establishment of the People's Republic of China in a ceremony held in Tiananmen Square, Beijing. Mao Zedong, the chairman of the CCP, proclaimed the dawn of a new era, emphasizing the party's commitment to national unity, socialism, and the empowerment of the Chinese people. The proclamation marks the end of the Chinese Civil War, which has left the nation deeply divided and in turmoil. With the Nationalist government retreating to Taiwan, the PRC stands as the legitimate government of China, promising to restore order, reclaim sovereignty, and lead the country towards prosperity."
 AtM_PRC.3.a:0 "It's over."
 AtM_PRC.3.b:0 "Interesting"
 
 AtM_PRC.4.t:0 "PRC-RoC Ceasefire"
 AtM_PRC.4.desc:0 "Following the conclusion of the Chinese Civil War, the Republic of China (ROC) retreated to Taiwan in late 1949, leading to a ceasefire agreement with the People's Republic of China (PRC). This agreement marked a critical halt to large-scale hostilities, allowing both factions to stabilize their territories. While the ROC established its government in Taiwan, the PRC consolidated its control over the mainland. Though the ceasefire aimed to prevent further devastation, tensions remained high as both sides continued to assert their legitimacy. The world watches as this fragile peace sets the stage for the future of China, with the threat of renewed conflict ever-present."
 AtM_PRC.4.a:0 "Peace at last"
 AtM_PRC.4.b:0 "Interesting"
 
 AtM_PRC.5.t:0 "USA Blockades the Taiwan Strait"
 AtM_PRC.5.desc:0 "The imperialist United States has sent a fleet to blockade the Taiwan Strait, preventing us from dealing the final blow to the Nationalists cowering in Taiwan."
 AtM_PRC.5.a:0 "We are forced into a cease-fire"
 AtM_PRC.5.b:0 "The USA will not stand in our way"
 
 AtM_PRC.6.t:0 "Communist China Declares War!"
 AtM_PRC.6.desc:0 "The People's Republic of China has declared war on the United States in response to the enforcement of a blockade in the Taiwan Strait. The U.S. implemented the blockade to support the Republic of China in Taiwan, aiming to restrict PRC access and deter military actions. Perceiving the blockade as an act of aggression, the PRC mobilized its military, vowing to reunify Taiwan with the mainland. Chairman Mao Zedong called upon the Chinese people to defend their sovereignty and national dignity. This declaration of war has sent shockwaves through the international community, raising fears of a broader conflict in the Asia-Pacific region. As both nations prepare for confrontation, the stability of the region hangs in the balance, with global warfare looming on the horizon."
 AtM_PRC.6.a:0 "We will not take this lightly."
 AtM_PRC.6.b:0 "This will be their undoing."
 AtM_PRC.6.c:0 "Interesting"
 
 AtM_PRC.7.t:0 "Support for the Unification of Korea"
 AtM_PRC.7.desc:0 "Japan's rise to power at the beginning of the 20th century began with the Japanese victory over Russia in 1905. Shortly afterwards, Japan invaded Korea and annexed it 1910. Korea was a part of Japan until its defeat in World War II, when the annexation treaty was declared void and the country was divided in a Soviet and an American occupation zone and later into two different states. Now, the North Koreans want to take over the South by force and ask for our help. We can send weapons, supplies and maybe volunteers, but any open warfare in the region bears the risk of Western intervention. If Korea is unified under a friendly government, however, we will be one big step closer to bringing the revolution to all of Asia. And if we join the Koreans, we may end the war before anybody can react."
 AtM_PRC.7.a:0 "Send weapons and volunteers"
 AtM_PRC.7.b:0 "Join the Koreans directly"
 AtM_PRC.7.c:0 "No, this is too risky"
 
 AtM_PRC.8.t:0 "Transferring Kalgan to Chinese Communists"
 AtM_PRC.8.desc:0 "TODO"
 AtM_PRC.8.a:0 "The tide has turned"
 
 ###########################
 #    Vietnamese Events    #
 ###########################

 AtM_VIN.1.t:0 "State of Vietnam Referendum"
 AtM_VIN.1.desc:0 "The State of Vietnam is at a crossroads, and the people are being called upon to decide the future of their nation. A referendum has been organized to determine whether Bao Dai will continue to lead as the head of state or if Ngo Dinh Diem will take the reins of power. This pivotal moment in Vietnamese history will shape the political landscape for years to come, as citizens weigh their options and consider the implications of their choice on the country's stability, governance, and path forward."
 AtM_VIN.1.a:0 "Bao Dai stays in power!"
 AtM_VIN.1.b:0 "Ngo Dinh Diem takes power!"
 
 ###########################
 #   North Korean Events   #
 ###########################
 
 AtM_DPK.2.t:0 "Kim Il-Sung Returns to Korea"
 AtM_DPK.2.desc:0 "After years of struggle against Japanese colonial rule and unwavering dedication to the cause of Korean independence, Kim Il-sung returns to his homeland. Arriving in a nation recently liberated from the shackles of imperialism, he is greeted as a hero by the local populace, who yearn for stability and a unified identity in the aftermath of war."
 AtM_DPK.2.a:0 "A great victory!"
 
 AtM_DPK.3.t:0 "Kim Il-Sung Kept by the Soviets"
 AtM_DPK.3.desc:0 "It is with great sorrow that we announce the Soviets have decided to keep Kim Il Sung within their borders. While this is a devastating setback for our aspirations, we cannot afford to wallow in despair. Instead, we must navigate through these challenging times and search for alternative solutions. Perhaps peaceful independence was never an option, and the time has come to consider declaring a war of independence"
 AtM_DPK.3.a:0 "Raise the Militias!"
 
 AtM_DPK.4.t:0 "Our Uncertain Future"
 AtM_DPK.4.desc:0 "There is now a great fork in the road ahead of us: What does the future hold for our nation? We must decide which ideology to embrace. Should we focus on Nationalism, striving to expand the territory of our homeland? Should we remain loyal to Communism, dedicating ourselves to the liberation of Korea? Or should we turn towards Democracy, acknowledging the failures of communism and seeking peaceful reunification with Korea?"
 AtM_DPK.4.a:0 "Democracy Forward!"
 AtM_DPK.4.b:0 "Nationalism is Necessary."
 AtM_DPK.4.c:0 "Communism is the only way!"
 
 AtM_DPK.5.t:0 "Who Will Lead Us?"
 AtM_DPK.5.desc:0 "As the Soviets decided to end the current civil occupation of our country, the question of who shall take power arises. For that reason, the Provisional Legislative Authority of [DPK.GetNameDef] has reunited to choose between three candidates:\n-Kim Il-Sung, a satunch commmunist and guerrilla fighter;\n-Pak Hon-Yong, the current chairman of the Communist Party of Korea;\n-Cho Man-Sik, a famous peaceful activist."
 AtM_DPK.5.a:0 "Kim Il-Sung"
 AtM_DPK.5.b:0 "Pak Hon-Yong"
 AtM_DPK.5.c:0 "Cho Man-Sik"
 AtM_DPK.5.d:0 "The decision is delayed"
 
 AtM_DPK.6.t:0 "Change the Party Name?"
 AtM_DPK.6.desc:0 "The Korean communist Party is very old and we maybe should change its name to legitimize even more our new government."
 AtM_DPK.6.a:0 "We are, first and foremost, the party of the Workers"
 AtM_DPK.6.b:0 "No need to change, keep the name as it is"
 AtM_DPK.6.c:0 "Let's distance ourselves from extremism"
 
 AtM_DPK.7.t:0 "[DPK.GetNameDefCap] wants to join the [SOV.GetFactionName]"
 AtM_DPK.7.desc:0 "Seeing as the leadership of Pak Hon-Yong has brought [DPK.GetNameDef] closer to our sphere of influence, it shouldn't be a surprise that they now have an interest in joining our faction."
 AtM_DPK.7.a:0 "Sure"
 AtM_DPK.7.b:0 "Nah"
 
 AtM_DPK.8.t:0 "[FROM.GetNameDefCap] Accept Our Request"
 AtM_DPK.8.desc:0 "We got the news that the [FROM.GetAdjective] government accepted our request."
 AtM_DPK.8.a:0 "Hurray!"
 
 AtM_DPK.9.t:0 "[FROM.GetNameDefCap] Declined Our Request"
 AtM_DPK.9.desc:0 "We got the news that the [FROM.GetAdjective] government declined our request."
 AtM_DPK.9.a:0 "Aww!"
 
 AtM_DPK.10.t:0 "[DPK.GetNameDefCap] Requests Control over Yanbian"
 AtM_DPK.10.desc:0 "Seeing as the leadership of Pak Hon-Yong has brought [DPK.GetNameDef] closer to our sphere of influence and that the region has been historically inhabited by koreans, today the [DPK.GetAdjective] government has asked us for control over the Autonomous Region."
 AtM_DPK.10.b:0 "Who do they think they are?!"
 
 AtM_DPK.13.t:0 "The Korean Friendship Act"
 AtM_DPK.13.desc:0 "The new leadership in North Korea having won their independence war against the Soviets have been hard at work establishing their nation.\n\nToday, [DPK.GetAdjective] officials have arrived in Seoul to discuss possible means for reunification."
 AtM_DPK.13.a:0 "Together, we are stronger."
 AtM_DPK.13.b:0 "We must respect each others independence."
 
 AtM_DPK.14.t:0 "South Korean Response: Accepted"
 AtM_DPK.14.desc:0 "Our officials came back from the discussions hosted in South Korea with ecstatic news; the response was accepted, and today, North and South Korea will be merged into one country yet again!"
 AtM_DPK.14.a:0 "Excellent!"
 
 AtM_DPK.15.t:0 "South Korean Response: Rejected"
 AtM_DPK.15.desc:0 "Our officials came back from the discussions hosted in South Korea with bad news; our objective of reunification peacefully was rejected. We have to decide whether we accept division or do we forcefully interject and reestablish unification between our countries."
 AtM_DPK.15.a:0 "Shame."
 
 AtM_DPK.16.t:0 "The First Korean Meeting"
 AtM_DPK.16.desc:0 "Officials from both Koreas have met for the first time on the border near Ch'angam-dong. The meeting had been going perfectly until the South Korean general secretary named South Korea the beacon of Korea due to their initial signs of democracy and freedom. This action taken by the secretary infuriated the North Korean staff who demanded an immediate response to this act of aggression. Our response was simple:"
 AtM_DPK.16.a:0 "The Korean people have no single beacon."
 AtM_DPK.16.b:0 "A colony cannot claim to be the beacon of a free people."
 
 AtM_DPK.17.t:0 "Offer from the North"
 AtM_DPK.17.desc:0 "Another meeting with the North was done today, they are offering us to join their new alliance which has the sole purpose to protect the people of asia from potential invasion. This offer could serve our benefit and can help us work together and protect us from possible foreign intervention."
 AtM_DPK.17.a:0 "We will gladly join."
 AtM_DPK.17.b:0 "We should prefer neutrality."
 
 AtM_DPK.18.t:0 "The Question of Religion"
 AtM_DPK.18.desc:0 "As the newly appointed authorities started their debate over the future of the country, one issue was brought up which divided the current government in half: religion. While the revivalist branch advocated for a return to Buddhism in society, the Revanchist faction has made it clear that to modernize the state, every form of religion should be banned."
 AtM_DPK.18.a:0 "We should restore our traditions!"
 AtM_DPK.18.b:0 "Destroy the opium of the people!"
 
 AtM_DPK.19.t:0 "What to do with Communism?"
 AtM_DPK.19.desc:0 "As the political doctrine of the new state is being decided, the issue of Communism has been brought forward. While our country was a soviet colony, it remained under the soviet bear only for a short time, after the revolution, however, there still are living here some of the former communists which escaped to our country during the Soviet era."
 AtM_DPK.19.a:0 "Sentence them to death!"
 AtM_DPK.19.b:0 "Leave them alone, some might come in handy in the future."
 
 AtM_DPK.20.t:0 "The Economy, Fools!"
 AtM_DPK.20.desc:0 "During the Joseon Dinasty, the econoic system in Korea was, for a lot of centuries, a command confucian-based economy. While the Revivalist explained their desire to return to this kind of system, the Revanchists explained their interests in corporatism, taking inspiration from the former fascist regimes."
 AtM_DPK.20.a:0 "Korea should return to its ways!"
 AtM_DPK.20.b:0 "National Corporatism for the win!"
 
 AtM_DPK.21.t:0 "The Role of Women"
 AtM_DPK.21.desc:0 "Women in korean society were traidtionally underrepresented in society as a consequence of confucianism. While the new state aspires to develop feeling of pride in its citizens regarding their history, that's still a controversial topic."
 AtM_DPK.21.a:0 "If it ain't broken, don't fix it!"
 AtM_DPK.21.b:0 "Women should have greater representation in society!"
 
 AtM_DPK.22.t:0 "The Image of the Monarchy"
 AtM_DPK.22.desc:0 "While our country was governed by a monarchy for some time, the government is split on whether to celebrate its image or not. The revivalist see it as a fundamental part of our history, while the Revanchists see it as nothing more than an outdated structure."
 AtM_DPK.22.a:0 "We should restore the Joseon Dinasty!"
 AtM_DPK.22.b:0 "The legacy of Goryeo is what will bring us forward!"
 AtM_DPK.22.c:0 "Death to all monarchs!"
 
 AtM_DPK.23.t:0 "Choosing the Direction of Propaganda"
 AtM_DPK.23.desc:0 "After we dealt with the Soviet partisans, our nation doesn't have a distinct identity from the south. To resolve this issue we could go two ways: propagandizing the nation as the cradle of Korean traditionalism or as the only true democratic Korea. The first option is heavily supported by the Revivalists, while the second by the Revanchists."
 AtM_DPK.23.a:0 "We are the cradle of korean culture!"
 AtM_DPK.23.b:0 "We are the true people's state!"
 
 AtM_DPK.24.t:0 "[DPK.GetNameDefCap] demands our subjugation"
 AtM_DPK.24.desc:0 "After influencing our politics by promoting nationalist movements in our nation, [DPK.GetNameDef] has granted us an ultimatum where we would either become one of their vassals or prepare to face them of in a military invasion"
 AtM_DPK.24.a:0 "Accept"
 AtM_DPK.24.b:0 "We will never bow down"
 
 AtM_DPK.25.t:0 "[DPK.GetNameDefCap] Asks Us for Manchuria"
 AtM_DPK.25.desc:0 "After installing a nationalist government, [DPK.GetNameDef] has asked us if they could obtain ownership over the territories of southern Manchuria"
 AtM_DPK.25.a:0 "Concede to their demands"
 AtM_DPK.25.b:0 "Who do they think they are?"
 
 AtM_DPK.26.t:0 "The First People's Elections"
 AtM_DPK.26.desc:0 "Today marks an historic date in the history of our country, since it had the first truly anarchist election in the history of the world.\n\n4 different factions were competing for the majority in the Korean People's Council, which is divided between the Orthodoxes, which encompass the main founders of the Korean anarchist movement, the "Easterners", which advocate for closer cooperation with the Soviets, the nationalists, which push for rampant militarization to defend the revolution, and the neutral clique, formed mainly of non-aligned members."
 AtM_DPK.26.a:0 "The Orthodox Clique remains in command"
 AtM_DPK.26.b:0 "The Easteners take charge"
 AtM_DPK.26.c:0 "The Nationalists gain the majority"
 AtM_DPK.26.d:0 "No Majority is achieved, so a Neutral-led coalition government is formed"
 
 AtM_DPK.27.t:0 "Question of Our Capital"
 AtM_DPK.27.desc:0 "The question of our capital has been raised, as the current capital is located in a region that is not easily defensible and is vulnerable to foreign intervention. The government is considering relocating the capital to a more secure location that can better serve as the administrative and political center of our nation."
 AtM_DPK.27.a:0 "Seoul is the heart of our nation, and we must keep it as our capital."
 AtM_DPK.27.b:0 "Pyongyang is home of the revolution, and we should move our capital there."
 
 #######################
 #   Canadian Events   #
 #######################
 
 AtM_CAN.1.t:0 "Britain Offers Newfoundland and Labrador"
 AtM_CAN.1.desc:0 "Britain has offered to transfer the territory of Newfoundland and Labrador to our nation. The island dominion lost its self-governance during the Great Depression and has been under direct British administration ever since. London now seeks to resolve Newfoundland's political status and sees confederation with Canada as the most practical solution. The territory would bring valuable resources and strategic Atlantic ports to our confederation.\n\nHow shall we respond?"
 AtM_CAN.1.a:0 "Accept the offer"
 AtM_CAN.1.b:0 "Decline the offer"
 
 ######################
 #   English Events   #
 ######################
 
 AtM_ENG.1.t:0 "Egypt Nationalizes the Suez Canal"
 AtM_ENG.1.desc:0 "Egyptian President Nasser has nationalized the Suez Canal Company and seized control of the waterway. This brazen act threatens British strategic interests and sets a dangerous precedent for our position across the Middle East and Africa. The canal represents not only a vital trade route connecting Europe to Asia but also a symbol of British influence in the region. Shareholders in the Suez Canal Company face massive losses, and our ability to project power east of Suez now depends on Egyptian goodwill. Some in government demand immediate military action to reverse this decision, while others counsel restraint and diplomatic solutions."
 AtM_ENG.1.a:0 "Prepare a military response"
 AtM_ENG.1.b:0 "Accept the new reality"
 AtM_ENG.2.t:0 "The Birth of Israel"
 AtM_ENG.2.desc:0 "After nearly three decades of administration under the League of Nations Mandate, Britain's presence in Palestine has become untenable. Decades of rising tension between Jewish and Arab communities, coupled with international pressure, mounting military costs, and the overwhelming refugee crisis in the wake of the Holocaust, have made continued British stewardship of the territory impossible. The newly formed United Nations has voted for a partition plan that would divide Palestine into separate Jewish and Arab states, and Britain has no choice but to withdraw its forces from the region. Both the State of Israel and the Arab state of Palestine will be established as independent nations upon our departure."
 AtM_ENG.2.a:0 "Play as [ENG.GetNameDef]"
 AtM_ENG.2.b:0 "Play as [ISR.GetNameDef]"
 AtM_ENG.2.c:0 "Play as [PAL.GetNameDef]"
 AtM_ENG_election.1.t:0 "The 1950 General Election"
 AtM_ENG_election.1.desc:0 "Britain has gone to the polls for the first general election since Labour's landslide victory in 1945. Clement Attlee asks the country to endorse the welfare state, nationalisation, and the programme of post-war reconstruction, while Winston Churchill's Conservatives campaign against further socialism and promise a change of direction. Labour has lost much of its overwhelming parliamentary advantage, and the result will determine who leads Britain into the new decade."
 AtM_ENG_election.1.a:0 "Attlee secures a narrow Labour majority."
 AtM_ENG_election.1.b:0 "Churchill returns to Downing Street."
 AtM_ENG_election.2.t:0 "The 1951 General Election"
 AtM_ENG_election.2.desc:0 "Only twenty months after the last election, Clement Attlee has returned to the country seeking a workable majority. Labour enters the contest exhausted by six years in office and divided over rearmament, while Winston Churchill leads a Conservative campaign promising stability and an end to austerity. The vote is exceptionally close, but Britain's electoral system will decide which party can form a government."
 AtM_ENG_election.2.a:0 "Churchill forms a Conservative government."
 AtM_ENG_election.2.b:0 "Attlee's Labour government survives."
 AtM_ENG_election.3.t:0 "Churchill Resigns"
 AtM_ENG_election.3.desc:0 "After four years back in Downing Street, Sir Winston Churchill has resigned as Prime Minister as age and poor health increasingly limit his ability to govern. His long-designated successor, Foreign Secretary Sir Anthony Eden, has been asked to form a government. Eden inherits a Conservative majority but is expected to seek his own mandate from the electorate."
 AtM_ENG_election.3.a:0 "Anthony Eden takes office."
 AtM_ENG_election.4.t:0 "The 1955 General Election"
 AtM_ENG_election.4.desc:0 "Prime Minister Anthony Eden has called a general election only weeks after succeeding Winston Churchill. Eden seeks a personal mandate and campaigns on the prosperity and stability achieved under the Conservatives, while Clement Attlee leads Labour into his fifth general election. With rationing ended and living standards improving, the electorate must decide whether to continue Conservative government."
 AtM_ENG_election.4.a:0 "Eden increases the Conservative majority."
 AtM_ENG_election.4.b:0 "Attlee returns Labour to government."
 AtM_ENG_election.5.t:0 "Eden Resigns"
 AtM_ENG_election.5.desc:0 "Sir Anthony Eden has resigned as Prime Minister in the aftermath of the Suez Crisis. The failed intervention badly damaged his authority at home and abroad, while continuing ill health made his position impossible to sustain. Following consultations within the Conservative Party and with the Crown, Chancellor of the Exchequer Harold Macmillan has been asked to form a government."
 AtM_ENG_election.5.a:0 "Harold Macmillan takes office."
 AtM_ENG_election.6.t:0 "The 1959 General Election"
 AtM_ENG_election.6.desc:0 "Harold Macmillan has asked the country to renew the Conservative mandate after nearly three years of economic recovery and rising living standards. The government campaigns on prosperity and Macmillan's reassuring leadership, while Labour argues that the benefits of affluence have been distributed unevenly. The Conservatives enter polling day confident that the public will choose continuity."
 AtM_ENG_election.6.a:0 "Macmillan wins a third Conservative term."
 
 ####################
 #   Italy Events   #
 ####################
 
 AtM_ITA.0.t:0 "The Dust Clears"
 AtM_ITA.0.desc:0 "Italy’s history is far from simple, being in the centre of the mediterranean, it has been home to the Roman Empire and, after its dissolution to many different kingdoms and regional states, until its eventual reunification in the 19th century.\n\nToday, the peninsula stands wounded by the scars of the Second World War, of Mussolini’s fascist dictatorship, whose sympathizers have still not been dealt with, and of the allied bombings which have left in ruins the local economy.\n\nBut, as democracy and peace seem to be returning, the sky seems to be clearing up for Italy."
 AtM_ITA.0.a:0 "L'Italia Chiamò"
 AtM_ITA.1.t:0 "The Monarchy Referendum"
 AtM_ITA.1.desc:0 "With the victory of the Anti-fascist forces in the Second World War, led by the CLN, Italy has been swept by a sentiment of republicanism, especially within Left-wing parties. But, with also many members of the Christian Democratic Party being much more hostile towards the monarchy then before, a referendum to decide the institutional future of our country was held, the first with universal suffrage. With a very small margin, the victory goes to..."
 AtM_ITA.1.m:0 "The Monarchy"
 AtM_ITA.1.r:0 "The Republic"
 AtM_ITA.2.t:0 "The 1946 General Elections"
 AtM_ITA.2.desc:0 "With the institutional referendum, today the people also had the duty to vote for whoever will run the country in the newly founded Assemblea Costituente, which will have the power to write a new constitution for the country. The three frontrunners in this election are: the Christian Democratic Party, the Italian Socialist Party and the Communist Party. The winner is..."
 AtM_ITA.2.a:0 "the DC (Democrazia Cristiana)"
 AtM_ITA.2.b:0 "the PSI (Partito Socialista Italiano)"
 AtM_ITA.2.c:0 "the PCI (Partito Comunista Italiano)"
 AtM_ITA.3.t:0 "The King Steps In"
 AtM_ITA.3.desc:0 "With the communist victory in the recent Italian elections, the king has refused to congratulate with the winners and gave himself emergency powers to "stop the eventual founding of a dictatorship". Whether it was for the good of his people or just because he was scared for his own head is unknown, but one thing is sure: the birth of an Italian democracy is still and will still be just a dream"
 AtM_ITA.3.a:0 "Worrying"
 AtM_ITA.4.t:0 "The 1948 General Elections"
 AtM_ITA.4.desc:0 "Today marks the day that the first general elections after the signing of the new constitution were held. The people today went to the ballots to vote for their favourite candidate, who will have the opportunity to form new government. The results are in, and the winner is..."
 AtM_ITA.4.dc:0 "The Christian Democracy"
 AtM_ITA.4.fdp:0 "The Democratic Popular Front"
 AtM_ITA.5.t:0 "The 1953 General Elections"
 AtM_ITA.5.desc:0 "Today, the people went to the ballots to vote for the incoming parliamentary elections, the results are in and the winner is..."
 AtM_ITA.5.dc:0 "The Christian Democracy"
 AtM_ITA.5.fdp:0 "The Democratic Popular Front"
 AtM_ITA.6.t:0 "The Flag of the Republic"
 AtM_ITA.6.desc:0 "The ideals of an Italian republic stretch far back in time, with some historic accounts referenced still well into the XVIII century. As far as our flag, however, we don't have much choices, with the Italian flag now linked with the Cisalpine Republic one, created by Napoleon in the XIX century.\n\nAs we transition into a new form of governance two choices are presented to us: simply removing the old royal coat of arms for the flag, which has been in use as a de-facto flag since 1946, or adding at the centre of the flag the new coat of arms of the republic."
 AtM_ITA.6.a:0 "Let's keep things simple!"
 AtM_ITA.6.b:0 "Let us rejoice the republican symbols!"
 AtM_ITA.7.t:0 "The 1958 General Elections"
 AtM_ITA.7.dc:0 "The Christian Democracy"
 AtM_ITA.7.fidc:0 "the FIDC"
 AtM_ITA.7.fudl:0 "the FUDL"
 AtM_ITA.7.fdp:0 "The Democratic Popular Front"
 AtM_ITA.8.t:0 "Who to Support in the Local Elections?"
 AtM_ITA.8.desc:0 "Since the Regional Elections are coming fast and it is prospected that we won't have a majority in all of them, we should decide whether we should prioritize local coalitions with the republican PSDI and PRI or with the monarchist PNM."
 AtM_ITA.8.a:0 "Minor Republican Parties"
 AtM_ITA.8.b:0 "The PNM"
 AtM_ITA.9.t:0 "Second Referndum Held"
 AtM_ITA.9.desc:0 "Even after the infamous 2nd of June 1946, the republican spirit in Italy never managed to go away, instead it continued to manifest in the left-wing parties.\n\nToday, as a consequence of the agreement between the DC and the PRI, the people have been called to respond to the same question it was asked to them years ago: should Italy stay a monarchy or become a republic?"
 AtM_ITA.9.a:0 "The republic wins with a narrow margin"
 AtM_ITA.10.desc:0 "Even after the infamous 2nd of June 1946, the monarchism in Italy never managed to go away, instead it continued to manifest in the conservative Partito Nazionale Monarchicho.\n\nToday, as a consequence of the agreement between the DC and the PNM, the people have been called to respond to the same question it was asked to them years ago: what's be better for Italy, a monarchy or a republic?"
 AtM_ITA.10.a:0 "The monarchy returns!"
 AtM_ITA.11.t:0 "Alcide de Gasperi leaves Politics"
 AtM_ITA.11.desc:0 "After 7 years as the leader of the Democrazia Cristiana, the time has also come for the old De Gasperi, which, after the fall of its government, has announced the end of his political carrer, which started lots of years ago within the catholic Partito Popolare Italiano.\n\nAs his popularity was enjoyed within all the wings of the DC, some people have been fearing for the future of the party."
 AtM_ITA.11.a:0 "Ciao, Alcide"
 AtM_ITA.12.t:0 "Opposition Requests Referendum on Divorce"
 AtM_ITA.12.desc:0 "As a consequence of our newly passed law that legalises the practice of divorce, the conservatives within the DC didn't wait to let their voice heard. Since the constitution lets the citizens ask the government for a referendum to remove the laws, with a petition of 500000 signatures, they have taken that opportunity and took it to the parliament. As a consequence of that, in about a month the people will go to the polls, with a question in mind: rejecting or accepting abortion?"
 AtM_ITA.12.a:0 "We have to win it!"
 AtM_ITA.13.t:0 "Referendum on Divorce"
 AtM_ITA.13.desc:0 "After two months of costant rallies, protests and demonstrations regarding the issue, the polls have now opened and the people will have to choose what will be the future for divorce in Italy. The polls are mixed on the issue, but it's possible that a defeat for the current government will probably be seen as a staggering defeat."
 AtM_ITA.13.a:0 "Divorce Stays"
 AtM_ITA.13.b:0 "Divorce has been ruled out"
 AtM_ITA.14.t:0 "Opposition Requests Referendum on Abortion"
 AtM_ITA.14.desc:0 "After their loss in the Divorce referendum, the DC has taken their time to, this time, attack the recently passed law legalising the practice of divorce. It appears that the population will be heading to the polls in another couple of months."
 AtM_ITA.14.a:0 "Again!?"
 AtM_ITA.15.t:0 "Referendum on Abortion"
 AtM_ITA.15.desc:0 "After two more months of rallies, protests and demonstrations, the people have, for the second time in a row, been called to the polls to choose what to do with the newly passed law regarding abortion. Since this proposition has been more radical than the one before, the government didn't put much hope in the law staying but, if it does happen, it will be a massive blow to the DC."
 AtM_ITA.15.a:0 "Abortion Stays"
 AtM_ITA.15.b:0 "Abortion has been ruled out"
 AtM_ITA.16.t:0 "Future of the Coalition"
 AtM_ITA.16.desc:0 "Since our recent victory in the elections, the question on whether we should open our coalition to other left-wing forces in our country has arisen.\nTogliatti, the leader of the PCI, has declared that he wouldn't mind incorporating minor parties into our coalition, as long as they seem to follow the socialist ideas of the bigger parties.\nThe leaders of the PSI, however, affirmed that they would enjoy the company of parties which are at least on the centre-left, such as the PRI."
 AtM_ITA.16.a:0 "We should encompass a broad coalition"
 AtM_ITA.16.b:0 "Our priority is socialism only"
 AtM_ITA.17.t:0 "The Small Splinter"
 AtM_ITA.17.desc:0 "One of the most difficult questions regarding the Front is whether or not to include the small Democratic Socialist Party, or PSDI. Born as a consequence of the PSI's friendly relationship with the soviet-aligned PCI, it has been the third most voted electoral coalition for quite some time.\nWhile the creation of the front was the main point of divergence, we might still get them to our side by promising them some ministries and a more moderate foreign policy.."
 AtM_ITA.17.a:0 "Invite them, they are not our enemies"
 AtM_ITA.17.b:0 "They should reconcile with the PSI"
 AtM_ITA.17.c:0 "We don't need them"
 AtM_ITA.18.t:0 "The Republicans"
 AtM_ITA.18.desc:0 "One of the main contending points within the front is the inclusion of the Republican Party, or PRI. While they are positioned on the left of the political spectrum, they seem to follow a school of thought which seems more akin to moderatism than socialism.\nHowever, having them within our coalition might bring them closer to our position and will be more stabilizing for our government."
 AtM_ITA.18.a:0 "Let them in"
 AtM_ITA.18.b:0 "We don't need them"
 AtM_ITA.19.t:0 "The Parri Plan"
 AtM_ITA.19.desc:0 "As a response to the PRI's doctrine of anti-communism, within the FDP appeared an idea of punishing them by promoting the creation of a new republican party within the sphere of italian politics. Such party would be following a more liberal version of socialism and would be aligned with the FDP. The search for its leader also didn't take very long, since the main candidate was Ferruccio Parri, prominent revolutionary fighter and former prime minister, whose popularity would be vital in isolating the PRI."
 AtM_ITA.19.a:0 "When he's ready, take him"
 AtM_ITA.20.t:0 "Rebranding of the PSIUP"
 AtM_ITA.20.desc:0 "As rumors began circulating within the PSIUP of a possible schism within its ranks, a proposal by Olindo Vernocchi to change the party name to its original one, the PSI, was approved in hopes of discouraging the secessionists from claiming the 50-year old legacy of the Party."
 AtM_ITA.20.a:0 "It's still more of the same"
 AtM_ITA.21.t:0 "Saragat Leaves the PSI"
 AtM_ITA.21.desc:0 "The claims of an incumbent secession within the ranks of the PSI turned out to be true as Giuseppe Saragat and other members of the Socialist Party, critical of its relationship with the Communists, declared the foundation of a new party, taking one of the previous name of the PSI."
 AtM_ITA.21.a:0 "Leftist Infighting"
 AtM_ITA.22.t:0 "Coalitions Form for the Nearby Elections"
 AtM_ITA.22.desc:0 "As the First Elections after the new constitution seem to get close, different parties have started forming their own joint-lists with other ideological neighbours. Within these, the most important is surely the one between the Socialist and the Communitst: the Democratic People's Front."
 AtM_ITA.22.a:0 "Interesting"
 AtM_ITA.23.t:0 "Birth of a Monster"
 AtM_ITA.23.desc:0 "As the previous regime lasted a whole 20 years on the peninsula, it shouldn't come as a surprise that some people are still nostalgic fot it. That's why today, in Rome, it was declared the founding of a new party inspired by the ideals of Mussolini: the Movimento Sociale Italiano."
 AtM_ITA.23.a:0 "Terrifying"
 AtM_ITA.24.t:0 "The FDP Unifies"
 AtM_ITA.24.desc:0 "After its proclamation in 1947, no one expected to see the Fronte Democratic Popolare to get this far. But, here we are, with a unified left-wing party in control of Italy. However, even after the costituent parties started to dissolve, the party is still divided between ideological factions."
 AtM_ITA.24.a:0 "Three cheers for us"
 AtM_ITA.25.t:0 "Choosing a Leader"
 AtM_ITA.25.desc:0 "After formerly unifing the Front, one issue remains unsolved: who should lead it? That is the purpose of the first national assembly, where all the four factions: the Revolutionaries (Heirs of the PCI and self-declared communists), the Reformists (Moderate socialists who are aligned more or less with the intellectuals of the Front), the Industrialists (Which run on a platform based on class collaboration, representing the Factory Owners) and the Youth Wing (Internationalist and Revolutionary) tried to run a separate candidate."
 AtM_ITA.25.a:0 "The Revolutionary Wing takes the stage"
 AtM_ITA.25.b:0 "The Youth secures the nomination, but fails to elect their candidate due to age requirements"
 AtM_ITA.25.c:0 "The Reformists manage to win enough votes"
 AtM_ITA.25.d:0 "Surprisingly, the Industralists manage to win"
 AtM_ITA.26.t:0 "Italy asks to join [USA.GetFactionName]"
 AtM_ITA.26.desc:0 "Even after the country voted for a joint communist-socialist ticket in the 1948 elections, the current government of Italy decided to contact us to join [USA.GetFactionName] due to party restructuring and rising reformism. Even if they might not be totally politically aligned with us, the peninsula still sits as in a geographical key point, and would probably be beneficial to us."
 AtM_ITA.26.a:0 "Let them in"
 AtM_ITA.27.t:0 "The Role of Nenni"
 AtM_ITA.27.desc:0 "After the unification of the parties, Pietro Nenni almost disappeared from the public view. He didn't run for any position in the Front and, while still keeping its status as a parlamentarian, he also refrained from making rallies or taking ministries. But, since he joined the reformist wing, there have been some discussions on whether to promote him to a higher position as a propaganda move."
 AtM_ITA.27.a:0 "He's a loyal friend, give him an onorary title within the party"
 AtM_ITA.27.b:0 "He's a great politician, the seat of the Prime Minister is ready for him"
 AtM_ITA.28.t:0 "Social Democrats Leave the Party"
 AtM_ITA.28.desc:0 "Even after trying to collaborate with them, the friendship within the FDP and the PSDI tragically ended today. While the front lost one of its less important members, it's unsure the future of the sole socialist opposition within the country."
 AtM_ITA.28.a:0 "Sad"
 AtM_ITA.29.t:0 "Republicans Leave the Party"
 AtM_ITA.29.desc:0 "Even after trying to collaborate with them, the friendship within the FDP and the PRI tragically ended today. While the front lost one of its less important members, it's unsure the future of the republican opposition within the country."
 AtM_ITA.29.a:0 "Sad"
 AtM_ITA.30.t:0 "The URR Strikes into Irrelevance"
 AtM_ITA.30.desc:0 "Recent polls for the next elections have shown that the project to take Parri with its splinter party within the Front, as a mean to rob the votes of the PRI, has tragically failed, with the URR not gaining enough votes to even reach 1%. While the party will still keep itself alligned with the FDP, since most of its members already flocked back to the PRI, it's unsure whether or not it will actually be able to keep electing representatives as part of its own list instead of simply making them run as independents within the FDP."
 AtM_ITA.30.a:0 "A failed experiment"
 AtM_ITA.31.t:0 "The FDP Dissolves"
 AtM_ITA.31.desc:0 "Whether for infighting, mistrust or poor electoral results, the Fronte Democratico Popolare has been dissolved, with each of its constituent parties taking their own direction. Even if its birth was met with hope whitin left-wing circles, it will now be just an historical memory within Italian politics."
 AtM_ITA.31.a:0 "The previous government lands in the hands of the PCI"
 AtM_ITA.31.b:0 "The previous government lands in the hands of the PSI"
 AtM_ITA.31.c:0 "The DC forms a grand coalition and takes the throne"
 AtM_ITA.31.d:0 "There might be someone in the future who'll still remember them..."
 AtM_ITA.32.t:0 "Oh, Youth!"
 AtM_ITA.32.desc:0 "After a mail arrived to his door, he couldn't believe it.\nSince the minimum age to be elected as any state institution was lowered to 18 years, he finally had the chance to represent its party and, mainly, the Youth who supported him.\nThe following day he walked down the Quirinale, where the president was ready to meet him, and he welcomed him with the warmest words"
 AtM_ITA.32.a:0 ""Good Morning, mr. Craxi""
 
 AtM_ITA_peacetreaty.0.t:0 "The Paris Peace Conference"
 AtM_ITA_peacetreaty.0.desc:0 "While we left WWII on the side of the Allies, the victorious powers still wanted to punish us for staying in the conflict for more than 3 years on the side of the Axis in the Paris Peace Conference by imposing some military restrictions and some border changes."\n\n"While these aren't as punishing as the ones imposed on Germany, we will still see the Aegean islands given back to Greece and the creation of [TRE.GetNameDef], under joint Yugoslav, British and American administration."
 AtM_ITA_peacetreaty.0.a:0 "A price to pay for peace"
 AtM_ITA_territorial.0.t:0 "The UN and Italy ask for Trust Territory over Somalia"
 AtM_ITA_territorial.0.desc:0 "The UN and Italy ask for Trust Territory over Somalia"
 AtM_ITA_territorial.0.a:0 "Hand it over to the Italian UN Trust Territory"
 AtM_ITA_territorial.1.t:0 "Yugoslavia refused our demands!"
 AtM_ITA_territorial.1.desc:0 "Unfortunately, our expectations were true and the government of Yugoslavia doesn't want a referendum regarding the contested territory of Trieste.\n\nSince our main objective for that was the self-determination for the italians which historically have populated that region, there's only one option left for us."
 AtM_ITA_territorial.1.a:0 "Pack your bags, we'll have a vacation in the Balkans!"
 AtM_ITA_territorial.2.t:0 "Italy asks for Libya"
 AtM_ITA_territorial.2.desc:0 "Today, the Italian government approached us with a request: to put Libya under its control again. \nThe colony was under Italian control since the scramble for Africa and was also one of thamy theaters of the Second World War."
 AtM_ITA_territorial.2.a:0 "Hand it over to them"
 AtM_ITA_territorial.2.b:0 "Refuse"
 AtM_ITA_territorial.3.t:0 "The British Accept"
 AtM_ITA_territorial.3.desc:0 "The British government accepted our request to regain access to our former colony: Libya."
 AtM_ITA_territorial.3.a:0 "Hurray"
 AtM_ITA_territorial.4.t:0 "The British Declined"
 AtM_ITA_territorial.4.desc:0 "The British government declined our request to regain access to our former colony: Libya."
 AtM_ITA_territorial.4.a:0 "Too bad!"
 AtM_ITA_territorial.5.t:0 "An invitation from Italy"
 AtM_ITA_territorial.5.desc:0 "The Italian government is asking us to join the newly created [ITA.GetFactionName]"
 AtM_ITA_territorial.5.y:0 "Consider us in!"
 AtM_ITA_territorial.5.n:0 "Decline their offer"
 AtM_ITA_territorial.6.t:0 "[FROM.GetNameDefCap] Accepted our Request"
 AtM_ITA_territorial.6.desc:0 "It seems that [FROM.GetNameDef] has accepted our previous offers, citing the goal of keeping good relations within the two countries."
 AtM_ITA_territorial.6.a:0 "Urrà"
 AtM_ITA_territorial.7.t:0 "[FROM.GetNameDefCap] Declined our Offer"
 AtM_ITA_territorial.7.desc:0 "Unfortunately, it seems that [FROM.GetNameDef] has declined our previous offer. Now it's our choice whether to back down on our requests or to impose them with force."
 AtM_ITA_territorial.7.a:0 "Looks like they won't keep that answer for long"
 AtM_ITA_territorial.7.b:0 "Too bad!"
 AtM_ITA_territorial.8.t:0 "The Italian Ask Us to Leave Austria"
 AtM_ITA_territorial.8.desc:0 "Today, the Italian government approached us with the request of removing our presence in Austria."
 AtM_ITA_territorial.8.y:0 "Accept their request"
 AtM_ITA_territorial.8.m:0 "Make them pay for it!"
 AtM_ITA_territorial.8.n:0 "I don't think so"
 AtM_ITA_territorial.9.t:0 "[SOV.GetNameDefCap] Accepted our Request"
 AtM_ITA_territorial.9.desc:0 ""
 AtM_ITA_territorial.11.t:0 "Civil Unrest"
 AtM_ITA_territorial.11.desc:0 "As a consequence of Italy's mediterreanean foreign policy, we knew that they would also come for us. The italians have been supporting republican movements within our country for months and now their gamble might've just paid off. Today, a general strike was declared in the country but the organizers, certain of their strength managed to take arms and start a full-on rebellion, supported also by separatist movements accross Catalonia and Galicia."
 AtM_ITA_territorial.11.a:0 "Send the army"
 AtM_ITA_territorial.11.b:0 "Flee Madrid or we'll die!"
 AtM_ITA_territorial.12.t:0 "Hungary Asks for Help"
 AtM_ITA_territorial.12.desc:0 "Since our government declared the intentions of supporting the current anti-soviet government in Hungary, today that country asked us for help in case they were to leave the [SOV.GetFactionName].\n\nIf we were to respect our duties, it might grant us a valuable ally, even if it will mean engaging in a conflict with the soviets."
 AtM_ITA_territorial.12.a:0 "We'll help them to the fullest"
 AtM_ITA_territorial.12.b:0 "Tell them we don't have the time for this"
 AtM_ITA_territorial.13.t:0 "Italian Coup"
 AtM_ITA_territorial.13.desc:0 "Since our nation fell into the hands of the Soviets, the monarchist sentiment never went away and, since Italy's announcement of its pan-mediterranean policy, it shouldn't come as a surprise the fact that this sentiment has been used to justify a coup in the country."
 AtM_ITA_territorial.13.a:0 "The Italians manage to win"
 AtM_ITA_territorial.13.b:0 "We'll fight them to the very brim"
 AtM_ITA_territorial.14.t:0 "Somalian Independence"
 AtM_ITA_territorial.14.desc:0 "The time has arrived for the Somalian trust territory which, even if was characterized by a notable stability, was promised a lifetime of only ten years.\n\nIn preparation of that, we also started negotiations with the members of the Somali Youth League to decide the future of the country."
 AtM_ITA_territorial.14.a:0 "If we must..."
 AtM_ITA_territorial.15.t:0 "As a consequence of our disastrous"
 AtM_ITA_territorial.15.desc:0 "As a consequence of our disastrous campaign in Spain, the portugese government has announced that they will abbandon our faction and also that they will amend the constitution to remove the democratic principles we forced them to comply to."
 AtM_ITA_territorial.15.a:0 "Humiliating"
 AtM_ITA_territorial.16.t:0 "Italy asks for our submission"
 AtM_ITA_territorial.16.desc:0 "Since we were one of their former colonies, the Italian government has now asked for our submission in hopes of retaining their colonial past."
 AtM_ITA_territorial.16.a:0 "They're too strong"
 AtM_ITA_territorial.16.b:0 "We'll beat them easily"
 AtM_ITA_territorial.17.t:0 "Libya Accepts"
 AtM_ITA_territorial.17.desc:0 "The Libyan government has accepted our request for the return of out north african colony."
 AtM_ITA_territorial.17.a:0 "Hurray"
 AtM_ITA_territorial.18.t:0 "Libya Declines"
 AtM_ITA_territorial.18.desc:0 "The Libyan government has refused our request for the return of out north african colony."
 AtM_ITA_territorial.18.a:0 "Not that they had much of a choice"
 AtM_ITA_territorial.19.t:0 "The Fate of the Former Spanish Colonies"
 AtM_ITA_territorial.19.desc:0 "Since Spain fell into chaos, we promptly occupied their territories in Africa in hopes of keeping stability at least in their colonies. However, as chaos seems to have cooled down, we can finally decide what to do with the colonies that we have subtracted from them."
 AtM_ITA_territorial.19.a:0 "Give them back"
 AtM_ITA_territorial.19.b:0 "Grant them independence"
 AtM_ITA_territorial.19.c:0 "Keep the status quo, while giving them Tangier"
 AtM_ITA_territorial.20.t:0 "Italy asks us for Albania"
 AtM_ITA_territorial.20.desc:0 "Due to Italy starting their own "mediterranean project", it shouldn't come as a surprise that they're now asking us for the small nation of Albania, which is located right around their coastline.\nWhile losing an ally would be sad from our point of view, we still have to remember that the communist government of Italy has been nothing but friendly to us and that losing them would probably be lead to a declaration of war."
 AtM_ITA_territorial.20.a:0 "Let them have it"
 AtM_ITA_territorial.20.b:0 "No, Albania is too important for us"
 
 #Leader Change Events
 AtM_ITA_dc.0.t:0 "Government Resignation"
 AtM_ITA_dc.0.desc:0 "After the previous leader resigned, the Democrazia Cristiana had an internal election, in which the elected candidate for party presidency was..."
 AtM_ITA_dc.0.pella:0 "Giuseppe Pella"
 AtM_ITA_dc.0.scelba:0 "Mario Scelba"
 AtM_ITA_dc.0.leone:0 "Giovanni Leone"
 AtM_ITA_dc.0.fanfani:0 "Amintore Fanfani"
 AtM_ITA_dc.0.tambroni:0 "Fernando Tambroni"
 AtM_ITA_dc.0.moro:0 "Aldo Moro"
 AtM_ITA_dc.0.segni:0 "Antonio Segni"
 AtM_ITA_dc.0.zoli:0 "Adone Zoli"
 AtM_ITA_dc.1:0 "Antonio Segni Retires"
 AtM_ITA_dc.1.desc:0 "After being in the political spotlight for too long, Antonio Segni, leader of the party's right wing has decided to retire, putting in charge a young candidate..."
 AtM_ITA_dc.1.a:0 "Giulio Andreotti"
 AtM_ITA_dc.2.t:0 "Amintore Fanfani resigns"
 AtM_ITA_dc.2.desc:0 "After Amintore Fanfani resigned due to personal reasons, to facilitate continuity during a period of increasing political centralization in Italy, the role of prime minister went to..."
 AtM_ITA_dc.2.a:0 "Aldo Moro, a member of the DC"
 
 #########################
 #   San Marino Events   #
 #########################
 
 AtM_SMR.1.t:0 "General Elections"
 AtM_SMR.1.desc:0 "Today, the general elections for the renewal of the Grand and General Council were held. The two main coalitions competing with eachother were the Socialist "Committee of Freedom" and the Christian Democratic "Popular Alliance""
 AtM_SMR.1.a:0 "Committee of Freedom"
 AtM_SMR.1.b:0 "Popular Alliance"
 AtM_SMR.2.t:0 "Incoming Elections"
 AtM_SMR.2.desc:0 "As the Council has been dissolved following the collapse of the government majority, the elections for the Captain Regents of the Republic couldn't be held. As instability looms upon our country, should we give in to the demands for elections?"
 AtM_SMR.2.a:0 "Lock the doors of the palace"
 AtM_SMR.3.t:0 "Creation of a Provisional Government"
 AtM_SMR.3.desc:0 "Tonight, the opposition, in response to our decision to not hold the elections for the Captain Regents, has created its own government in an abbandoned complex of Rovereta, right on the border with Italy. Since they're not breaking any law, we can't arrest them and we also cannot raid the structure since they might have organized some militias"
 AtM_SMR.3.a:0 "Are they serious?"
 AtM_SMR.4.t:0 "Chaos in San Marino"
 AtM_SMR.4.desc:0 "This night, as a consequence of a political crisis caused by the collapse of the majority in the Grand and General Council and the impossibility to hold elections for the Captain Regents, the sanmarinese opposition proclaimed a provisional government in Rovereta, right within our border, and have also organized some militias. Of course it's not our duty to police other countries, but considering the relationship between our country, giving a helping hand to the opposition might seem a good idea"
 AtM_SMR.4.a:0 "Help the Provisional Government"
 AtM_SMR.4.b:0 "Why should we care?"
 AtM_SMR.5.t:0 "The Provisional Government Wins"
 AtM_SMR.5.desc:0 "Thanks to the help sent by our Italian neighbors, the provisional government led by the opposition has won the power struggle. While these days the republic was flooded with instability, only a single shot was heard and was shot by a member of pro-government militias"
 AtM_SMR.5.a:0 "Stability, finally!"
 AtM_SMR.6.t:0 "The Provisional Government Wins"
 AtM_SMR.6.desc:0 "Thanks to our help and the choice of the Captain Regents to reopen the door of the council, the opposition in San Marino regained control of the country. Even if the old republic stood on the brink of collapse these days, stability finally seems to have returned"
 AtM_SMR.6.a:0 "Cheers!"
 AtM_SMR.7.t:0 "The Government Wins"
 AtM_SMR.7.desc:0 "By not gaining any form of help by the nearby countries, the opposition managed to return to the council after some of their members decided to support the current minority government, in hopes of returning stability to the Republic"
 AtM_SMR.7.a:0 "Could've gone worse"
 AtM_SMR.8.t:0 "Shift in the DC"
 AtM_SMR.8.desc:0 "It wasn't a secret that the Italian DC had various currents and factions, some leaning left, some leaning right, but it was a surprise to see that one of them ended up gaining absolute control over the party. As the consequence of the changes within the Italian party, considering its high influence on us, it should'nt be a surprise that even our PDCS went in the same direction as the Italian one"
 AtM_SMR.8.a:0 "Always following our friends"
 
 #######################
 #   Albanian Events   #
 #######################
 AtM_ALB.1.t:0 "General Elections"
 AtM_ALB.1.desc:0 "After the Italians liberated ourselves from the previous regime, they made sure to install a provvisional government that would transform our country in a liberal-democracy by the use of temporary emergency powers.\n\nSince months have passed and the initial goals have been met, the emergency cabinet has been dissolved to open the ballots for the first time in years. Polls describe this as a three-way race, between the conservative BKI, the liberal-agrarian PASh and the social democratic PSSh."
 AtM_ALB.1.a:0 "BKI"
 AtM_ALB.1.b:0 "PSSh"
 AtM_ALB.1.c:0 "PASh"
 
 #####################
 #   Soviet Events   #
 #####################
 
 AtM_SOV.2.t:0 "North Korea Demands Kim Il Sung"
 AtM_SOV.2.desc:0 "Officials from our occupation zone in Korea have arrived in Moscow to meet with Stalin and demand the esteemed "Kim Il Sung" as their leader. However, if we agree to these demands, we must also accept the fact that the Democratic People's Republic of Korea will be formed. This, however, will garner support from other communist nations around the world as we liberate the working class. What should we do?"
 AtM_SOV.2.a:0 "Glory to the DPRK!"
 AtM_SOV.2.b:0 "Who do they think they are?"
 AtM_SOV.3.t:0 "North Korean Proposition"
 AtM_SOV.3.desc:0 "Our government in North Korea has recently sent an official request, stating their desire to join the Soviet Union as another Soviet Socialist Republic. Accepting this proposal would strengthen our influence in East Asia, but it would also bring us closer to direct conflict with the United States.\n\nHow should we respond?"
 AtM_SOV.3.a:0 "We need to lower tensions..."
 AtM_SOV.3.b:0 "Welcome Comrades!"
 AtM_SOV.4.t:0 "North Korean Road to War"
 AtM_SOV.4.desc:0 "A message has arrived from the provisional government in North Korea under Terentii Shtykov. He has outlined plans to invade South Korea immediately in an effort to reunify the peninsula. This action would almost certainly draw us into conflict with the United States, but if we secure total control over Korea, we may be able to negotiate a peace deal on our terms..."
 AtM_SOV.4.a:0 "A Brilliant Plan!"
 AtM_SOV.4.b:0 "We Cannot Risk a War."
 AtM_SOV.5.t:0 "Death of Stalin"
 AtM_SOV.5.desc:0 "On March 5th, 1953, Joseph Vissarionovich Stalin, General Secretary of the Communist Party and undisputed leader of the Soviet Union for nearly three decades, has died at the age of 74. Official reports state that the Premier suffered a stroke at his dacha and passed away despite the efforts of the finest Soviet physicians.\n\nThe news has sent shockwaves throughout the Union. Stalin's iron grip on power has defined Soviet politics since the 1920s, and his death leaves an enormous vacuum at the heart of the Soviet state. Already, whispers of succession struggles echo through the halls of the Kremlin as various party officials position themselves for power.\n\nThe question now facing the Soviet Union is clear: who will inherit Stalin's vast empire, and what direction will they take the nation? The choices made in the coming days will determine whether the USSR continues on its current path or embarks on a radically new course."
 AtM_SOV.5.a:0 "An era ends."
 AtM_SOV.6.t:0 "Hungary leaves the Warsaw Pact"
 AtM_SOV.6.desc:0 "The leader of our puppet Hungarian state, [HUN.GetLeader] has announced earlier today his withdrawal from our alliance of the Warsaw Pact. We can act with 2 options, either allow their sovereignty to show ourself as the peaceful solution to capitalism. Our second option is to destroy this revolution and secure our control over Europe. What will be your choice: [SOV.GetLeader]?\n\n§RIMPORTANT NOTE FROM GENERALS:§!\nShould we fail to establish control over the nation in 390 days, revolts may occur within our armed forces and will be forced to retreat from the nation!"
 AtM_SOV.6.a:0 "Dismantle the threat!"
 AtM_SOV.6.b:0 "Allow their sovereignty"
 AtM_SOV.7.t:0 "United States Nukes Manchuria"
 AtM_SOV.7.desc:0 "As a response to the Chinese intervention in the Korean War, the Americans believed it was a reasonable response to launch their nuclear arsenal towards Manchuria. It is our duty to protect our allies; it is a question we have to ask ourselves: do we want a war with the United States?"
 AtM_SOV.7.a:0 "Peace Prevails"
 AtM_SOV.7.b:0 "A Crusade Against Democracy!"
 AtM_SOV.8.t:0 "Soviet Demands on the Turkish Straits"
 AtM_SOV.8.d:0 "The Soviet government has delivered a formal diplomatic note to our Foreign Ministry demanding a revision of the Montreux Convention. Moscow insists on joint Soviet-Turkish defense of the Bosporus and Dardanelles, the establishment of Soviet military bases along the straits, and a new international regime that would grant preferential rights to Black Sea powers. The implications are clear, accepting would mean Soviet troops on our soil and an end to our sovereign control over one of the world's most strategic waterways. We must decide how to respond."
 AtM_SOV.8.a:0 "Reject their demands outright. The straits are ours."
 AtM_SOV.8.b:0 "Accede to Soviet demands and grant concessions."
 AtM_SOV.9.t:0 "[USA.GetNameDefCap] Demands Withdrawal from Iran"
 AtM_SOV.9.desc:0 "[USA.GetNameDefCap] has recently called to the UN in response to our authority in Iran. Our survival depends on us keeping control of these territories which makes our situation very difficult. Should we not abide by these request, there is a high chance of many countries sanctioning our country which might damage our economy."
 AtM_SOV.9.a:0 "We are not evil!"
 AtM_SOV.9.b:0 "We will take the risk."
 AtM_SOV.10.t:0 "The Future of Transcarpathia"
 AtM_SOV.10.desc:0 "Given its high degree of diversity, the future of Transcarpathia is very unclear. The region is heavily dominated by ethnic Ukrainians, which makes it a highly suitable option to give to the Ukrainian SSR. That said, the land was part of the Czechs and the Hungarians, many of whom dominate the regions too."
 AtM_SOV.10.a:0 "To the Ukrainian SSR"
 AtM_SOV.10.b:0 "The [CZE.GetAdjective]s deserve it"
 AtM_SOV.10.c:0 "Perhaps a loyal [HUN.GetAdjective] ally is useful"
 AtM_SOV.11.t:0 "Investing in Cuban Defence?"
 AtM_SOV.11.desc:0 "As the United States failed miserably in their invasion of Cuba, an island which has been aligning with us since the end of its revolution, a debate has sparkled about whether or not we should invest more heavily in the defence of the island.\n\nA proposal regarding it has been presented: installing nuclear missiles on the island to be prepared in case of an invasion, just like what the Americans did in Italy and Turkey."
 AtM_SOV.11.a:0 "Cuba is a key ally, accept the proposal"
 AtM_SOV.11.b:0 "Maybe they should fund their own defence"
 
 AtM_SOV.12.t:0 "Americans Expand Into Yugoslavia."
 AtM_SOV.12.desc:0 "[USA.GetNameDefCap] has pressed their forces into the neutral state of Yugoslavia. Once the government declared its neutrality in the event of an armed conflict between the 2 nations, the imperialist [USA.GetAdjective] government rolled their tanks into the Yugoslav territory, violating their neutral state. At the same time, we don't want to cause war against the [USA.GetAdjective]s, we should weaken their influence in the region, in the event of a war. Should we intervene?"
 AtM_SOV.12.a:0 "Weaken the [USA.GetAdjective] influence"
 AtM_SOV.12.b:0 "Stand with non-interventionism"
 
 AtM_SOV.100.t:0 "The Federal Structure of the Soviet Union"
 AtM_SOV.100.desc:0 "Comrade Stalin, the time has come to decide the administrative structure of our great Soviet Union. The Party leadership has been debating whether to maintain our current unified structure or to implement a more federal approach, granting some autonomy to the various Soviet Socialist Republics.\n\nA federal structure would allow each republic to manage its own internal affairs while remaining loyal to Moscow and the communist cause. This could improve local administration and reduce bureaucratic inefficiencies, but it may also weaken central control and create opportunities for nationalist sentiment to grow.\n\nAwaiting your order, Comrade Secretary-General."
 AtM_SOV.100.a:0 "Implement the Federal Structure"
 #AtM_SOV.100.b:0 "Nyet. Direct rule from Moscow" # Disabled option
 
 AtM_SOV.101.t:0 "The Soviet Civil War"
 AtM_SOV.101.desc:0 "Blyat they are fucking revolting"
 AtM_SOV.101.a:0 "Glory to Stalin"
 AtM_SOV.101.b:0 "Glory to Zhukov"
 AtM_SOV.101.c:0 "Glory to Khrushchev"
 AtM_PHI.6.a:0 "Excellent news!"
 
 ########################
 #   Hungarian Events   #
 ########################
 
 AtM_HUN_election.1.t:0 "1947 Hungarian Elections "
 AtM_HUN_election.1.desc:0 "Today is August 31st of 1947, our open elections have started in Hungary and votes are being counted. The polling are showing that the elections are close however this might change. Who shall win these elections?"
 AtM_HUN_election.1.a:0 "Communism is our only saving!"
 AtM_HUN_election.1.b:0 "Elect the Christian party!"
 
 ####################
 #   Greek Events   #
 ####################
 
 AtM_GRE.1.t:0 "The Greek Civil War Begins"
 AtM_GRE.1.desc:0 "As tensions reach a breaking point in Greece, we must decide where our loyalties lie. The communist forces of the Democratic Army of Greece (DSE) have risen up against the government. This conflict will determine the future of Greece, whether it remains aligned with the West or joins the communist bloc.\n\nWe must choose which side to support in this pivotal moment."
 AtM_GRE.1.a:0 "Support the Government Forces"
 AtM_GRE.1.b:0 "Join the Communist Revolution"
 
 ####################
 #   French Events  #
 ####################
 
 AtM_FRA.1.t:0 "Britain Proposes Operation Musketeer"
 AtM_FRA.1.desc:0 "The British government has proposed a joint military operation to retake the Suez Canal from Egypt by force. Operation Musketeer would involve coordinated airborne and amphibious assaults on the canal zone to restore international control over this vital waterway. London argues that Nasser's nationalization threatens freedom of navigation and sets a dangerous precedent for European interests across Africa and the Middle East. French shareholders in the Suez Canal Company stand to lose millions, and our position in North Africa could be undermined if we allow this act to go unchallenged."
 AtM_FRA.1.a:0 "We will join the operation"
 AtM_FRA.1.b:0 "We cannot support this action"
 
 ######################
 #   Belgian Events   #
 ######################
 
 AtM_BEL.1.t:0 "The Congo Demands Independence"
 AtM_BEL.1.desc:0 "Our colony in the Congo has started to fight to gain its own independence from us. They are making extensive demands including: Free elections, An end to colonialism and more rights. Do we abide by these requests?"
 AtM_BEL.1.a:0 "Perhaps colonialism should end."
 AtM_BEL.1.b:0 "Shut this down."
 
 #######################
 #   Yugoslav Events   #
 #######################
 
 AtM_YUG.1.t:0 "American Plane Enters Our Airspace"
 AtM_YUG.1.desc:0 "An American transport aircraft was spotted intruding into our airspace near Kranj, which is a clear violation of our independence and sovereignty. A reasonable response should be a swift take-down of the aircraft out of the sky!"
 AtM_YUG.1.a:0 "Take it out."
 AtM_YUG.1.b:0 "Don't anger the giant!"
 
 ###################
 #   Siam Events   #
 ###################
 
 AtM_SIA.1.t:0 "Transfer of Indochinese Holdings"
 AtM_SIA.1.desc:0 "Today, the French have demanded the return of the lands of the countries of Laos and Cambodia. While these lands are perfect for us to defend our country, this act of kindness may strike a defensive deal with France and give us a powerful ally."
 AtM_SIA.1.a:0 "An ally in the making."
 AtM_SIA.1.b:0 "For our own prosperity!"
 
 ####################
 ##   FWA Events   ##
 ####################
 
 AtM_FWA.1.t:0 "Fate of Mauritania"
 AtM_FWA.1.desc:0 "The windswept expanses of Mauritania stretch across the western Sahara, a land of nomadic tribes and ancient caravan routes. Since 1920, this territory has remained under French administration, but the winds of change now sweep across Africa. In Nouakchott, local leaders have begun organizing, demanding a voice in their own governance. The question now stands before us: do we recognize Mauritanian sovereignty and allow the formation of an Islamic republic, or do we maintain our grip on these strategic desert territories?"
 AtM_FWA.1.a:0 "Free them!"
 AtM_FWA.1.b:0 "We have other plans..."
 AtM_FWA.2.t:0 "Fate of Guinea"
 AtM_FWA.2.desc:0 "Since the late 19th century, Guinea has been integrated into French West Africa, its rich mineral deposits and strategic coastline making it invaluable to our colonial enterprise. But in Conakry, a powerful independence movement has emerged, led by trade unionists and intellectuals who reject any compromise with colonial rule. The bauxite mines of Fria and the ports along the Atlantic coast hang in the balance. Will we yield to the demands for independence, or retain control of this vital territory?"
 AtM_FWA.2.a:0 "Free them!"
 AtM_FWA.2.b:0 "We have other plans..."
 AtM_FWA.3.t:0 "Fate of Ivory Coast"
 AtM_FWA.3.desc:0 "The Ivory Coast has flourished under French administration, its coffee and cocoa plantations generating substantial wealth. Abidjan has grown into a modern city, a testament to colonial development, but also a hub of growing nationalist sentiment. Local politicians, many educated in France itself, now demand the right to govern their own affairs. The prosperity we helped build may soon slip from our control. Do we grant independence to what could become one of West Africa's most successful states, or do we hold fast to our most profitable possession?"
 AtM_FWA.3.a:0 "Free them!"
 AtM_FWA.3.b:0 "We have other plans..."
 AtM_FWA.4.t:0 "Fate of Togo"
 AtM_FWA.4.desc:0 "Togo's fate has been uncertain since we inherited this territory from the Germans after the Great War. As a UN Trust Territory, we have always governed under international scrutiny, with the explicit mandate to prepare the Togolese for self-governance. That day has now arrived. In Lomé, preparations for independence are already underway, and the world watches to see if France will honor its trusteeship obligations. The question is no longer if, but when, and whether we will do so gracefully or reluctantly."
 AtM_FWA.4.a:0 "Free them!"
 AtM_FWA.4.b:0 "We have other plans..."
 AtM_FWA.5.t:0 "Fate of Dahomey"
 AtM_FWA.5.desc:0 "For centuries, the Kingdom of Dahomey was a powerful West African state, feared for its military prowess and wealthy from the coastal trade. French conquest in the 1890s brought this independence to an end, but the memory of sovereignty has never faded. In Porto-Novo and Cotonou, educated elites speak of restoring their nation's dignity and reclaiming control of their own affairs. The choice is ours: do we permit the rebirth of Dahomey as a modern republic, or do we deny them what was once theirs?"
 AtM_FWA.5.a:0 "Free them!"
 AtM_FWA.5.b:0 "We have other plans..."
 AtM_FWA.6.t:0 "Fate of Niger"
 AtM_FWA.6.desc:0 "The vast Sahelian expanse of Niger has long presented administrative challenges. Its scattered populations, harsh climate, and remote location make it one of our most difficult territories to govern. Yet in Niamey, local administrators have proven themselves capable, and calls for independence grow stronger by the day. The uranium deposits of Arlit and the strategic position along trans-Saharan routes give this territory unexpected importance. Do we trust the Nigerien people with sovereignty, or do we maintain control over these isolated but valuable lands?"
 AtM_FWA.6.a:0 "Free them!"
 AtM_FWA.6.b:0 "We have other plans..."
 AtM_FWA.7.t:0 "Fate of Mali"
 AtM_FWA.7.desc:0 "The territory we call French Sudan was once the heart of the legendary Mali Empire, whose wealth and learning drew travelers from across the known world. Centuries of decline followed, but the dream of Mali has never died. In Bamako and Timbuktu, nationalists invoke the names of Sundiata Keita and Mansa Musa, demanding the restoration of Malian independence. This vast landlocked territory offers little material wealth, but its symbolic importance to pan-African movements cannot be underestimated. Will we permit the rebirth of Mali?"
 AtM_FWA.7.a:0 "Free them!"
 AtM_FWA.7.b:0 "We have other plans..."
 AtM_FWA.8.t:0 "Fate of Upper Volta"
 AtM_FWA.8.desc:0 "Upper Volta has endured a chaotic history under French rule. Established as a colony in 1919, dissolved and divided among its neighbors in 1932, then reconstituted in 1947. The Mossi kingdoms that once dominated this region have long memories, and the people of Ouagadougou now seek stability through sovereignty. While poor in resources, Upper Volta's central location and agricultural potential make it significant to regional stability. Do we grant them the independence they deserve, or do we once again reshape their borders according to our interests?"
 AtM_FWA.8.a:0 "Free them!"
 AtM_FWA.8.b:0 "We have other plans..."
 AtM_FWA.9.t:0 "Fate of Senegal"
 AtM_FWA.9.desc:0 "Senegal has been the jewel of French West Africa since the 17th century. Dakar, its modern capital, has served as the administrative heart of our entire West African federation. Here, more than anywhere else in Africa, French culture took root. The Four Communes of Saint-Louis, Dakar, Gorée, and Rufisque have sent deputies to Paris since 1848. But even this deep connection cannot stop the tide of history. As the federation crumbles around it, Senegal stands ready to lead West Africa into a new era. Will we grant our oldest African partner its freedom?"
 AtM_FWA.9.a:0 "Free them! (Play as Senegal)"
 AtM_FWA.9.b:0 "We have other plans..."
 
 ####################
 ##   FEA Events   ##
 ####################
 
 AtM_FEA.1.t:0 "Fate of Chad"
 AtM_FEA.1.desc:0 "The vast Saharan north and fertile south of Chad have little in common except French rule. In N'Djamena, educated elites demand the right to govern themselves, while tribal leaders in the north warn that continued colonial domination will provoke open revolt. The territory offers little economic reward, but its strategic position between Libya and French West Africa makes it valuable. Do we grant independence to this landlocked nation, or maintain control over these desert expanses?"
 AtM_FEA.1.a:0 "Free them!"
 AtM_FEA.1.b:0 "We have other plans..."
 AtM_FEA.2.t:0 "Fate of Ubangi-Shari"
 AtM_FEA.2.desc:0 "Ubangi-Shari, named for its great rivers, has been the neglected heart of French Equatorial Africa. In Bangui, a small but determined group of civil servants and teachers demand the right to manage their own affairs. The territory's forests yield valuable timber and its rivers provide transport, but development has been minimal. Local chiefs, once powerful figures in this region, now speak of reclaiming their traditional authority. Do we permit the birth of the Central African Republic, or retain this sparsely populated territory?"
 AtM_FEA.2.a:0 "Free them!"
 AtM_FEA.2.b:0 "We have other plans..."
 AtM_FEA.3.t:0 "Fate of Middle Congo"
 AtM_FEA.3.desc:0 "The Middle Congo, gateway to the interior, holds strategic importance beyond its modest size. Brazzaville, once the capital of Free France, now hosts African politicians demanding independence. The territory's location on the Congo River and its potential for economic development make it valuable, while its educated elite speak of creating a modern African state. But the region's diversity, from coastal traders to forest peoples, raises questions about unity. Do we release this territory to forge its own destiny, or maintain our foothold on the great river?"
 AtM_FEA.3.a:0 "Free them!"
 AtM_FEA.3.b:0 "We have other plans..."
 AtM_FEA.4.t:0 "Fate of Gabon"
 AtM_FEA.4.desc:0 "Gabon, with its dense forests and small population, has been France's most isolated Equatorial territory. In Libreville, African politicians educated in French schools now speak of independence, while timber companies warn that political instability could destroy the economy. The territory's wealth in wood and later discovered minerals makes it attractive, but its tiny population raises questions about viability as an independent state. Do we grant sovereignty to this forest nation, or preserve our last foothold in the region?"
 AtM_FEA.4.a:0 "Free them! (Play as Gabon)"
 AtM_FEA.4.b:0 "We have other plans..."
 
 ##########################
 #   Philippines Events   #
 ##########################
 
 AtM_PHI.1.t:0 "Independence Granted"
 AtM_PHI.1.desc:0 "After decades of American colonial rule, the leaders of the United States have finally granted us full independence! The Filipino people can now determine their own destiny, free from foreign control. This marks the beginning of a new era for our nation as we take our rightful place among the sovereign nations of the world."
 AtM_PHI.1.a:0 "At last, we are free!"
 AtM_PHI.2.t:0 "Independence Granted"
 AtM_PHI.2.desc:0 "The United States has granted us independence, but it comes with significant strings attached. American military bases will remain on our soil, and our economic freedom has been severely limited by unfavorable trade agreements. While we have achieved nominal sovereignty, Washington's influence over our affairs remains substantial. Is this truly independence, or simply a new form of subjugation?"
 AtM_PHI.2.a:0 "Independence, at any cost!"
 AtM_PHI.3.t:0 "Independence Refused"
 AtM_PHI.3.desc:0 "The imperialist leaders of the United States have refused to grant us independence! Despite our repeated requests and the sacrifices our people have made, Washington insists on maintaining colonial control over the Philippines. This denial of our fundamental right to self-determination only strengthens our resolve to achieve freedom by any means necessary."
 AtM_PHI.3.a:0 "We will continue to seek freedom!"
 AtM_PHI.4.t:0 "The Fate of the Hukbalahaps"
 AtM_PHI.4.desc:0 "The Hukbalahap Movement is a peasant-led guerrilla communist organization that fought bravely against the Japanese occupation of our country during the war. Now that the conflict has ended, these battle-hardened fighters remain armed and organized, presenting a significant challenge to our government's authority. The time has come to decide how to handle this dangerous faction within our country."
 AtM_PHI.4.a:0 "Ban them entirely!"
 AtM_PHI.4.b:0 "Allow them a political platform!"
 AtM_PHI.5.t:0 "Assassination of Aurora Quezon"
 AtM_PHI.5.desc:0 "Hukbalahap guerrillas have committed an unspeakable atrocity. They ambushed and murdered Aurora Quezon, Chairman of the Philippine Red Cross and beloved widow of our second president, Manuel L. Quezon, as she was traveling to her hometown for the dedication of the Quezon Memorial Hospital. This cowardly attack on a humanitarian figure has shocked the nation and demonstrated the ruthless nature of the communist insurgency."
 AtM_PHI.5.a:0 "Condemn this cowardly attack!"
 AtM_PHI.6.t:0 "U.S. Aid"
 AtM_PHI.6.desc:0 "The United States has agreed to provide military aid to support our struggle against the Hukbalahap insurgency. American equipment, advisors, and funding will significantly strengthen our ability to combat the communist rebels threatening our young democracy. With Washington's backing, we can finally bring peace and stability to the countryside."
 
 ######################
 #   Malayan Events   #
 ######################
 
 AtM_MAL.1.t:0 "The Malayan Emergency"
 AtM_MAL.1.desc:0 "Armed militants struck at European plantation managers near Sungai Siput in Perak, killing three men. The violence has sent shockwaves through the colonial administration. What began as labor unrest and political agitation has now exploded into open armed rebellion.\n\nThe Communist Party of Malaya, drawing upon veterans of the wartime Anti-Japanese resistance, has launched a coordinated uprising across the peninsula. Calling themselves the Malayan National Liberation Army, these guerrillas have withdrawn into the jungle and begun striking at plantations, mines, and colonial infrastructure. They claim to fight for independence and the liberation of Malaya from foreign rule.\n\nA state of emergency has been declared across [ROOT.GetNameDef]. The insurgents fight on familiar ground with local support in many rural communities, and this conflict threatens the stability of the entire region. The struggle for Malaya's future has begun in earnest."
 AtM_MAL.1.a:0 "The situation is spiraling."
 AtM_MAL.1.b:0 "§YPlay as the MNLA§!"
 
 AtM_MAL.2.t:0 "Singapore Exits the Federation"
 AtM_MAL.2.desc:0 "Political tensions between the federal government and Singapore have reached a breaking point. Deep disagreements over economic policy, communal relations, and governance have made continued union impossible. Singapore's push for equal rights and greater autonomy has clashed repeatedly with federal priorities, creating an unsustainable situation.\n\nAfter prolonged negotiations and failed attempts at compromise, both sides have agreed that separation is the only viable path forward. Singapore will become an independent sovereign state, leaving the federation peacefully. Though this marks the failure of our unified vision, it may prevent further internal conflict. The island will forge its own destiny while we reshape our nation without it."
 AtM_MAL.2.a:0 "A painful but necessary decision."
 
 #####################
 #   Israeli Events  #
 #####################
 
 AtM_ISR.1.t:0 "Machal Volunteers Arrive"
 AtM_ISR.1.desc:0 "Ships have arrived from Europe carrying Machal volunteers, Jewish veterans of the Second World War who have chosen to take up arms once more in defense of our new nation. These experienced soldiers from the American, British, Canadian, and other Allied forces bring vital combat expertise and military knowledge that our fledgling defense forces desperately need. Among them are pilots, tank crews, artillerymen, and infantry officers who fought against the Nazis and now stand ready to fight for Israel's survival."
 AtM_ISR.1.a:0 "Their experience will be invaluable!"
 ISR_machal_units_deployed:0 "§YMachal§! units arrive from Europe to help the war."
 AtM_ISR.2.t:0 "Britain Proposes Operation Kadesh"
 AtM_ISR.2.desc:0 "The British have approached us with a bold proposal for coordinated military action against Egypt. Under the plan, Israeli forces would launch Operation Kadesh and invade the Sinai Peninsula. This would provide Britain and France with justification to intervene militarily to 'separate the combatants' and seize control of the Suez Canal. In exchange for our participation, we would gain territory in Sinai and eliminate Egyptian military positions that threaten our southern border. The operation carries significant risks but could decisively shift the regional balance of power in our favor."
 AtM_ISR.2.a:0 "We will coordinate the offensive"
 AtM_ISR.2.b:0 "This scheme is too dangerous"
 
 ########################
 #  Palestinian Events  #
 ########################
 
 AtM_PAL.1.t:0 "Our Allies Abandon Us"
 AtM_PAL.1.desc:0 "The unthinkable has happened. One by one, our Arab brothers who pledged to liberate Palestine are accepting armistice agreements with Israel. The armies that came to our aid are withdrawing, leaving us to face the Israelis alone. The dream of preventing the establishment of a Jewish state in our homeland is slipping away, and we are powerless to stop it. Our people face an impossible choice: accept the bitter reality of defeat and whatever terms we can negotiate, or continue a hopeless resistance that will bring only more suffering to our villages and towns. The promises of Arab unity ring hollow as we watch our supposed allies make separate peace with our enemy."
 AtM_PAL.1.a:0 "We must accept this painful reality."
 AtM_PAL.1.b:0 "Palestinians will never surrender our homeland!"
 
 ######################
 #   Egyptian Events  #
 ######################
 
 AtM_EGY.1.t:0 "The War Goes Poorly"
 AtM_EGY.1.desc:0 "The Arab-Israeli War has not proceeded as anticipated. Our forces have suffered setbacks, and the Israelis have proven to be far more capable than expected. International pressure is mounting for a ceasefire, and our military situation grows increasingly untenable. UN mediators have proposed an armistice that would allow us to retain control of the Gaza Strip while ending hostilities. Continuing this war risks further losses and humiliation, but accepting a ceasefire may be seen as abandoning the Palestinian cause and betraying our Arab League allies."
 AtM_EGY.1.a:0 "We must accept the armistice terms."
 AtM_EGY.1.b:0 "Egypt will fight on!"
 
 AtM_EGY.2.t:0 "Syrian Demands for Autonomy"
 AtM_EGY.2.desc:0 "The union between Egypt and Syria has been fraught with tension from the start. Syrian political leaders and military officers have grown increasingly frustrated with Cairo's centralized control and the dominance of Egyptian officials in key positions throughout Syrian administration. Local grievances have mounted over economic policies that many Syrians believe favor Egypt at their expense. Now, prominent Syrian leaders have formally demanded greater autonomy within the United Arab Republic, seeking restored control over their own internal affairs, economic policy, and military command. They warn that without substantial reforms, the union itself may be at risk. We must decide how to respond to these demands."
 AtM_EGY.2.a:0 "Never!"
 AtM_EGY.2.b:0 "Grant them autonomy."
 
 AtM_EGY.3.t:0 "Syria Declares Independence!"
 AtM_EGY.3.desc:0 "Our refusal to grant autonomy has triggered the very crisis we sought to avoid. Syrian military officers have seized control in Damascus, dissolving the union and proclaiming the restoration of an independent Syrian Arab Republic. The streets of Damascus and Aleppo have erupted in celebration as the Syrian flag is raised once more over government buildings. The coup leaders have declared that the experiment of the United Arab Republic has failed, citing Cairo's heavy-handed centralization and disregard for Syrian interests. They have called upon all Syrian units to defend their newly reclaimed independence. The dream of Arab unity lies shattered. We must now decide whether to accept this humiliating secession or use military force to bring Syria back into the fold."
 AtM_EGY.3.a:0 "The union cannot be maintained through bloodshed."
 AtM_EGY.3.b:0 "We will restore the UAR by force!"
 
 #######################
 #   Jordanian Events  #
 #######################
 
 AtM_JOR.1.t:0 "Armistice Negotiations with Israel"
 AtM_JOR.1.desc:0 "Despite our Arab Legion's valiant efforts, the war with Israel has reached a stalemate. While our forces have secured positions in the West Bank and East Jerusalem, continuing the conflict risks losing these gains. UN mediators have proposed an armistice agreement that would formalize our control over the West Bank territories, including the Old City of Jerusalem. King [JOR.GetLeader] faces a difficult choice: accept the ceasefire and secure tangible territorial gains for Transjordan, or continue fighting alongside our Arab allies in the increasingly uncertain struggle against Israel."
 AtM_JOR.1.a:0 "Accept the armistice and consolidate our gains."
 AtM_JOR.1.b:0 "The Arab Legion fights on!"
 
 ####################
 #   Syrian Events  #
 ####################
 
 AtM_SYR.1.t:0 "Pressure to End the War"
 AtM_SYR.1.desc:0 "The Arab coalition against Israel is fracturing. Our military situation has deteriorated, and with Egypt's withdrawal from the conflict, the united Arab front has collapsed. The Syrian army has suffered losses it can ill afford, and continuing this war alone or with only scattered allies would be futile. UN mediators are pushing for an armistice agreement to end the bloodshed. While accepting peace may be pragmatic, it would represent a humiliating defeat and could destabilize our government. Yet stubbornly fighting on risks even greater disaster."
 AtM_SYR.1.a:0 "We have no choice but to accept peace."
 AtM_SYR.1.b:0 "Syria will never surrender!"
 
 ######################
 #   Lebanese Events  #
 ######################
 
 AtM_LEB.1.t:0 "Time to Withdraw from the War"
 AtM_LEB.1.desc:0 "Lebanon's token participation in the Arab-Israeli War has become increasingly untenable. Our small expeditionary force was never equipped for prolonged conflict, and with Egypt's departure from the war, the Arab coalition is crumbling. Domestically, our diverse religious communities are divided on this foreign adventure, and the government faces mounting pressure to extricate Lebanon from a war that was never truly ours. UN mediators offer us an honorable exit through an armistice agreement. We can withdraw with minimal losses and refocus on our own internal affairs, though this may damage our standing in the Arab League."
 AtM_LEB.1.a:0 "Accept the armistice and bring our soldiers home."
 AtM_LEB.1.b:0 "Lebanon stands with the Arab cause!"
 
 ###########################
 #   Saudi Arabian Events  #
 ###########################
 
 AtM_SAU.1.t:0 "End Our Involvement in Palestine"
 AtM_SAU.1.desc:0 "Our symbolic deployment to Palestine was meant to demonstrate Saudi solidarity with the Arab cause, not to wage a prolonged war. With the Arab coalition collapsing and our limited forces achieving little, continuing this conflict serves no practical purpose. The royal court debates whether to quietly withdraw from this failing venture and focus on our own interests, or maintain our commitment despite the mounting costs and inevitable defeat."
 AtM_SAU.1.a:0 "Withdraw our forces from Palestine."
 AtM_SAU.1.b:0 "We will not abandon our Arab brothers!"
 
 ###################
 #   Iraqi Events  #
 ###################
 
 AtM_IRQ.1.t:0 "The Palestinian Campaign Falters"
 AtM_IRQ.1.desc:0 "Our expeditionary force in Palestine faces an increasingly dire situation. With supply lines stretched across multiple countries and the Arab coalition fragmenting, continuing this distant war is becoming untenable. The Iraqi public grows weary of casualties in a conflict far from our borders, while our forces gain nothing from prolonged fighting. We must decide whether to cut our losses and withdraw, or stubbornly continue a war we cannot win."
 AtM_IRQ.1.a:0 "Order our forces to stand down."
 AtM_IRQ.1.b:0 "Iraq will fight until victory!"
 AtM_IRQ.2.t:0 "Barzani Resistance Crushed"
 AtM_IRQ.2.desc:0 ""
 AtM_IRQ.2.a:0 "Good."
 
 #####################
 #   Yemeni Events   #
 #####################
 
 AtM_YEM.1.t:0 "Reconsider Our Position in Palestine"
 AtM_YEM.1.desc:0 "Yemen's participation in the Arab-Israeli War was driven by pan-Arab solidarity and religious obligation, but the reality on the ground has become undeniable. Our forces are far from home, operating in unfamiliar terrain with inadequate supply lines. With the Arab coalition disintegrating and Egypt's withdrawal from the conflict, our isolated contingent achieves nothing but continued casualties. The Imam faces pressure from both those who wish to honor our commitment to the Arab cause and pragmatists who recognize the futility of continuing this distant war. An armistice would allow us to withdraw with dignity and refocus on Yemen's own considerable challenges."
 AtM_YEM.1.a:0 "Accept the armistice and recall our forces."
 AtM_YEM.1.b:0 "Yemen will not abandon Palestine!"
 
 ###############################
 #   Arab-Israeli War Events   #
 ###############################
 
 AtM_AIW.1.t:0 "Call to Arms: The Arab-Israeli War"
 AtM_AIW.1.desc:0 "Israel has declared independence, and war has broken out in Palestine. As members of the Arab League, we have received an urgent call to join our Arab brothers in the struggle to prevent the establishment of a Jewish state. Egypt, Transjordan, Syria, Lebanon, and Iraq are mobilizing their forces. Will we honor our commitment to the Arab cause?"
 AtM_AIW.1.a:0 "We stand with Palestine and the Arab League!"
 AtM_AIW.1.b:0 "We cannot commit forces at this time."
 
 #########################
 #   Nicaraguan Events   #
 #########################
 
 AtM_NIC.1.t:0 "Intervention Request from Costa Rica"
 AtM_NIC.1.desc:0 "The legitimate government of Costa Rica has requested our involvement in their civil war to crush the ever growing rebels. Must we intervene?"
 AtM_NIC.1.a:0 "Never"
 AtM_NIC.1.b:0 "OOH RAH!"
 
 #########################
 #   Guatemalan Events   #
 #########################
 
 AtM_GUA.1.t:0 "Attempted Army Coup"
 AtM_GUA.1.desc:0 "As a consequence of our revolution and left-wing government, it shouldn't be surprising to us that the army, with the help of the U.S. would be trying to establish a military junta in our country. Whether they are successful in this, however, is up to luck..."
 AtM_GUA.1.a:0 "The coup succeeds"
 AtM_GUA.1.b:0 "The coup fails"
 
 ########################
 #   Brazilian Events   #
 ########################
 
 AtM_BRA.1.t:0 "The Civil War"
 AtM_BRA.1.desc:0 "The political situation in Brazil has reached a boiling point. The nation is now embroiled in a civil war, with factions vying for control of the government. The conflict has divided the country, with various states and military units aligning themselves with different political ideologies. The outcome of this war will determine the future direction of Brazil, whether it will embrace democracy, authoritarianism, or something else entirely."
 AtM_BRA.1.a:0 "The civil war rages on!"
 AtM_BRA.2.t:0 "General Elections"
 AtM_BRA.2.desc:0 "After Dutra's coup attempt, the country has been thrown into political chaos. In an effort to restore order and legitimacy, the government has called for general elections. Citizens are now faced with the opportunity to vote for their preferred candidates and shape the future of Brazil. The elections will be a critical test of the nation's democratic institutions and the will of its people."
 AtM_BRA.2.a:0 "PSD"
 AtM_BRA.3.t:0 "Dutra's Coup Attempt"
 AtM_BRA.3.desc:0 "General Eurico Dutra, a prominent military officer and political figure, has attempted to stage a coup against the current government. The situation is tense as various factions within the military and political sphere align themselves with either the government or the coup leaders."
 AtM_BRA.3.a:0 "Vargas is overthrown!"
 AtM_BRA.3.b:0 "Vargas refuses to step down!"
 AtM_BRA.4.t:0 "Dutra's Loyalists Seizes the South and Rio de Janeiro"
 AtM_BRA.4.desc:0 "Dutra's loyalists have successfully seized control of the southern regions and Rio de Janeiro, dealing a significant blow to the current government."
 AtM_BRA.4.a:0 "We will crush Dutra's forces!"
 AtM_BRA.5.t:0 "Workers' Uprising in Espirito Santo and the North"
 AtM_BRA.5.desc:0 "Workers in Espirito Santo and the North have launched a rebellion against the government, demanding better working conditions and social reforms."
 AtM_BRA.5.a:0 "We will suppress the uprising!"
 AtM_BRA.6.t:0 "General Rondon's Army Seizes Tocatins"
 AtM_BRA.6.desc:0 "General Rondon's forces have taken control of Tocantins, further complicating the civil war and threatening the stability of the nation."
 AtM_BRA.6.a:0 ""Rondon? What are you doing?!""

 #El Salvador Events
 AtM_ELS.1.t:0 "El Salvador invites us into the Santa Ana Agreement"
 AtM_ELS.1.desc:0 "The Salvadoran government has invited us to participate in the Santa Ana Agreement, a regional initiative aimed at promoting peace and stability in Central America. This agreement seeks to address ongoing conflicts and foster cooperation among neighboring countries. Our involvement could help shape the future of the region and strengthen diplomatic ties."
 AtM_ELS.1.a:0 "We will join the Santa Ana Agreement."
 AtM_ELS.1.b:0 "We will not participate in the Santa Ana Agreement."
 AtM_ELS.2.t:0 "[PREV.GetNameDef] joins the Joint Council"
 AtM_ELS.2.desc:0 "[PREV.GetNameDef] has decided to join the Joint Council, signaling their commitment to regional cooperation and stability."
 AtM_ELS.2.a:0 "This is a positive step forward."
 AtM_ELS.3.t:0 "[PREV.GetNameDef] rejects the Joint Council"
 AtM_ELS.3.desc:0 ""
 AtM_ELS.3.a:0 "Reasonable."
 AtM_ELS.4.t:0 "[ELS.GetNameDef] ask for Belize"
 AtM_ELS.4.desc:0 ""
 AtM_ELS.4.a:0 "No!"
 AtM_ELS.4.b:0 "Fine..."

 #Ecuador
 AtM_ECU.1.t:0 "Fate of the Leftists"
 AtM_ECU.1.desc:0 ""
 AtM_ECU.1.a:0 "Persecute them!"
 AtM_ECU.1.b:0 "Ibarra! You are an Idiot! Viva la Revolution!"

 #Argentina
 AtM_ARG.1.t:0 "March of the Constitution and Freedom"
 AtM_ARG.1.desc:0 ""
 AtM_ARG.1.a:0 "Oh No..."
 AtM_ARG.2.t:0 "Storming of Plaza de Mayo"
 AtM_ARG.2.desc:0 ""
 AtM_ARG.2.a:0 "Peron is free!"
 AtM_ARG.2.b:0 "Shoot the demonstrators!"
 AtM_ARG.3.t:0 "Argentinan Civil War"
 AtM_ARG.3.desc:0 ""
 AtM_ARG.3.a:0 "Welp. Here we go again."
 AtM_ARG.4.t:0 "Alianza Libertadora Nacionalista Coup"
 AtM_ARG.4.desc:0 ""
 AtM_ARG.4.a:0 "Uh oh"
 AtM_ARG.5.t:0 "Argentina Offers us Formosa for Help"
 AtM_ARG.5.desc:0 ""
 AtM_ARG.5.a:0 "Sure!"
 AtM_ARG.6.t:0 "Chile and Paraguay mobilizes against us!"
 AtM_ARG.6.desc:0 ""
 AtM_ARG.6.a:0 "Second Rematch?"

 ##############################
 #   Generic Country Events   #
 ##############################
 
 AtM_generic.1.t:0 "UN Proposal: Sanction [SOV.GetNameDef]"
 AtM_generic.1.desc:0 "Today a vote was passed by the UN to sanction [SOV.GetNameDef]. Following the Soviets refusing to leave northern Iran, it should be up to us to view an appropriate course of action following this."
 AtM_generic.1.a:0 "Vote: Yes"
 AtM_generic.1.b:0 "Vote: No"
 
 AtM_generic.2.t:0 "[FROM.GetNameDefCap] Proposes Peace"
 AtM_generic.2.desc:0 "[FROM.GetNameDefCap] has proposed ending the war through a limited peace conference. Their negotiating power will be determined by the relative territorial, military, political, and logistical position of both sides when we accept."
 AtM_generic.2.a:0 "Convene the peace conference."
 AtM_generic.2.b:0 "There will be no peace."
 
 ###################
 #   News Events   #
 ###################
 
 AtM_news.1.t:0 "France Declares War on Vietnamese Rebels"
 AtM_news.1.desc:0 "After months of escalating tensions and failed negotiations, the French government has officially declared war on the Democratic Republic of Vietnam. The declaration follows the DRV's refusal to accept French terms for continued colonial control and their steadfast insistence on independence. The situation in Indochina has been deteriorating since the end of World War II, with Vietnamese nationalist forces under Ho Chí Minh asserting their right to self-determination. Despite diplomatic efforts to avoid armed conflict, France views the DRV's unilateral declaration of independence as a direct threat to its empire. The French military has begun mobilizing forces to re-establish control over the region, plunging Southeast Asia into a new war."
 AtM_news.1.a:0 "We fight on"
 AtM_news.1.b:0 "They will not stop us!"
 AtM_news.1.c:0 "Worrying"
 
 AtM_news.2.t:0 "The Founding of the DPRK"
 AtM_news.2.desc:0 "After years of division and tension on the Korean Peninsula, the Democratic People's Republic of Korea was officially proclaimed in Pyongyang. With support from the Soviet Union, Kim Il-sung, a Korean revolutionary and former officer in the Soviet Red Army, was appointed as the nation's first leader.\n\nThe declaration was met with fervent celebrations by some and foreboding concern by others, as this new state sought to unify Korea under socialist governance. Yet, with South Korea under American influence and wary of northern intentions, the founding of the DPRK only deepened the ideological chasm between North and South."
 AtM_news.2.a:0 "Glory to the DPRK!"
 AtM_news.2.b:0 "Interesting"
 AtM_news.2.c:0 "Worrying"
 
 AtM_news.3.t:0 "Chinese Annexation of Tibet"
 AtM_news.3.desc:0 "In a swift and decisive campaign, the People's Liberation Army (PLA) has crossed into Tibet, marking the culmination of China's efforts to bring the region under its control. Despite limited Tibetan resistance, the military and political might of the People's Republic of China (PRC) proved overwhelming. Tibet's religious leadership, led by the Dalai Lama, has pleaded for international support, but world powers remain reluctant to intervene in what they see as a Chinese "internal affair". Under the pretext of "peaceful liberation," the PRC has claimed Tibet as an integral part of China, asserting that this move will secure stability and unity within its borders."
 AtM_news.3.a:0 "Rightfully"
 AtM_news.3.b:0 "A disgrace!"
 AtM_news.3.c:0 "Worrying"
 
 AtM_news.4.t:0 "An Iron Curtain Descends"
 AtM_news.4.desc:0 "As the dust settles over postwar Europe, a new geopolitical reality has taken shape. Winston Churchill has famously declared that an "Iron Curtain has descended across the continent," separating the Western democracies from the Eastern Bloc under Soviet influence. This metaphorical divide represents the ideological, political, and military split between the capitalist West and the communist East, which threatens to plunge Europe, and potentially the world, into a prolonged standoff. The Western Allies, wary of Soviet expansion, have solidified their alliances and are strengthening their military and economic ties. From the Baltic to the Adriatic, communist governments have consolidated power under Moscow's watchful eye, while millions of Europeans find themselves on opposite sides of an increasingly impermeable barrier that divides the continent."
 AtM_news.4.a:0 "Excellent"
 AtM_news.4.b:0 "Worrying"
 
 AtM_news.5.t:0 "Formation of the COMECON"
 AtM_news.5.desc:0 "In response to the Western Bloc's establishment of the Marshall Plan to rebuild Europe's economies, the Soviet Union has gathered its socialist allies to form the Council for Mutual Economic Assistance (COMECON). This economic alliance aims to foster cooperation among communist states by coordinating trade, sharing resources, and supporting collective economic growth. Though initially focused on Soviet influence over the economies of Eastern Europe, COMECON symbolizes the deepening divide between the capitalist West and the communist East. Under this framework, Moscow will seek to integrate and oversee the economies of the Eastern Bloc, tightening economic ties to reinforce political loyalty and reduce dependency on the West."
 AtM_news.5.a:0 "Wonderful"
 AtM_news.5.b:0 "Worrying"
 
 AtM_news.6.t:0 "West Berlin Blockade"
 AtM_news.6.desc:0 "Tensions between the Soviet Union and the Western Allies have reached a critical boiling point in postwar Europe. In a bold and aggressive move to assert control over the entire city of Berlin, the Soviet Union has blocked all land and rail routes into the sectors of the city controlled by the Western Allies. This blockade is a calculated effort by the Soviets to force the Allies out of Berlin and establish Soviet dominance over the divided city. As a result, the citizens of West Berlin now find themselves completely cut off from essential supplies, facing a dire and rapidly worsening crisis. With all ground routes into West Berlin sealed off, the city is at imminent risk of a severe shortage of food, fuel, and other necessities, leaving more than two million residents in urgent need of assistance."
 AtM_news.6.a:0 "A necessary step."
 AtM_news.6.b:0 "Worrying"
 
 AtM_news.7.t:0 "Formation of the German Democratic Republic"
 AtM_news.7.desc:0 "Following years of Soviet occupation and influence in the eastern zones of Germany, the German Democratic Republic (DDR) has officially been proclaimed in East Berlin. The DDR is now the newest member of the Eastern Bloc, a socialist state closely allied with Moscow and modeled on Soviet ideals. Led by the Socialist Unity Party (SED), the DDR is set to become a bulwark of communism in Central Europe, firmly divided from its Western counterpart, the Federal Republic of Germany. As the DDR begins its journey as a member of the Eastern Bloc, it faces internal challenges to establish loyalty among its citizens and external pressure as the frontline of Soviet influence in Central Europe."
 AtM_news.7.a:0 "Wonderful"
 AtM_news.7.b:0 "Interesting"
 
 AtM_news.8.t:0 "Establishment of the Cominform"
 AtM_news.8.desc:0 "After the end of World War II, the Soviet Union has solidified its influence across Eastern Europe, aiming to establish a united front against the growing power of the Western Allies. In an effort to coordinate communist policies and fortify ideological unity among the Eastern Bloc nations, representatives from various Communist parties across Europe have gathered at Stalin's behest. Thus, the Communist Information Bureau, or Cominform, has been officially founded. This organization will serve as a centralized body to oversee communist activities and strategies, enhancing cooperation between the USSR and aligned countries. Through it, Stalin and the Soviet leadership will now have a direct channel to monitor and control Communist movements across Europe, ensuring that all member parties adhere to the Soviet model and policies."
 AtM_news.8.a:0 "Excellent"
 AtM_news.8.b:0 "Interesting"
 
 AtM_news.9.t:0 "North Atlantic Treaty Organization Formed"
 AtM_news.9.desc:0 "In a historic signing ceremony in Washington, D.C., representatives from the United States, Canada, and several Western European nations have established the North Atlantic Treaty Organization (NATO). This mutual defense pact commits all signatories to consider an attack against any member nation as an attack against all. The alliance, championed by the United States, is widely seen as a direct response to the growing influence of the Soviet Union in Eastern Europe. President Harry S. Truman declared that 'NATO will serve as a shield against aggression and the fear of aggression,' while Soviet representatives have denounced the alliance as 'an aggressive tool of American imperialism.' The formation of this powerful military alliance marks a significant escalation in the "Cold War" tensions and formally divides Europe into two opposing camps."
 AtM_news.9.a:0 "A historic day for American-led security!"
 AtM_news.9.b:0 "Together we stand against communist aggression."
 AtM_news.9.c:0 "A provocative act of capitalist imperialism!"
 AtM_news.9.d:0 "The world becomes more divided each day."
 
 AtM_news.10.t:0 "Sino-Soviet Treaty of Friendship and Alliance"
 AtM_news.10.desc:0 "A new chapter in Communist unity has begun with the signing of the Sino-Soviet Treaty of Friendship, Alliance, and Mutual Assistance in Moscow. The agreement, negotiated by Chinese Premier Zhou Enlai and Soviet leader Joseph Stalin, marks a critical milestone in the partnership between the Soviet Union and the newly established People's Republic of China, led by Chairman Mao Zedong. The treaty guarantees economic support from the Soviet Union, including loans and technical aid to rebuild China's devastated economy following decades of civil war and the brutal Japanese occupation. Military assistance is also a cornerstone of the pact, ensuring that both nations will support each other in the event of external aggression."
 AtM_news.10.a:0 "Glory to Communism"
 AtM_news.10.b:0 "Interesting"
 AtM_news.10.c:0 "Worrying"
 
 AtM_news.11.t:0 "A Civil War in Greece"
 AtM_news.11.desc:0 "This year in 1946, communist partisans in Greece have officially initiated a civil war against the monarchist government in power in Athens. Reports indicate that the communist partisans have been entering Northern Greece through their northern communist neighbors, Albania and Yugoslavia. The civil war began following clashes in the mountains and neighborhoods of Greece. The conflict has its roots in the wartime resistance against German occupation, where communist and non-communist groups fought both the Nazis and each other for control of post-war Greece. British forces have intervened to support the royalist government, while the communist Democratic Army of Greece, led by former resistance fighters, controls significant rural territories and enjoys backing from Yugoslavia's Marshal Tito."
 AtM_news.11.a:0 "Terrible!"
 AtM_news.11.b:0 "Onwards to Victory!"
 AtM_news.11.c:0 "May the workers be free!"
 
 AtM_news.12.t:0 "North Korean Independence War"
 AtM_news.12.desc:0 "Breaking news from Asia: the North Korean government has officially declared independence from the Soviet Union. This bold move was swiftly met with a response from Moscow, which has formally declared a state of war between the two states.\nThe situation remains highly uncertain, but reports indicate that militias have formed across North Korea, rallying to defend their homeland against Soviet forces. The world watches anxiously as the conflict unfolds, with the fate of the Korean Peninsula hanging in the balance."
 AtM_news.12.a:0 "A Free Korea?"
 AtM_news.12.b:0 "Another Rowdy Communist Nation."
 AtM_news.12.c:0 "For the Freedom of the Korean People!"
 
 AtM_news.13.t:0 "Mystery of Flight 19"
 AtM_news.13.desc:0 "A mysterious tragedy has struck the Atlantic as five American naval bombers vanished without a trace near Bermuda, in an area now commonly referred to as the "Bermuda Triangle." Reports indicate that 14 crew members are missing and presumed dead due to the unknown circumstances surrounding their disappearance.\n\nThe flight, originally planned as a routine training mission, was abruptly cut short by this enigma. According to a Navy investigator's report, a compass malfunction may have caused the squadron to deviate from its intended course, possibly heading toward Bermuda before vanishing. The fate of Flight 19 remains a chilling mystery."
 AtM_news.13.a:0 "Rest in Peace."
 
 AtM_news.14.t:0 "The Marshall Plan Announced"
 AtM_news.14.desc:0 "Secretary of State George C. Marshall has unveiled a sweeping economic recovery program aimed at rebuilding war-torn European economies. In a landmark speech at Harvard University, Marshall outlined what is now being called the 'European Recovery Program,' offering American economic assistance to all European nations willing to participate in their collective economic reconstruction. The plan, already nicknamed the 'Marshall Plan,' is unprecedented in scope and generosity, potentially committing billions of dollars in American aid. Western European nations have responded with enthusiasm, seeing the program as a lifeline for their struggling economies. The Soviet Union, however, has denounced the plan as an American attempt to buy influence in Europe and has forbid Eastern Bloc countries from participating."
 AtM_news.14.a:0 "A necessary investment."
 AtM_news.14.b:0 "This aid will help rebuild our country."
 AtM_news.14.c:0 "A veiled attempt at American imperialism."
 AtM_news.14.d:0 "An interesting development."
 
 AtM_news.15.t:0 "Berlin Airlift Begins"
 AtM_news.15.desc:0 "In response to the Soviet blockade of West Berlin, Western Allies have initiated a massive airlift operation to supply the isolated city. With all land routes cut off by Soviet forces, American and British aircraft are now flying around the clock to deliver essential food, fuel, and supplies to the 2 million residents of the Western sectors of Berlin. The unprecedented operation, officially named 'Operation Vittles' by the Americans, is rapidly expanding with hundreds of flights daily. Soviet officials have expressed surprise at the scale and determination of the Western response, having apparently expected the blockade to force the Allies out of Berlin. Despite the logistical challenges, Allied commanders have vowed to continue the airlift for as long as necessary, turning what was intended as a show of Soviet force into a demonstration of Western resolve."
 AtM_news.15.a:0 "We will not abandon the people of West Berlin."
 AtM_news.15.b:0 "A remarkable demonstration of Allied solidarity."
 AtM_news.15.c:0 "A provocative Western intrusion into our sphere."
 AtM_news.15.d:0 "The West refuses to respect our sovereignty."
 AtM_news.15.e:0 "The global tensions escalate."
 
 AtM_news.16.t:0 "Southeast Asia Treaty Organization Formed"
 AtM_news.16.desc:0 "The United States has led the establishment of a new collective defense organization focused on Southeast Asia. The Southeast Asia Treaty Organization (SEATO), formalized in Manila, includes the United States, United Kingdom, France, Australia, New Zealand, Pakistan, Thailand, and the Philippines as founding members. Modeled after NATO, SEATO aims to provide a security framework against communist expansion in Southeast Asia. Unlike its European counterpart, however, SEATO does not include many of the countries it purports to protect, as neutralist nations like Indonesia, Burma, and India declined to join. Communist nations have predictably condemned the alliance as an instrument of Western imperialism designed to maintain colonial influence in the region."
 AtM_news.16.a:0 "Another vital alliance."
 AtM_news.16.b:0 "We will secure stability in Southeast Asia."
 AtM_news.16.c:0 "More evidence of Western imperialist encirclement."
 AtM_news.16.d:0 "The Cold War expands into new theaters."
 
 AtM_news.17.t:0 "Bizone Formed in Occupied Germany"
 AtM_news.17.desc:0 "The United States and Great Britain have announced the merger of their occupation zones in Germany, creating what is already being called the 'Bizone.' This administrative consolidation represents a significant step toward economic recovery in western Germany and signals the Western Allies' determination to rebuild Germany as a democratic bulwark against Soviet expansion. The Bizone will feature unified economic administration, coordinated industrial policies, and streamlined governance structures. Soviet authorities have vehemently protested this move, viewing it as a violation of four-power governance agreements and a step toward permanently dividing Germany. France, which maintains its own occupation zone, has expressed reservations but appears likely to eventually join the arrangement."
 AtM_news.17.a:0 "A necessary step."
 AtM_news.17.b:0 "We can rebuild Germany as a democratic ally."
 AtM_news.17.c:0 "A blatant violation of the Potsdam."
 AtM_news.17.d:0 "We maintain reservations."
 AtM_news.17.e:0 "Germany's postwar division deepens."
 
 AtM_news.18.t:0 "Federal Republic of Germany Established"
 AtM_news.18.desc:0 "In a historic ceremony in Bonn, the Federal Republic of Germany has been officially established as a sovereign democratic state. This new West German government, led by Chancellor Konrad Adenauer, will administer the territories previously governed by the Western Allied occupation authorities, though Allied forces will maintain a presence. The creation of West Germany marks a definitive break in the four-power administration of occupied Germany and effectively formalizes the division of the country. The Soviet Union has condemned the move as illegal and has already indicated that it will establish a separate East German state in its occupation zone. The division of Germany, once considered a temporary postwar arrangement, now appears increasingly permanent as tensions solidify into concrete political realities."
 AtM_news.18.a:0 "A triumph for freedom in Europe."
 AtM_news.18.b:0 "Welcome to the community."
 AtM_news.18.c:0 "Our nation rises again."
 AtM_news.18.d:0 "This illegal state violates all postwar agreements."
 AtM_news.18.e:0 "The imperialists have established their puppet regime."
 AtM_news.18.f:0 "Germany's division is now complete."
 
 AtM_news.19.t:0 "The Republic of Korea Established"
 AtM_news.19.desc:0 "Today marks a historic moment on the Korean Peninsula as the Republic of Korea has been officially established in Seoul. Following three years of American military administration after Japanese surrender, South Korea has taken its first steps as an independent nation. The new republic, led by President [ROK.GetLeader], declares itself the legitimate government of all Korea, though its effective control extends only to the territory south of the 38th parallel. The establishment comes against a backdrop of increasing tensions, with Soviet forces having established a communist administration in the north. The United Nations has recognized the Republic of Korea as the only legitimate government on the peninsula, a position contested by the Soviet Union and its allies."
 AtM_news.19.a:0 "Our republic will endure and prosper!"
 AtM_news.19.b:0 "A new democratic ally in East Asia"
 AtM_news.19.c:0 "A puppet regime of American imperialism"
 AtM_news.19.d:0 "This illegitimate entity threatens Korean unity"
 AtM_news.19.e:0 "Another flashpoint in the growing tensions"
 
 AtM_news.20.t:0 "South Korea Formally Aligns with the U.S."
 AtM_news.20.desc:0 "In a significant diplomatic development, the Republic of Korea has officially aligned itself with the United States, solidifying its position in the Western bloc. The announcement comes after months of negotiations between Washington and Seoul, resulting in agreements covering military cooperation and economic assistance. Under the terms announced today, American forces will maintain a presence in South Korea, and the United States has pledged to provide extensive military and economic aid to strengthen the fledgling republic against the communist threat from the north. President [ROK.GetLeader] emphasized that this alliance is crucial for South Korea's security and development in the face of increasing tensions on the peninsula."
 AtM_news.20.a:0 "This alliance ensures our survival and prosperity."
 AtM_news.20.b:0 "A strategic partnership in a critical region."
 AtM_news.20.c:0 "Further proof of American imperialism."
 AtM_news.20.d:0 "Another American puppet state established"
 AtM_news.20.e:0 "The capitalists strengthen their hold on Korea."
 AtM_news.20.f:0 "A prudent move in uncertain times."
 
 AtM_news.21.t:0 "War Erupts on Korean Peninsula"
 AtM_news.21.desc:0 "The world was shocked today as North Korean forces launched a massive invasion across the 38th parallel, striking deep into South Korean territory. The surprise attack began at dawn with artillery bombardments followed by columns of Soviet-made tanks and waves of infantry pushing southward.\n\nThe South Korean army, caught unprepared, is struggling to mount an effective defense, and North Korean forces have already made significant territorial gains. Seoul is under direct threat as communist forces advance rapidly. President [ROK.GetLeader] has called for immediate international assistance while ordering all available forces to resist the invasion."
 AtM_news.21.a:0 "We will defend our nation to the last!"
 AtM_news.21.b:0 "The liberation of the south has begun!"
 AtM_news.21.c:0 "We must come to South Korea's aid immediately"
 AtM_news.21.d:0 "The Korean people are fighting against American imperialism"
 AtM_news.21.e:0 "This conflict could spread to our borders"
 AtM_news.21.f:0 "A justified struggle against Western imperialism"
 AtM_news.21.g:0 "Another democracy threatened by communist aggression"
 AtM_news.21.h:0 "Let us stay clear of this conflict"
 
 AtM_news.22.t:0 "Armistice Signed in Korean War"
 AtM_news.22.desc:0 "After three years of bloody conflict that has devastated the Korean Peninsula, representatives from North Korea, China, and the United Nations Command have signed an armistice agreement at Panmunjom. The agreement establishes a ceasefire and creates a demilitarized zone (DMZ) approximately 2.5 miles wide along the 38th parallel, separating North and South Korea.\n\nThe armistice does not represent a formal peace treaty but rather a cessation of hostilities. South Korean President [ROK.GetLeader], who had opposed any agreement that left Korea divided, reluctantly accepted the terms under American pressure."
 AtM_news.22.a:0 "The war may be paused, but our struggle continues"
 AtM_news.22.b:0 "We have successfully defended our revolution"
 AtM_news.22.c:0 "We've contained communist aggression, but at a terrible cost"
 AtM_news.22.d:0 "A necessary compromise to prevent greater conflict"
 AtM_news.22.e:0 "Our intervention preserved Korean sovereignty"
 AtM_news.22.f:0 "Another unresolved conflict in the Cold War"
 
 AtM_news.23.t:0 "Peace Treaty Signed with Italy"
 AtM_news.23.desc:0 "While the Second World War ended a year ago and the Italian government decided to leave the Axis two years prior, only now has a peace treaty been signed between [ITA.GetNameDef] and the Allied powers."\n\n"Because of the treaty [ITA.GetNameDef] now has to give up its territories in Greece and in the Balkans, its African colonies get divided between [ENG.GetNameDef] and [FRA.GetNameDef]. In the Balkans, instead a new country will be created: [TRE.GetNameDef], a territory divided between [YUG.GetNameDef] and [UNC.GetNameDef]."
 AtM_news.23.a:0 "This is what happens when you switch sides!"
 AtM_news.23.b:0 "Territorial expansion, yipee!"
 AtM_news.23.c:0 "Isn't it a bit late for a peace treaty?"
 
 AtM_news.24.t:0 "The Double Tenth Agreement"
 AtM_news.24.desc:0 "In a rather historic display; the Kuomintang and the Communist Party representatives have agreed to sign an agreement in which the existing civil war state prior to the Sino-Japanese War is planned to be remedied.\n\nUnder the agreement; KMT promised to promulgate a long-expected constitution and CCP promised to lay down arms to become a legal party to partake in the national politics. Observers are quick to note, however, that this agreement is not likely to last for long; and the renewal of the civil war is very likely."
 AtM_news.24.a:0 "First step to heal the nation."
 
 AtM_news.25.t:0 "United States Supports South Vietnam"
 AtM_news.25.desc:0 "In a significant policy shift, the United States has announced its intention to directly support the establishment of an independent, non-communist South Vietnam under the leadership of Ngô Đình Diem. This move signals a transition of influence from France to America in the volatile Indochinese region.\n\nThe announcement comes as French forces continue to struggle against the Viet Minh insurgency, with the war increasingly unpopular among the French public. American officials have stated that preventing communist expansion in Southeast Asia is a vital national security interest, and that a stable, pro-Western South Vietnam would serve as a crucial bulwark against further communist gains in the region."
 AtM_news.25.a:0 "South Vietnam must remain free."
 AtM_news.25.b:0 "With America, we will secure our independence."
 AtM_news.25.c:0 "Our influence in Indochina wanes."
 AtM_news.25.d:0 "The puppet regime will not stop Vietnam's reunification!"
 AtM_news.25.e:0 "Another example of American imperialism."
 AtM_news.25.f:0 "The conflict in Indochina enters a new phase."
 
 AtM_news.26.t:0 "Indonesian Independence Recognized"
 AtM_news.26.desc:0 "After years of bitter conflict and tense negotiations, the Netherlands has formally recognized the independence of Indonesia in a ceremony at The Hague. This historic agreement, reached under significant American diplomatic pressure, ends more than three centuries of Dutch colonial rule and four years of armed struggle following Indonesia's unilateral declaration of independence in 1945. The United States played a pivotal role in brokering the settlement, threatening to withhold Marshall Plan aid from the Netherlands unless a resolution was reached. Indonesian nationalists led by Sukarno have celebrated the recognition as the culmination of their long struggle for freedom, though some territorial disputes, particularly over West New Guinea (West Irian), remain unresolved."
 AtM_news.26.a:0 "A diplomatic success that maintains Western influence in Indonesia."
 AtM_news.26.b:0 "Our independence is finally recognized!"
 AtM_news.26.c:0 "Ffarewell to our East Indies possessions."
 AtM_news.26.d:0 "The colonial powers retreat."
 AtM_news.26.e:0 "Another colony achieves its independence."
 
 AtM_news.27.t:0 "United States Passes Civil Rights Act"
 AtM_news.27.desc:0 "In a historic moment for the United States, President Johnson has signed the Civil Rights Act into law after its passage through Congress. This landmark legislation outlaws discrimination based on race, color, religion, sex, or national origin in public accommodations, facilities, and schools across America.\n\nThe Act represents the culmination of years of civil rights activism and protests, including the March on Washington where Dr. Martin Luther King Jr. delivered his famous 'I Have a Dream' speech. It effectively dismantles the legal framework for segregation that has existed in parts of the United States for generations."
 AtM_news.27.a:0 "A historic day for America."
 AtM_news.27.b:0 "A significant development in society."
 
 AtM_news.28.t:0 "United States 'Massive Retaliation' Doctrine"
 AtM_news.28.desc:0 "In a major policy announcement, the United States has formally adopted a strategy of 'massive retaliation' against Soviet aggression. Secretary of State John Foster Dulles declared that any attack on the United States or its allies would be met with an overwhelming nuclear response, regardless of the scale of the initial aggression.\n\nThis doctrine represents a significant shift in American military strategy, emphasizing nuclear deterrence over conventional military responses. Rather than matching Soviet conventional forces around the world, the United States will rely on its growing nuclear arsenal to deter aggression."
 AtM_news.28.a:0 "Our strength will preserve peace."
 AtM_news.28.b:0 "This will not deter us."
 AtM_news.28.c:0 "A dangerous escalation."
 
 AtM_news.29.t:0 "Americans Land on the Moon"
 AtM_news.29.desc:0 "In what can only be described as one of humanity's greatest achievements, American astronauts have successfully landed on the Moon and returned safely to Earth. The Apollo 11 mission, launched from Cape Kennedy on July 16, carried astronauts Neil Armstrong, Edwin 'Buzz' Aldrin, and Michael Collins on their historic journey. On July 20, Armstrong became the first human to set foot on another world, famously declaring: 'That's one small step for man, one giant leap for mankind.' The astronauts spent over two hours exploring the lunar surface, collecting samples, and conducting experiments before returning to Earth. This remarkable achievement marks the culmination of the Space Race and demonstrates America's technological capabilities."
 AtM_news.29.a:0 "A proud day for America!"
 AtM_news.29.b:0 "The C.C.C.P applauds."
 AtM_news.29.c:0 "A triumph for humanity."
 
 AtM_news.30.t:0 "Elections in Costa Rica"
 AtM_news.30.desc:0 "With a land slide, Otilio Ulate Blanco of the National Union Party has appeared to win the presidential elections in Costa Rica. Reports have come in from the country that the people of the country believe that the elections were fraudulent which so far has resulted in mass protests starting on the streets against the party in support of the opposition: Rafael Ángel Calderón Guardia.\n\n The country appears to be on the brink of a civil war..."
 AtM_news.30.a:0 "Interesting..."
 
 AtM_news.31.t:0 "Soviet Forces Withdraw from Northern Iran"
 AtM_news.31.desc:0 "Following mounting international pressure and diplomatic negotiations, the Soviet Union has announced the complete withdrawal of its military forces from northern Iran. Soviet troops, which had occupied the region since the Anglo-Soviet invasion of 1941, have begun their departure after years of international tension over their continued presence. The withdrawal comes after intense diplomatic pressure from the United States and Britain, who had demanded Soviet compliance with wartime agreements to evacuate Iran within six months of the war's end. The Iranian government has welcomed the news, viewing it as a restoration of their territorial sovereignty, though concerns remain about the fate of Soviet-backed separatist movements in Azerbaijan and Kurdistan that had emerged under Soviet protection."
 AtM_news.31.a:0 "A strategic withdrawal"
 AtM_news.31.b:0 "Our sovereignty is finally restored!"
 AtM_news.31.c:0 "Soviet compliance with international agreements"
 AtM_news.31.d:0 "The end of Soviet occupation in Iran"
 
 AtM_news.32.t:0 "British Forces Withdraw from Southern Iran"
 AtM_news.32.desc:0 "In accordance with postwar agreements and under mounting international pressure, British forces have completed their withdrawal from southern Iran, ending years of military occupation that began during the Second World War. The evacuation marks the end of the Anglo-Soviet occupation of Iran, which was initially justified as necessary to secure supply routes to the Soviet Union and prevent potential German influence in the region. The Iranian government has celebrated the restoration of full sovereignty over its southern territories. The withdrawal comes as part of broader decolonization efforts and reflects changing geopolitical priorities in the postwar Middle East, though Britain maintains significant economic interests in Iranian oil through various commercial arrangements."
 AtM_news.32.a:0 "A dignified withdrawal respecting Iranian sovereignty"
 AtM_news.32.b:0 "Our independence is finally near!"
 AtM_news.32.c:0 "British compliance with international law"
 AtM_news.32.d:0 "The end of British occupation in Iran"
 
 AtM_news.33.t:0 "President Truman Announces a New Doctrine"
 AtM_news.33.desc:0 "In a historic address to a joint session of Congress, President Harry S. Truman has announced a sweeping new foreign policy doctrine that fundamentally reshapes America's role in the world. The 'Truman Doctrine,' as it is already being called, commits the United States to supporting free peoples who are resisting attempted subjugation by armed minorities or outside pressures. The President's speech was prompted by the urgent situation in Greece and Turkey, where communist insurgencies threaten to topple democratic governments. Truman declared that 'it must be the policy of the United States to support free peoples who are resisting attempted subjugation by armed minorities or by outside pressures,' effectively committing America to a global struggle against the communist expansion."
 AtM_news.33.a:0 "America will lead the free world against tyranny."
 AtM_news.33.b:0 "We stand with America in this noble cause."
 AtM_news.33.c:0 "American imperialism disguised as liberation!"
 AtM_news.33.d:0 "Finally, the support we desperately need."
 AtM_news.33.e:0 "The world becomes more divided."
 
 AtM_news.34.t:0 "Birth of Israel and Palestine"
 AtM_news.34.desc:0 "After three decades of British administration, the Mandate for Palestine has come to an end. In a momentous decision that will reshape the Middle East, Britain has announced the simultaneous establishment of two independent states: the State of Israel and the State of Palestine. The partition follows years of escalating tensions between Jewish and Arab communities, mounting international pressure, and the devastating impact of the Holocaust on world opinion. David Ben-Gurion has proclaimed the independence of Israel in Tel Aviv, while Palestinian leaders have declared their own state with its capital in Gaza. The British withdrawal marks the end of an era, but the birth of these two nations in the same territory has already sparked concerns about future conflicts. Both claim historical and religious ties to the same lands."
 AtM_news.34.a:0 "The burden of empire grew too heavy."
 AtM_news.34.b:0 "At last, a homeland for the Jewish people!"
 AtM_news.34.c:0 "Palestine shall be free and independent!"
 AtM_news.34.d:0 "This partition may bring stability to the region."
 AtM_news.34.e:0 "Another victory against Western imperialism!"
 AtM_news.34.f:0 "A complicated situation with uncertain outcomes."
 
 AtM_news.35.t:0 "Communist Victory in Polish Elections"
 AtM_news.35.desc:0 "The results of Poland's parliamentary elections have been announced, with the Polish Workers' Party (PPR) and their allies in the Democratic Bloc achieving a decisive victory. The elections, held under the watchful eye of Soviet authorities, saw widespread reports of intimidation and electoral irregularities. Opposition parties, particularly the Polish People's Party (PSL) led by Stanisław Mikołajczyk, faced systematic harassment and restrictions on their campaign activities. With this electoral triumph, the communist forces have consolidated their control over Poland, effectively ending any hopes of a pluralistic democracy in the country. The victory ensures Poland's firm alignment with the Soviet sphere of influence and marks another step in the establishment of communist rule across Eastern Europe."
 AtM_news.35.a:0 "The Polish people have chosen socialism!"
 AtM_news.35.b:0 "Our future is secured under the new government."
 AtM_news.35.c:0 "Another democracy falls to communist manipulation."
 AtM_news.35.d:0 "Solidarity with our Polish comrades!"
 AtM_news.35.e:0 "The Iron Curtain tightens its grip."
 
 AtM_news.36.t:0 "Fall of Nanjing"
 AtM_news.36.desc:0 "In a devastating blow to the Nationalist government, the People's Liberation Army has successfully captured Nanjing, the capital of the Republic of China. After months of fierce fighting and strategic encirclement, Communist forces have broken through the city's defenses and taken control of this symbolic stronghold. The fall of Nanjing represents a critical turning point in the Chinese Civil War, as the Nationalist government loses not only its capital but also its claim to legitimacy in the eyes of many Chinese. President Chiang Kai-shek and his government have been forced to flee southward, while Communist forces celebrate their greatest victory yet in their campaign to unite China under the red banner."
 AtM_news.36.a:0 "Our capital has fallen... but we fight on!"
 AtM_news.36.b:0 "Victory! The people's revolution advances!"
 AtM_news.36.c:0 "Our Chinese comrades march toward total victory."
 AtM_news.36.d:0 "The Nationalists are losing ground rapidly."
 AtM_news.36.e:0 "The Chinese Civil War takes a decisive turn."
 
 AtM_news.37.t:0 "U.S. Seventh Fleet Blockades Taiwan Strait"
 AtM_news.37.desc:0 "In a dramatic escalation of tensions in the Taiwan Strait, the United States has deployed its powerful Seventh Fleet to establish a naval blockade preventing any military action between mainland China and Taiwan. The fleet, under the command of Admiral Arthur W. Radford, has taken position in the strategic waterway with orders to prevent any attempt by the People's Liberation Army to launch an invasion of Taiwan. President Truman announced that the United States will not permit any attack on Taiwan, effectively placing American naval power between the Communist forces on the mainland and the KMT that has retreated to the island. This unprecedented intervention marks a significant escalation in American involvement in the Chinese Civil War and signals Washington's commitment to preventing Communist expansion."
 AtM_news.37.a:0 "We will defend the free world from Communist aggression."
 AtM_news.37.b:0 "American protection ensures our survival."
 AtM_news.37.c:0 "The imperialists dare to interfere in our internal affairs!"
 AtM_news.37.d:0 "American imperialism shows its true face."
 AtM_news.37.e:0 "The Cold War reaches the Taiwan Strait."
 
 AtM_news.38.t:0 "[FROM.GetNameDefCap] Withdraws from NATO"
 AtM_news.38.desc:0 "In a shocking diplomatic development, [FROM.GetNameDefCap] has officially announced its withdrawal from the North Atlantic Treaty Organization. The decision, which has sent ripples through Western capitals, marks a significant shift in the global balance of power during these tense Cold War years. Government officials in [FROM.Capital.GetCapitalVictoryPointName] cited national sovereignty and the desire to pursue an independent foreign policy as primary reasons for the withdrawal. The move has been met with dismay by NATO allies, who view this as a weakening of the Western alliance against Soviet expansion, while communist nations have hailed it as a victory against Western imperialism."
 AtM_news.38.a:0 "We choose our own path, free from foreign obligations."
 AtM_news.38.b:0 "A betrayal of our collective security arrangements!"
 AtM_news.38.c:0 "Another crack in the capitalist alliance!"
 AtM_news.38.d:0 "The Western bloc shows signs of fracturing."
 
 AtM_news.39.t:0 "Radio Free Europe Begins Broadcasting"
 AtM_news.39.desc:0 "In a significant development in the propaganda war between East and West, the United States has launched Radio Free Europe, a powerful broadcasting network aimed at penetrating the Iron Curtain. Operating from Munich, the station will transmit news, music, and political commentary in multiple Eastern European languages, including Polish, Czech, Hungarian, and Romanian. The broadcasts are designed to provide uncensored information to populations living under communist rule and to counter Soviet propaganda efforts. Radio Free Europe represents a new front in the ideological struggle of the Cold War, using the airwaves to reach millions of people behind the Iron Curtain."
 AtM_news.39.a:0 "The voice of freedom will reach those in darkness."
 AtM_news.39.b:0 "Finally, truth can penetrate the Iron Curtain."
 AtM_news.39.c:0 "Capitalist propaganda seeks to poison our people's minds!"
 AtM_news.39.d:0 "The airwaves become another battlefield."
 
 AtM_news.40.t:0 "United Nations Security Council Established"
 AtM_news.40.desc:0 "In a historic moment for international diplomacy, the United Nations Security Council has been formally established as the primary organ responsible for maintaining international peace and security. The Security Council consists of five permanent members, the United States, United Kingdom, France, Soviet Union, and China. Additionally, six non-permanent members will be elected by the General Assembly for two-year terms. The creation of the Security Council represents humanity's renewed commitment to preventing the horrors of global war through collective security and international cooperation. However, tensions are already evident as the permanent members represent the major victorious powers of the war, and their competing ideologies threaten to paralyze the organization's effectiveness."
 AtM_news.40.a:0 "We shall lead the world toward lasting peace."
 AtM_news.40.b:0 "A new hope for international cooperation and security."
 AtM_news.40.c:0 "We will ensure the workers' voice is heard in this council."
 AtM_news.40.d:0 "Perhaps this organization can prevent future wars."
 
 AtM_news.41.t:0 "France Withdraws from Syria"
 AtM_news.41.desc:0 "In a significant shift in Middle Eastern geopolitics, France has announced the complete withdrawal of its forces and administration from Syria, ending its mandate over the territory that began after the First World War. The decision comes amid growing nationalist pressures and the changing post-war international order that increasingly favors decolonization. Syrian independence leaders have welcomed the announcement as the fulfillment of their long-sought goal of national sovereignty. The withdrawal marks another step in the gradual dismantling of the French colonial empire and reflects the new realities of the post-war world, where the old imperial powers can no longer maintain their extensive overseas territories."
 AtM_news.41.a:0 "The burden of empire grows too heavy to bear."
 AtM_news.41.b:0 "At last, our independence is achieved!"
 AtM_news.41.c:0 "Another step toward Middle Eastern stability."
 AtM_news.41.d:0 "The colonial powers retreat before the tide of liberation!"
 AtM_news.41.e:0 "The Middle East continues to reshape itself."
 
 AtM_news.42.t:0 "Britain Signs Treaty of Friendship with Iraq"
 AtM_news.42.desc:0 "In a ceremony in Baghdad, representatives of the United Kingdom and Iraq have signed a comprehensive Treaty of Friendship and Alliance, formalizing the relationship between the two nations in the post-war era. The treaty establishes a framework for continued cooperation while recognizing Iraq's sovereignty and independence. Under the agreement, Britain will maintain certain military facilities and advisory roles while providing economic and technical assistance to the Iraqi government. The treaty represents a new model of post-colonial relationships, moving away from direct imperial control toward partnership arrangements. Iraqi officials have hailed the agreement as recognition of their nation's equal status, while British representatives emphasize the mutual benefits of continued cooperation."
 AtM_news.42.a:0 "A partnership that serves both our nations' interests."
 AtM_news.42.b:0 "Recognition of our sovereignty and independence!"
 AtM_news.42.c:0 "A pragmatic approach to post-colonial relationships."
 AtM_news.42.d:0 "Another example of neo-colonial manipulation!"
 AtM_news.42.e:0 "The Middle East continues to evolve diplomatically."
 
 AtM_news.43.t:0 "Treaty of London Grants Jordan Independence"
 AtM_news.43.desc:0 "In a historic ceremony in London, the United Kingdom and Jordan have signed the Treaty of London, formally ending the British mandate over Transjordan and granting the Hashemite Kingdom of Jordan full independence. The treaty, negotiated between British Foreign Secretary Ernest Bevin and Jordanian Prime Minister Ibrahim Hashim, establishes Jordan as a sovereign nation while maintaining close ties with Britain. Under the agreement, Jordan will continue to receive British military and economic assistance, and Britain will maintain certain defense arrangements in the region. King [JOR.GetLeader] has expressed his gratitude for British support during the mandate period and his commitment to continued friendship between the two nations."
 AtM_news.43.a:0 "A successful transition to partnership with an independent Jordan."
 AtM_news.43.b:0 "At last, our independence is formally recognized!"
 AtM_news.43.c:0 "The old imperial order gives way to new realities."
 
 AtM_news.44.t:0 "Trizone Formed in Occupied Germany"
 AtM_news.44.desc:0 "France has announced its decision to merge its occupation zone with the Anglo-American Bizone, creating the 'Trizone.' This historic agreement represents the final consolidation of Western Allied zones in Germany and marks a decisive step toward a unified West German state. The Trizone will feature coordinated economic policies, unified currency reform, and integrated administrative structures. French Foreign Minister Robert Schuman emphasized that this decision reflects France's commitment to European reconstruction and democratic values, despite earlier reservations about German reunification. Soviet authorities have condemned the move as complete abandonment of four-power governance and a provocative step toward permanently dividing Germany."
 AtM_news.44.a:0 "The foundation of a democratic Germany is secured."
 AtM_news.44.b:0 "A united Western approach to German reconstruction."
 AtM_news.44.c:0 "A necessary step for European stability."
 AtM_news.44.d:0 "A complete betrayal of the Potsdam agreements!"
 AtM_news.44.e:0 "Germany's division becomes irreversible."
 
 AtM_news.45.t:0 "Large Protests in Hungary"
 AtM_news.45.desc:0 "Following the protests (and later reforms) in Poland, new movements have sprung up in other Warsaw Pact nations in order to end the Stalinist regimes that have dominated the area. Major protests have began to spring up in the nation of Hungary following the ousting of their former leader: Mátyás Rákosi. The events are still unfolding however the situation is seeming dire for the Soviet sphere in Eastern Europe."
 AtM_news.45.a:0 "Heroes against communism!"
 AtM_news.45.b:0 "This will surely blow over..."
 AtM_news.45.c:0 "We demand change now!"
 
 AtM_news.46.t:0 "Austria Stands United Again"
 AtM_news.46.desc:0 "After years of partition and foreign oversight, Austrian leaders have proclaimed the full unification of the republic under a single national government. The move ends the last remnants of occupation-era administration and restores Vienna as the heart of a sovereign, neutral Austria. Crowds fill Heldenplatz as church bells ring, flags rise over official buildings, and officials pledge stability, reconstruction, and strict neutrality to calm anxious neighbors. In Washington, London, Paris, and Moscow, diplomats weigh whether this creates a reliable buffer or an uncertain swing state. Across the provinces, people recall war-time hardship but look to reopened markets and secured borders. Many celebrate with cautious optimism, believing a united state can finally choose its own course without becoming a pawn between rival blocs."
 AtM_news.46.a:0 "Our republic is whole once more."
 AtM_news.46.b:0 "A stable Austria serves European recovery."
 AtM_news.46.c:0 "Another piece of Europe drifts from our orbit."
 AtM_news.46.d:0 "The Austrian question is finally settled."
 
 AtM_news.47.t:0 "Treaty of Paris"
 AtM_news.47.desc:0 "TODO"
 AtM_news.47.a:0 "TODO"
 AtM_news.47.b:0 "TODO"
 
 AtM_news.48.t:0 "Romanian General Election"
 AtM_news.48.desc:0 "The Romanian general election has concluded with the communist-led Bloc of Democratic Parties claiming an overwhelming victory. Independent observers have universally condemned the results as fraudulent, citing massive irregularities including ballot stuffing, voter intimidation, and the systematic exclusion of opposition representatives from polling stations. Traditional democratic parties faced relentless persecution during the campaign, with their leaders arrested and activities severely curtailed. King Michael's constitutional monarchy has been reduced to a hollow shell as the communists consolidate power. This electoral farce marks the effective end of democratic pluralism in Romania and sets the stage for the formal abolition of the monarchy, bringing the country decisively into the Soviet orbit."
 AtM_news.48.a:0 "A necessary step for progress."
 AtM_news.48.b:0 "A decisive victory for the people!"
 AtM_news.48.c:0 "A fraudulent sham of historic proportions."
 AtM_news.48.d:0 "The revolution spreads eastward."
 AtM_news.48.e:0 "Deeply troubling news from Bucharest."
 
 AtM_news.49.t:0 "Bulgarian Parliamentary Election"
 AtM_news.49.desc:0 "The results of Bulgaria's parliamentary elections have been announced, with the communist-dominated Fatherland Front achieving an overwhelming victory. The elections, conducted under Soviet occupation, were marked by widespread intimidation, censorship, and mass arrests of opposition figures. Non-communist parties faced systematic persecution throughout the campaign, with their activities severely restricted. A hastily organized referendum has subsequently abolished the monarchy in what international observers describe as a manipulated vote. With this electoral outcome, the Fatherland Front has effectively eliminated political pluralism in Bulgaria, paving the way for the establishment of a one-party communist republic firmly within the Soviet sphere of influence."
 AtM_news.49.a:0 "The people have spoken!"
 AtM_news.49.b:0 "The monarchy is dead, long live the Republic!"
 AtM_news.49.c:0 "Another state vanishes behind the Iron Curtain."
 AtM_news.49.d:0 "Welcome to the socialist family, comrades!"
 AtM_news.49.e:0 "This is nothing but a farce."
 
 AtM_news.50.t:0 "Hungarian General Election"
 AtM_news.50.desc:0 "The results of Hungary's parliamentary elections have been announced, with the communist-led coalition claiming victory amid widespread allegations of fraud and intimidation. The elections, held under Soviet occupation, were marked by systematic irregularities including ballot stuffing, voter coercion, and the exclusion of opposition observers from polling stations. The Independent Smallholders' Party, which had won a clear majority in 1945, faced relentless persecution with leaders arrested on fabricated charges and many candidates barred from running. With this manipulated electoral outcome, the Hungarian Working People's Party has secured control of parliament, effectively ending Hungary's brief postwar experiment with democracy and ensuring the country's firm alignment with the Soviet bloc."
 AtM_news.50.a:0 "The people have chosen socialism!"
 AtM_news.50.b:0 "A victory for progress!"
 AtM_news.50.c:0 "Democracy dies in Budapest."
 AtM_news.50.d:0 "Another nation joins the socialist family!"
 AtM_news.50.e:0 "A stolen election."
 
 AtM_news.51.t:0 "Communist Coup in Czechoslovakia"
 AtM_news.51.desc:0 "Czechoslovakia, the last functioning democracy in Eastern Europe, has fallen to a communist seizure of power. The crisis began when non-communist ministers resigned in protest against communist control of security forces, prompting the Communist Party to mobilize armed workers' militias and seize control of key locations throughout Prague. President Edvard Beneš, facing the threat of civil war and certain Soviet military intervention, capitulated under immense pressure and accepted a new communist-dominated government. The Third Republic, which had briefly flourished after the war, has been extinguished. This coup represents a major escalation in the emerging Cold War, demonstrating that Stalin's ambitions extend beyond influence to total control. The West views the fall of democratic Czechoslovakia as a watershed moment in the division of Europe."
 AtM_news.51.a:0 "A glorious victory for the working class!"
 AtM_news.51.b:0 "Reactionary forces have been swept aside."
 AtM_news.51.c:0 "A dark shadow falls over Prague."
 AtM_news.51.d:0 "Another victory in the people's struggle!"
 AtM_news.51.e:0 "This is a coup d'état, plain and simple."
 
 AtM_news.52.t:0 "War stirs up between Italy and Yugoslavia"
 AtM_news.52.desc:0 "Today, tensions along the Yugoslav littoral reached a boiling point when the Italian Armed Forces broke through the borders of the newly created international mandate of Trieste, as Yugoslavia refused the demands of the Italian government to host a referendum on whether the city should join their country.\n\nThe international community has condemned the attack and Italy won't be able to call its allies in the conflict through the invocation of Article 5, since it's not in a defensive position."
 AtM_news.52.a:0 "It was a necessary step."
 AtM_news.52.b:0 "The horrors!"
 AtM_news.52.c:0 "The balkan powder keg explodes once more."
 
 AtM_news.53.t:0 "Yugoslavia Expelled from the Cominform"
 AtM_news.53.desc:0 "The Communist Information Bureau has formally expelled Yugoslavia from its ranks, accusing Marshal Tito and the Yugoslav Communist Party of nationalist deviation and hostility toward the Soviet Union. The resolution was passed in Bucharest without Yugoslav representatives being invited to attend, a deliberate slight that Belgrade has rejected as unacceptable interference in its internal affairs. At the heart of the dispute were Stalin's demands that Soviet advisors oversee Yugoslav security services and that the economy be subordinated to Soviet planning, both of which Tito refused. The expulsion marks the first serious fracture within the communist bloc since its formation."
 AtM_news.53.a:0 "We will forge our own path."
 AtM_news.53.b:0 "Tito will pay for his treachery."
 AtM_news.53.c:0 "Cracks in the communist monolith..."
 AtM_news.53.d:0 "A cautionary tale for any who defy Moscow."
 AtM_news.53.e:0 "The communist world fractures."
 
 AtM_news.54.t:0 "Sino-Soviet Split Shifts the Eastern Bloc"
 AtM_news.54.desc:0 "The People's Republic of China and the Soviet Union have formally broken with one another after years of mounting ideological disputes. The rift deepened after Khrushchev's denunciation of Stalin, which Beijing condemned as revisionism, and widened further over Soviet reluctance to share nuclear technology and its doctrine of peaceful coexistence with the West. Moscow has withdrawn its technical advisors from China and cancelled a range of industrial and military cooperation agreements, leaving dozens of unfinished projects across the country. Both parties now compete openly for influence over communist movements across Asia, Africa, and Latin America, each denouncing the other as a traitor to the revolutionary cause."
 AtM_news.54.a:0 "China will lead the world revolution!"
 AtM_news.54.b:0 "Beijing has chosen the path of isolation."
 AtM_news.54.c:0 "An extraordinary opportunity presents itself..."
 AtM_news.54.d:0 "We must choose our side carefully."
 AtM_news.54.e:0 "The communist world is torn asunder."
 
 AtM_news.55.t:0 "Arab States Declare War on Israel"
 AtM_news.55.desc:0 "The armies of Egypt, Transjordan, Syria, Iraq, and Lebanon have crossed into the territory of the newly proclaimed State of Israel, declaring their intention to prevent the establishment of a Jewish state in Palestine. Transjordan's Arab Legion has moved to secure the West Bank and press into Jerusalem, while Egyptian columns advance along the coastal road from the south. The Israeli forces, recently reorganized from the underground Haganah, are outnumbered on multiple fronts and have been denied heavy weapons by an international arms embargo. Hundreds of thousands of Arab civilians displaced by months of intercommunal fighting remain caught between the two sides as the wider war now begins in earnest."
 AtM_news.55.a:0 "We will fight for our survival!"
 AtM_news.55.b:0 "Palestine will be free!"
 AtM_news.55.c:0 "A volatile situation that demands our attention."
 AtM_news.55.d:0 "The Middle East grows ever more unstable."
 AtM_news.55.e:0 "War erupts in the Holy Land."
 
 AtM_news.56.t:0 "Civil War Erupts in Costa Rica"
 AtM_news.56.desc:0 "Costa Rica has descended into civil war following a disputed presidential election in which the incumbent-aligned Congress annulled results that appeared to favour the opposition candidate Otilio Ulate. José Figueres Ferrer, a long-standing opponent of the government who had been preparing for armed resistance for several years, has launched an insurrection from the south with his National Liberation Army. Calderón's coalition, which includes the Communist Popular Vanguard Party, has mobilized its own militias in response, and fighting has spread across several provinces. Neighboring countries have taken opposing sides, providing arms and support to rival factions, internationalizing what began as a domestic dispute."
 AtM_news.56.a:0 "Our republic is under siege!"
 AtM_news.56.b:0 "Instability on our doorstep."
 AtM_news.56.c:0 "Turmoil in Central America."
 
 AtM_news.57.t:0 "War Breaks Out Between India and Pakistan"
 AtM_news.57.desc:0 "The partition of British India has led to open warfare between the two newly independent states over the disputed princely state of Jammu and Kashmir. Pakistani-backed tribal militias invaded Kashmir and advanced rapidly toward the capital Srinagar, prompting the Maharaja to sign an accession to India in exchange for immediate military assistance. Indian forces were airlifted to Srinagar to halt the advance, and the conflict has since spread across the mountain valleys of the disputed territory. The war is unfolding against a backdrop of mass communal violence and the displacement of millions that has accompanied partition, deepening the hostility between the two nations further still."
 AtM_news.57.a:0 "We shall defend our homeland!"
 AtM_news.57.b:0 "Kashmir shall be ours!"
 AtM_news.57.c:0 "The jewel of the Empire shatters before our eyes."
 AtM_news.57.d:0 "A dangerous escalation in South Asia."
 AtM_news.57.e:0 "The subcontinent descends into war."
 
 AtM_news.58.t:0 "Civil War in Paraguay"
 AtM_news.58.desc:0 "Paraguay has erupted into civil war after President Morínigo consolidated power around the Colorado Party, alienating the Febrerista movement and the Liberal Party, which have launched a joint armed insurrection. The rebels initially held a significant military advantage, as a large portion of the officer corps defected to their side, and fighting has spread from the north across much of the country. The government has relied on Colorado rural militias and material support from Argentina's Perón government to compensate for its weakened regular forces. Despite the rebels' early momentum, the conflict appears to be turning in the government's favor as Colorado forces consolidate control over key population centers. The outcome will determine whether Paraguay emerges as a functioning republic or a single-party Colorado state."
 AtM_news.58.a:0 "The fate of Paraguay hangs in the balance."
 AtM_news.58.b:0 "Another Latin American nation in turmoil."
 
 AtM_news.59.t:0 "China Moves on Xinjiang"
 AtM_news.59.desc:0 "The People's Liberation Army has advanced into Xinjiang, the vast western territory previously contested between the Nationalist government, local warlords, and the Soviet-backed East Turkestan Republic. The ETR's senior leadership was killed in a plane crash while traveling to Beijing for consultations, leaving the independence movement without effective direction at the moment it was needed most. Remaining ETR commanders agreed to stand down rather than resist, and the PLA has encountered little organized opposition during its advance. Beijing has framed the move as the liberation of the region from imperialist interference and the completion of national reunification. The Uyghur population faces considerable uncertainty about the degree of autonomy it will be permitted under Communist administration."
 AtM_news.59.a:0 "Xinjiang is rightfully Chinese territory!"
 AtM_news.59.b:0 "We must watch developments closely."
 AtM_news.59.c:0 "Communist expansion continues unchecked."
 AtM_news.59.d:0 "The map of Central Asia is being redrawn."
 
 AtM_news.60.t:0 "Communist Insurgency Erupts in Malaya"
 AtM_news.60.desc:0 "The Malayan Communist Party has launched an armed uprising against British colonial authority, with guerrillas drawn largely from veterans of the wartime anti-Japanese resistance attacking rubber plantations, tin mines, and police posts across the peninsula. The colonial government has declared a state of emergency as the Malayan National Liberation Army withdraws into the jungle interior to conduct a campaign of sabotage and targeted killings. The rubber and tin industries, critical to British economic recovery, have been directly disrupted, while the administration faces the difficult task of fighting an enemy with no fixed positions and genuine support among segments of the rural Chinese population."
 AtM_news.60.a:0 "We will crush this insurgency!"
 AtM_news.60.b:0 "The people's struggle spreads to Malaya!"
 AtM_news.60.c:0 "The colonial order faces a new challenge."
 
 AtM_news.61.t:0 "Italian Trusteeship over Somaliland Established"
 AtM_news.61.desc:0 "The United Nations has approved the establishment of an Italian trusteeship over the former Italian Somaliland, granting Italy administrative authority over its former colony with a mandate to prepare the territory for independence within ten years. The decision came after the Bevin-Sforza Plan, which proposed outright partition of Italy's former African territories among the major powers, was rejected by the General Assembly and triggered widespread protests across the territory. Britain, which has administered the region since the war, has agreed to transfer authority to Italy under close international supervision. The Somali Youth League has accepted the arrangement while making clear it intends to hold Italy firmly to its obligations."
 AtM_news.61.a:0 "We shall fulfill our mandate responsibly."
 AtM_news.61.b:0 "The transfer is complete."
 AtM_news.61.c:0 "A curious arrangement for a former colony."
 
 AtM_news.62.t:0 "The Kingdom of Libya is Proclaimed"
 AtM_news.62.desc:0 "Libya has declared independence, becoming the first country to achieve sovereignty through a direct United Nations resolution, after years of deliberation over the future of Italy's former North African colonies. Emir Idris al-Senussi, who cooperated with the Allied forces during the war, has been proclaimed King Idris I, uniting the three provinces of Tripolitania, Cyrenaica, and Fezzan under a single federal monarchy. The new state faces widespread poverty, minimal infrastructure, and a near-empty treasury, while the three provinces have little in common beyond their shared experience of Italian rule. Britain and the United States have secured basing rights in exchange for financial assistance, ensuring the new kingdom enters independence already aligned with the Western powers."
 AtM_news.62.a:0 "Long live the Kingdom of Libya!"
 AtM_news.62.b:0 "Our mandate has been fulfilled."
 AtM_news.62.c:0 "A new nation rises on our border."
 AtM_news.62.d:0 "Another nation joins the community of free states."
 
 AtM_news.63.t:0 "Free Officers Seize Power in Egypt"
 AtM_news.63.desc:0 "A group of military officers organized under the Revolutionary Command Council has overthrown King Farouk I in a swift coup, seizing control of key installations in Cairo and forcing the King to abdicate and leave the country. The conspirators were motivated by the government's widespread corruption, its poor performance in the Arab-Israeli War, and the continued presence of British forces in the Suez Canal Zone. General Muhammad Naguib has been placed at the head of the new government, though real power is widely believed to rest with the younger Colonel Gamal Abdel Nasser. The coup has been met with little public resistance and considerable celebration in the streets of Cairo and Alexandria."
 AtM_news.63.a:0 "A new Egypt rises from the ashes!"
 AtM_news.63.b:0 "We must assess what this means for our interests."
 AtM_news.63.c:0 "Interesting developments in Cairo."
 AtM_news.63.d:0 "The balance of power in the region shifts."
 AtM_news.63.e:0 "Revolution sweeps through Egypt."
 
 AtM_news.64.t:0 "Soviet Union Demands Revision of the Montreux Convention"
 AtM_news.64.desc:0 "The Soviet government has issued a diplomatic note to [TUR.Capital.GetCapitalVictoryPointName] demanding a revision of the Montreux Convention, which governs passage through the Turkish Straits connecting the Black Sea to the Mediterranean. Moscow has proposed that the defense of the Bosporus and Dardanelles be placed under joint Soviet-Turkish control, and that a new regime be established granting special navigation rights exclusively to Black Sea powers. The note has been received with alarm in Turkey, where it is widely interpreted as a thinly veiled attempt to establish a Soviet military presence on its territory. Ankara has shown no willingness to negotiate and has quietly sought support from Britain and the United States. Western capitals are watching closely, as control of the straits has been a source of great power rivalry for centuries."
 AtM_news.64.a:0 "The straits must be secured for the peoples of the Black Sea."
 AtM_news.64.b:0 "We will never surrender sovereignty over the straits!"
 AtM_news.64.c:0 "Soviet expansionism must be checked."
 AtM_news.64.d:0 "Tensions mount over the Turkish Straits."
 
 AtM_news.65.t:0 "Formation of [MAL.GetName]"
 AtM_news.65.desc:0 "Prime Minister Tunku Abdul Rahman has officially proclaimed the formation of Malaysia, uniting diverse peoples under a single constitutional monarchy after years of careful negotiation and painstaking political compromise. The Alliance coalition, which brokered the delicate social contract between the country's Malay, Chinese, and Indian communities, now faces the greater task of holding a larger and more diverse nation together. Questions of language, religion, and political representation remain close to the surface, and the young federation enters its first days with as many challenges as it does hopes. Whether its leaders can satisfy the competing demands of its many communities while forging a shared national identity remains to be seen."
 AtM_news.65.a:0 "A new nation is born. Let us build it well."
 AtM_news.65.b:0 "We wish Malaysia well in this new chapter."
 AtM_news.65.c:0 "A new power emerges in Southeast Asia."
 
 AtM_news.66.t:0 "Reza Shah Seizes Power in Iran"
 AtM_news.66.desc:0 "In a dramatic turn of events, Shah Mohammad Reza Pahlavi has overthrown Prime Minister Mohammad Mosaddegh and reasserted monarchical authority over Iran. Mosaddegh, who had nationalized the Anglo-Iranian Oil Company and challenged Western influence in the country, was arrested after loyalist military units and crowds of royalist supporters stormed his residence in Tehran. The Shah, who had briefly fled the country during an earlier failed attempt, has returned in triumph to the capital. The new government has moved swiftly to restore order, suppress the Tudeh Party, and signal its willingness to negotiate a new oil agreement with Western companies. The coup marks a decisive defeat for Iranian nationalism and a restoration of the Shah's personal rule."
 AtM_news.66.a:0 "The Shah has restored order to the nation."
 AtM_news.66.b:0 "Our interests in Iran are secured."
 AtM_news.66.c:0 "Western imperialism strikes once more."
 AtM_news.66.d:0 "Democracy lost to foreign interests."
 
 AtM_news.67.t:0 "Egypt Nationalizes the Suez Canal"
 AtM_news.67.desc:0 "Egyptian President Gamal Abdel Nasser has announced the nationalization of the Suez Canal Company in a dramatic speech before a massive crowd in Alexandria. The canal, operated by a joint Anglo-French company since its construction in 1869, is one of the world's most vital trade arteries connecting the Mediterranean to the Red Sea. Nasser declared that canal revenues would fund the Aswan High Dam after the United States and Britain withdrew their offers of financial assistance. The announcement has sent shockwaves through European capitals, where the move is seen as a direct threat to Western strategic and economic interests. Shareholders in the Suez Canal Company face massive losses, and the question of who controls this critical waterway now dominates international diplomacy."
 AtM_news.67.a:0 "The canal belongs to Egypt!"
 AtM_news.67.b:0 "This is an unacceptable provocation!"
 AtM_news.67.c:0 "Nasser grows bolder by the day."
 AtM_news.67.d:0 "A bold move with uncertain consequences."
 AtM_news.67.e:0 "The balance of power in the Middle East shifts."
 
 AtM_news.68.t:0 "Tripartite Invasion of Egypt"
 AtM_news.68.desc:0 "British and French forces have launched a coordinated military assault on the Suez Canal Zone, with paratroopers dropping over Port Said and naval forces bombarding Egyptian coastal positions. The operation follows Israel's invasion of the Sinai Peninsula, which London and Paris used as a pretext to intervene under the guise of separating the combatants and protecting the canal. Egyptian forces are fighting back fiercely but are being overwhelmed by the combined might of three nations. The invasion has drawn immediate condemnation from both the United States and the Soviet Union, who find themselves in rare agreement that the attack represents an unacceptable act of aggression. The United Nations has called an emergency session as the world watches to see whether diplomacy or force will determine the fate of the canal."
 AtM_news.68.a:0 "We will restore order to the canal."
 AtM_news.68.b:0 "The Sinai will be ours."
 AtM_news.68.c:0 "We will defend our homeland to the last!"
 AtM_news.68.d:0 "This aggression cannot stand."
 AtM_news.68.e:0 "The empire strikes back."
 
 AtM_news.69.t:0 "Ceasefire in the Suez Crisis"
 AtM_news.69.desc:0 "Under intense pressure from the United States and the Soviet Union, Britain and France have agreed to a ceasefire and the withdrawal of their forces from the Suez Canal Zone. American economic pressure proved decisive, with Washington threatening to withhold support for the British pound unless the invasion was halted, while Moscow issued veiled threats of nuclear retaliation. Israeli forces remain in the Sinai Peninsula and Gaza Strip for the time being, with Israel pledging to withdraw at a later date. A United Nations Emergency Force will supervise the Anglo-French pullout and attempt to stabilize the region. Egypt retains control of the canal, and Nasser emerges from the crisis with his prestige across the Arab world greatly enhanced. The crisis is seen by many as the end of Britain as a colonial power."
 AtM_news.69.a:0 "Egypt stands victorious against imperialism!"
 AtM_news.69.b:0 "A humiliating withdrawal."
 AtM_news.69.c:0 "We secured our objectives in Sinai."
 AtM_news.69.d:0 "Peace has been restored."
 AtM_news.69.e:0 "The imperialists have been taught a lesson."
 AtM_news.69.f:0 "The Suez Crisis comes to an end."
 
 AtM_news.70.t:0 "People's Republic of China Established"
 AtM_news.70.desc:0 "From the rostrum of Tiananmen Gate in Beijing, Mao Zedong has proclaimed the founding of the People's Republic of China, even as fighting with Nationalist forces continues across the mainland. The Nationalist government of Chiang Kai-shek, battered and losing ground, still claims sovereignty over all of China from its remaining territories in the south. The new communist state, with its vast territory and population of hundreds of millions, immediately reshapes the balance of power across Asia and sends alarm through Western capitals. Washington has refused recognition and watches anxiously as the Nationalists' position grows increasingly precarious. For the Soviet Union and communist movements worldwide, the proclamation stands as proof that revolution can triumph even in the most populous nation on earth."
 AtM_news.70.a:0 "China will rise again"
 AtM_news.70.b:0 "The war is not over"
 AtM_news.70.c:0 "A great communist victory"
 AtM_news.70.d:0 "A dangerous new enemy"
 AtM_news.70.e:0 "The workers' revolution triumphs"
 AtM_news.70.f:0 "The world has changed"
 
 AtM_news.71.t:0 "Assassination of Jorge Eliécer Gaitán"
 AtM_news.71.desc:0 "Reports have flooded in as there have been reports of the famed Liberal party leader within Colombia, "Jorge Eliécer Gaitán," having been assassinated. Social and political tensions have erupted across the country as partisans and guerrillas have been seen rising against the current conservative leadership to overthrow the so-called oppressive leadership."
 AtM_news.71.a:0 "Violence Errupts in South America"
 AtM_news.71.b:0 "A National Catastrophe"
 
 AtM_news.72.t:0 "Porkkala Naval Base Returned to Finland"
 AtM_news.72.desc:0 "The Soviet Union has announced the early return of the Porkkala Peninsula and its naval base to Finland, ahead of the lease's original expiration in 1997. Granted to Moscow under the terms of the 1944 Armistice and the 1947 Paris Peace Treaty, the strategically positioned enclave had sat uncomfortably close to the Finnish capital for over a decade. The decision, initiated under Khrushchev, is widely interpreted as a gesture of goodwill intended to demonstrate Soviet restraint toward neutral neighbors and to reinforce Finland's delicate position outside both blocs. Helsinki has received the news with quiet relief. For Finland, whose sovereignty has been carefully managed since the war, the return of Porkkala represents a meaningful restoration of territorial integrity, though few in the country will celebrate too loudly."
 AtM_news.72.a:0 "Finland is more whole today than yesterday."
 AtM_news.72.b:0 "A fair settlement with our Finnish neighbors."
 AtM_news.72.c:0 "The Baltic balance shifts, if only slightly."
 
 AtM_news.73.t:0 "United Arab Republic Formed"
 AtM_news.73.desc:0 "Egypt and Syria have signed a declaration merging their two nations into a single state: the United Arab Republic. Cairo will serve as the capital with [EGY.GetLeader] as president of the new union, which pan-Arab nationalists across the region are hailing as the first step toward a broader unification of the Arab world. The merger has been driven as much by Syrian anxiety over communist influence at home as by genuine ideological conviction, though [EGY.GetLeader]'s personal prestige lent the project its momentum. Reaction in Western capitals is wary, while Israel watches its borders with heightened concern. For the Arab street, the Republic represents a long-deferred dream, though whether two nations with different political traditions and distant geographies can be held together remains an open question."
 AtM_news.73.a:0 "A new chapter for the Arab nation!"
 AtM_news.73.b:0 "The dream of unity moves forward."
 AtM_news.73.c:0 "We must watch this union very carefully."
 AtM_news.73.d:0 "Another shift in the colonial world."
 AtM_news.73.e:0 "The map of the Middle East has been redrawn."
 
 AtM_news.74.t:0 "Yugoslavia Shoots Down American C-47"
 AtM_news.74.desc:0 "Tensions reach a boiling point between [USA.GetNameDef] and [YUG.GetNameDef]. After it was found that two [USA.GetAdjective] C-47 transport planes entered [YUG.GetAdjective] airspace, the government which is led under [YUG.getLeader] decided that the most reasonable action to take was to shoot down the [USA.GetAdjective] transport planes which were also later found to be unarmed. Tensions remain high between the two nations with war seeming ever closer."
 AtM_news.74.a:0 "A new war in the balkans?"
 AtM_news.74.b:0 "[YUG.GetLeader], you idiot!"
 AtM_news.74.c:0 "Justice needs to be served!"
 AtM_news.74.d:0 "We will protect our sovereignty."
 
 AtM_news.75.t:0 "Terror Attack in California"
 AtM_news.75.desc:0 "The day had started normal in California. Witnesses have stated that a black van was seen headed towards a gas station in San Francisco. Approximately thirteen minutes later, an explosion at the very spot occurred. The attack has been largely blamed on the newly founded communist party within the United States. While these claims were denied, it is clear that the intentions behind the attack were in place to place fear in the capitalists and anti-communists within San Francisco and the larger Californian area."
 AtM_news.75.a:0 "The giant is emploding"
 AtM_news.75.b:0 "The capitalists are crumbling"
 AtM_news.75.c:0 "The countries future is at stake!"
 
 AtM_news.76.t:0 "The Paris Peace Treaty"
 AtM_news.76.desc:0 "The Allied powers and the former Axis satellite states have signed the Paris Peace Treaties, formally concluding the legal settlement of World War II in Europe. The agreements impose territorial adjustments, reparation payments, and military restrictions on [ITA.GetNameDef], [FIN.GetNameDef], [HUN.GetNameDef], [ROM.GetNameDef], and [BUL.GetNameDef]. [GRE.GetNameDef] is awarded the Dodecanese islands, previously held by [ITA.GetNameDef], while the Soviet Union secures recognition of its postwar territorial gains. The treaties are widely seen as cementing the division of Europe established at Yalta and Potsdam. Governments across the continent now face the task of implementing agreements that will reshape borders, reduce armed forces, and redirect national finances for years to come."
 AtM_news.76.a:0 "A necessary step toward European stability."
 AtM_news.76.b:0 "The terms are harsh, but the war is over."
 AtM_news.76.c:0 "We accept the terms and look to rebuild."
 AtM_news.76.d:0 "Our territorial claims have been recognized."
 AtM_news.76.e:0 "The postwar order is now settled in law."
 AtM_news.76.f:0 "The war in Europe is formally concluded."
 
 AtM_news.77.t:0 "Soviet Forces Cross Into [TUR.GetNameDef]"
 AtM_news.77.desc:0 "Soviet forces have crossed into [TUR.GetNameDef] following the breakdown of negotiations over access to the Turkish Straits and longstanding Soviet demands on Ankara. The advance marks a significant escalation of Cold War tensions, raising immediate questions about whether Western powers will invoke their defense commitments. The Turkish government has called for national resistance and appealed to its allies for support. The Soviet Union has justified the military action as necessary to secure its southern borders, while the United States and United Kingdom have condemned the invasion and convened emergency consultations. The situation around the Bosporus and Dardanelles is being watched closely by governments around the world."
 AtM_news.77.a:0 "We will defend our territory."
 AtM_news.77.b:0 "We act in defense of our security."
 AtM_news.77.c:0 "We stand with our ally."
 AtM_news.77.d:0 "A dangerous escalation."
 
 AtM_news.78.t:0 "Truman Fires General MacArthur"
 AtM_news.78.desc:0 "President Harry S. Truman has relieved General Douglas MacArthur of his command over United Nations forces in Korea, citing irreconcilable differences over military strategy and the principle of civilian control of the armed forces. MacArthur had publicly advocated for expanding the war to include strikes against targets in China, a position the Truman administration rejected as risking a wider conflict. The dismissal has provoked fierce debate within the United States, with MacArthur's supporters accusing the president of undermining the war effort while the administration maintains that no commander can publicly defy presidential policy. Communist governments in Beijing and Pyongyang have pointed to the episode as evidence of division within the United Nations coalition."
 AtM_news.78.a:0 "Civilian control of the military must be upheld."
 AtM_news.78.b:0 "Their alliance shows signs of strain."
 AtM_news.78.c:0 "The imperialist camp is divided."
 AtM_news.78.d:0 "A significant shake-up in the Korean War command."
 
 AtM_news.79.t:0 "[RAJ.GetNameDefCap] Gains Independence"
 AtM_news.79.desc:0 "The United Kingdom has transferred power to an independent Indian government, ending two centuries of British rule over the subcontinent. The independence movement, long guided by Mahatma Gandhi and the Indian National Congress, has culminated in sovereignty under Prime Minister Jawaharlal Nehru. Yet the process, overseen by Lord Mountbatten on an accelerated timetable, has brought the partition of British India into two states along religious lines. The resulting population transfers have triggered widespread communal violence, with millions displaced across the new borders. While Gandhi calls for peace amid the unrest, London acknowledges the end of an era in British imperial history. The division of military assets and financial obligations between the new governments remains ongoing."
 AtM_news.79.a:0 "A new chapter begins for the subcontinent."
 AtM_news.79.b:0 "Independence is achieved at last."
 AtM_news.79.c:0 "A major shift in the postwar world order."
 
 AtM_news.80.t:0 "Army Coup in [GUA.GetNameDef]"
 AtM_news.80.desc:0 "TODO"
 AtM_news.80.a:0 "We had to intervene"
 AtM_news.80.b:0 "In Typical Central American Style"
 
 AtM_news.81.t:0 "Khrushchev Rises to Power in the Soviet Union"
 AtM_news.81.desc:0 "Nikita Khrushchev has consolidated his position as First Secretary of the Communist Party of the Soviet Union, emerging as the dominant figure in the post-Stalin power struggle. Following the death of Joseph Stalin in March 1953, a collective leadership sought to prevent any single man from accumulating unchecked authority again. Yet through careful political manoeuvring, Khrushchev has outmanoeuvred rivals including Lavrentiy Beria, who was arrested and shot, and Georgy Malenkov, who has been sidelined. Khrushchev represents a new kind of Soviet leadership, one that speaks of reform, de-Stalinization, and peaceful coexistence with the West, while retaining firm control over the party and state. The direction of the Soviet Union, and with it the trajectory of the Cold War, has shifted."
 AtM_news.81.a:0 "A new chapter begins for the Soviet Union."
 AtM_news.81.b:0 "The socialist bloc has a new helmsman."
 AtM_news.81.c:0 "A change at the top in Moscow."
 
 AtM_news.82.t:0 "Syria Withdraws from the United Arab Republic"
 AtM_news.82.desc:0 "A military coup in Damascus has brought an abrupt end to the United Arab Republic, as Syrian officers and politicians declare the dissolution of the union with Egypt and the restoration of full Syrian sovereignty. Formed in 1958 under the banner of pan-Arab nationalism and the leadership of Gamal Abdel Nasser, the UAR was hailed as the first step toward a unified Arab state. However, Syrian resentment at Egyptian dominance of the union grew steadily, with Cairo's officers and bureaucrats filling key posts, Egyptian economic policies applied without consultation, and Syrian politicians reduced to junior partners. Nasser, in Cairo, has declared he will not use force to hold the union together. The collapse of the UAR is a severe blow to the pan-Arab movement and to Nasser's personal prestige across the Arab world."
 AtM_news.82.a:0 "The union could not hold. Syria goes its own way."
 AtM_news.82.b:0 "Syria reclaims its sovereignty."
 AtM_news.82.c:0 "Arab unity suffers a serious setback."
 AtM_news.82.d:0 "The pan-Arab experiment has fractured."
 
 AtM_news.83.t:0 "Nuclear Missile Sites found in Cuba"
 AtM_news.83.desc:0 "Today, a U-2 plane caught a glimpse of previously unseen structures on the soil of the Caribbean island of Cuba: nuclear missile launch sites, likely owned by the Soviet Union.\n\nWashington immediately saw the presence of such sites as a matter of national security, since it never came face-to-face with nuclear missiles planted in its own tropical backyard, with President [USA.GetLeader] convening the National Security Council to ultimately decide on the future plans and whether or not to pursue a second military invasion of Cuba to completely neutralize any future threats.\n\nBut, as the president makes his decisions, the world looks at another possible scenario of nuclear war..."
 AtM_news.83.a:0 "Let's hope the President makes the right decision"
 AtM_news.83.b:0 "Let's hope the americans don't make stupid decisions"
 AtM_news.83.c:0 "I don't want to die!!"
 
 AtM_news.84.t:0 "Soviet Withdrawal of Missiles from Cuba"
 AtM_news.84.desc:0 "As a consequence of the negotiations between President [USA.getLeader] and the leader of the Soviet Union [SOV.getLeader], it has been agreed that the tumultous event of the last weeks shouldn't have been the cause for the start of the first nuclear war in the history of humanity and both powers agreed to the following conditions:\nThe Soviet Union would remove all sorts of nuclear presence from Cuba;\n the USA would remove all the missiles situated in the country of Turkey.\n\nSince both countries preferred peace, humanity has found itself dodging one of the most terrible endings of all..."
 AtM_news.84.a:0 "Relieving!"
 
 AtM_news.85.t:0 "American Invasion of Cuba"
 AtM_news.85.desc:0 "Cuban sources affirm that some members of the U.S. army, accompanied with members of the Cuban opposition have launched today an invasion of the Caribbean island, in hopes to overthrow the current communist government and restore the previous Batista-led one. While no country has had time to comment on the situation, Castro's forces announced that they will try to stop the situation at all costs.\n\nWhile morale within American forces is high, it is unsure if their mission will be accomplished, since it would be very difficult to obtain supplies unless a port were to be taken..."
 AtM_news.85.a:0 "Damn Americans!"
 AtM_news.85.b:0 "To protect our security!"
 AtM_news.85.c:0 "Another news which I don't care about"
 
 AtM_news.86.t:0 "Truman's National Address"
 AtM_news.86.desc:0 "Within American society, particularly in the Southern states that have increasingly aligned themselves with the Dixiecrat Party, divisions have grown for a multitude of reasons, most notably the government's inability to cooperate with the parties represented in the election.\n\nThese tensions have only intensified after Truman delivered a speech before the Congress of [USA.GetNameDef], directly criticizing the Dixiecrats and launching a personal attack against the party's leader, Strom Thurmond. Should this division continue to deepen, the collapse of [USA.GetNameDef] and its democracy may draw ever closer."
 AtM_news.86.a:0 "Watch as Lady Liberty extinguishes their flame."
 AtM_news.86.b:0 "Take up arms! The war is near!"
 AtM_news.86.c:0 "Can American democracy survive?"
 
 AtM_news.87.t:0 "Burma Gains Independence"
 AtM_news.87.desc:0 "After years of war, Japanese occupation, and mounting nationalist pressure, the United Kingdom has transferred power to an independent [BRM.GetNameDef]. The Anti-Fascist People's Freedom League has taken the lead in the new government, with Aung San and his allies promising to turn resistance politics into state authority. London presents the handover as an orderly settlement that preserves friendly ties, but Burma begins independence with damaged infrastructure, divided parties, and serious ethnic tensions beyond Rangoon's control. Across Asia, the announcement is being watched by colonial subjects and imperial officials alike, as another part of the British Empire steps into an uncertain postwar future. Its success, however, is far from guaranteed at this stage."
 AtM_news.87.a:0 "An orderly transfer of power."
 AtM_news.87.b:0 "Burma is free at last."
 AtM_news.87.c:0 "Another empire loosens its grip."
 
 AtM_news.88.t:0 "Rhineland-Palatinate Established"
 AtM_news.88.desc:0 "French occupation authorities have proclaimed the creation of Rhineland-Palatinate, merging the Rhenish Palatinate, parts of the Prussian Rhine Province, and territory from Hesse-Nassau into a new German Land under French supervision. Mainz has been chosen as the capital, giving the administration a political center on the Rhine while Germany remains divided between occupation zones. Paris argues that the arrangement will weaken old Prussian structures, loosen the Palatinate's historic ties to Bavaria, and create a more manageable western Germany along France's border. German leaders have responded cautiously, seeing another sign that the occupation powers intend to shape Germany before any national settlement or elected federal government can clearly emerge at all."
 AtM_news.88.a:0 "A stable buffer on the Rhine."
 AtM_news.88.b:0 "A new administration begins in Mainz."
 AtM_news.88.c:0 "Germany is reshaped piece by piece."
 
 AtM_news.89.t:0 "United Nations Forces Land at Inchon"
 AtM_news.89.desc:0 "United Nations forces have launched a surprise amphibious landing at Inchon, striking far behind North Korean lines while the fighting around Pusan continues. The operation, led by American commanders and supported by South Korean troops, has opened a new front near Seoul and threatens to cut the North Korean advance from its supply lines. The difficult tides, mudflats, and narrow approaches around the port made the assault a dangerous gamble, but early reports indicate that the landing force has secured a foothold and is pushing inland. With North Korean forces now threatened from the rear, commanders in Pyongyang may be forced to abandon their offensive in the south. If the beachhead holds, the course of the Korean War may shift dramatically in favor of South Korea."
 AtM_news.89.a:0 "Seoul is within reach."
 AtM_news.89.b:0 "The imperialists will be driven back."
 AtM_news.89.c:0 "A bold stroke against communist aggression."
 AtM_news.89.d:0 "The war takes a dangerous turn."
 AtM_news.89.e:0 "This could bring the war closer to our borders."
 AtM_news.89.f:0 "A desperate imperialist gamble."
 AtM_news.89.g:0 "A chance to turn back the invasion."
 AtM_news.89.h:0 "The Korean War changes course."
 
 AtM_news.90.t:0 "Bornholm Returned to Denmark"
 AtM_news.90.desc:0 "The Soviet Union has formally returned the island of Bornholm to Danish administration, ending the occupation that followed the final battles of the Second World War in the Baltic. Soviet forces had held the island after German troops there surrendered separately from the rest of Denmark, leaving Copenhagen anxious over whether Moscow intended a permanent presence so close to the Danish coast. The withdrawal has been welcomed by the Danish government as a restoration of national sovereignty, while Soviet officials present the handover as proof of their respect for postwar settlements. Though the move removes one source of tension in the Baltic, Denmark remains wary of the growing divide between the East and West in the aftermath of the Second World War."
 AtM_news.90.a:0 "A gesture of good faith."
 AtM_news.90.b:0 "Bornholm is Danish once more."
 AtM_news.90.c:0 "A small island returns to a tense Europe."
 
 AtM_news.91.t:0 "Israeli Forces Withdraw from the Gaza Strip"
 AtM_news.91.desc:0 "Israeli forces have withdrawn from the Gaza Strip, ending the military administration imposed after its capture during the Suez Crisis. The evacuation follows months of pressure from the United Nations, the United States, and the Soviet Union for Israel to return behind the 1949 armistice line. United Nations Emergency Force units have entered Gaza to supervise the transition and prevent renewed clashes along the frontier. Egyptian civil administration is expected to resume, though the territory's future remains uncertain. Its Palestinian refugee population, the legacy of cross-border raids, and Israeli security concerns have all survived the withdrawal. Diplomats hope the deployment will bring calm, but the underlying Arab-Israeli dispute remains unresolved."
 AtM_news.91.a:0 "The diplomatic cost of remaining was too high."
 AtM_news.91.b:0 "Gaza returns to Egyptian administration."
 AtM_news.91.c:0 "The last occupations of the Suez Crisis are ending."
 
 AtM_news.92.t:0 "Israel Completes its Withdrawal from the Sinai"
 AtM_news.92.desc:0 "Israel has withdrawn its forces from the Sinai Peninsula, completing the evacuation of Egyptian territory occupied during Operation Kadesh. The decision follows pressure from Washington, United Nations resolutions, and threats from Moscow that made continued occupation untenable. United Nations troops have moved into Sharm el-Sheikh and strategic positions to supervise the ceasefire and separate the opposing forces. Israel states that its withdrawal follows assurances that the Straits of Tiran will remain open to its shipping, warning that a blockade would threaten the settlement. Egypt celebrates restored sovereignty, while President Nasser emerges from the failed intervention with greater prestige throughout the Arab world. The last occupation of the Suez Crisis has ended."
 AtM_news.92.a:0 "Our access to the Straits of Tiran must be respected."
 AtM_news.92.b:0 "The Sinai is Egyptian once more."
 AtM_news.92.c:0 "The Suez Crisis draws to a close."
 
 AtM_news.93.t:0 "[SUD.GetNameDefCap] Gains Independence"
 AtM_news.93.desc:0 "The Sudanese parliament has proclaimed [SUD.GetNameDef] an independent sovereign state, ending more than half a century of Anglo-Egyptian condominium rule. Rejecting British administration and union with Egypt, Sudanese leaders have chosen a separate national future centered in Khartoum. London and Cairo have recognized independence, withdrawn their officials and forces, and transferred authority to the new government. Crowds gathered to witness the lowering of the British and Egyptian flags and the raising of Sudan's own colors. Independence ends the diplomatic contest over the Nile Valley, but not the country's internal divisions. The young republic must unite its northern and southern provinces, build lasting institutions, and contain unrest spreading through the south."
 AtM_news.93.a:0 "Sudan is free at last."
 AtM_news.93.b:0 "The condominium has come to an end."
 AtM_news.93.c:0 "Another African nation joins the world."

 AtM_news.94.t:0 "The Soviet Union Has the Atomic Bomb"
 AtM_news.94.desc:0 "The government of [USA.GetNameDef] has announced that it possesses evidence of a recent atomic explosion within [SOV.GetNameDef]. Radioactive debris collected by American aircraft and examined by government laboratories has convinced Washington that the Soviet Union has successfully tested its first atomic weapon. [USA.GetLeader] has acknowledged that the spread of atomic knowledge was ultimately inevitable, but the announcement nevertheless marks the abrupt end of the American nuclear monopoly. Governments around the world are now reassessing their security as the rivalry between the two great powers enters a far more dangerous atomic age."
 AtM_news.94.a:0 "The atomic monopoly is over."
 AtM_news.94.b:0 "The balance of power has changed."
 AtM_news.94.c:0 "The world enters the atomic age."
 
 AtM_news.95.t:0 "Spain Engulfed in Civil War"
 AtM_news.95.desc:0 "The government of Spain has declared a state of emergency as rebels today have taken arms as a consequence of the suppression of the general strike programmed for today. These revolutionaries, fiercely symphatetic with republican and democratic ideals, have engulfed the country into its second civil war in this century. While they might be lies, there have been some rumors that this revolution might be sponsored by the Rome-backed Mediterranean Accords."
 AtM_news.95.a:0 "Spain will finally be democratic!"
 AtM_news.95.b:0 "We'll crush the rebels!"
 AtM_news.95.c:0 "Second time's the charm"
 
 AtM_news.96.t:0 "Coup in Spain"
 AtM_news.96.desc:0 "As chaos engulfed Spain, today, as a consequence of the suppression of a general strike, republican rebels have taken arms and bashed into the capital city of Madrid, proclaiming a Third Republic and arresting every one of the previous politicians still in the country. While Franco and most of the government managed to escape, the fire has burned down and the people are optimistic for the democratic future that Spain might lean to. But, of course, since people like to speculate, there have been some rumors that this regime change in the country might've only been a plot staged by the government of Italy."
 AtM_news.96.a:0 "I can't believe it worked!"
 AtM_news.96.b:0 "A new sun shines on Spain"

 AtM_news.97.t:0 "Vietnamese Proclamation of Independence"
 AtM_news.97.desc:0 "The Democratic Republic of Vietnam has declared its independence from French colonial rule under Ho Chi Minh. Following Japan's surrender, the Viet Minh seized Hanoi during the August Revolution, while Emperor Bao Đai abdicated, ending the Nguyen monarchy. On September 2, 1945, Ho Chi Minh proclaimed independence in Hanoi's Ba Đình Square, invoking both the American Declaration of Independence and the French Declaration of the Rights of Man. Yet the new republic faces an uncertain future. Chinese Nationalist troops are entering the north, British forces the south, and France intends to restore its colonial authority. After years of occupation, famine, and war, Vietnam has declared itself sovereign, but defending that independence amid mounting pressure may prove far more difficult in the years ahead."
 AtM_news.97.a:0 "Freedom for Us!"
 AtM_news.97.b:0 "Colonial rule is collapsing in Southeast Asia."

 AtM_news.98.t:0 "War in Indochina"
 AtM_news.98.desc:0 "Open warfare has erupted between French forces and the Viet Minh, ending the uneasy coexistence that followed Vietnam's declaration of independence. The March agreement recognized Vietnam as a free state within the French Union, but negotiations failed to settle the questions of sovereignty and the reunification of Cochinchina with the north. French bombardment of Haiphong and mounting confrontations have now given way to fighting in Hanoi, where Viet Minh forces have attacked French positions. Ho Chi Minh has called for nationwide resistance as his government prepares to continue the struggle beyond the capital. France seeks to preserve its position in Indochina, while the Vietnamese leadership insists that independence cannot be surrendered."
 AtM_news.98.a:0 "The struggle for our independence continues."
 AtM_news.98.b:0 "We are engaged in a costly war in Indochina."
 AtM_news.98.c:0 "The world watches as colonial powers face resistance."

 AtM_news.99.t:0 "Federation of Indochinese Republics Formed"
 AtM_news.99.desc:0 "At 11'30 AM, the leaders of the Democratic Republic of Vietnam, the Cambodia, and the Laos have signed a historic agreement establishing the Federation of Indochinese Republics. This new political entity unites the three nations under a federal structure, aiming to promote regional stability, economic cooperation, and collective security. The federation represents a significant step in the post-colonial development of Southeast Asia, as it seeks to assert its sovereignty and foster collaboration among its member states. The international community has responded with cautious optimism, recognizing the potential for this federation to serve as a model for regional integration."
 AtM_news.99.a:0 "We did it!"
 AtM_news.99.b:0 "A new era for Indochina begins."

 AtM_news.100.t:0 "Ecuadorian Civil War"
 AtM_news.100.desc:0 ""
 AtM_news.100.a:0 "Viva la Ecuador!"
 AtM_news.100.b:0 "Another country falls..."

 AtM_news.101.t:0 "Second Ecuadorian–Peruvian War"
 AtM_news.101.desc:0 ""
 AtM_news.101.a:0 "We Lost once, but will not Twice!"
 AtM_news.101.b:0 "God. I will let Ecuador burn in Hell."
 AtM_news.101.c:0 "Again?"

 AtM_news.102.t:0 "Argentinian Civil War"
 AtM_news.102.desc:0 ""
 AtM_news.102.a:0 "We shall reclaim our homeland!"
 AtM_news.102.b:0 "For Liberty and Consitution!"
 AtM_news.102.c:0 "Argentina burns..."

 AtM_news.103.t:0 "Second Pacific-Chaco War"
 AtM_news.103.desc:0 ""
 AtM_news.103.a:0 "Bolivia-Argentina shall fight against Imperialism!"
 AtM_news.103.b:0 "To La Paz!"
 AtM_news.103.c:0 "What is going on in South America?"
 
 AtM_news.104.t:0 "Military Coup in Albania"
 AtM_news.104.desc:0 "Today, the red flags have been lowered in Tirana as a consequence of a sweep military coup that forced the previous communist leadership into exile in Moscow.\n\nWhile these are only suppositions, it is possible that this coup was orchestrated directly by Rome, which has been pursuing a goal of unifying the mediterranean, in hopes to create a strategic alliance alternative to the ones of the superpowers.\n\nEither way, the Albanian people have seem to like the new government and the liberties associated with it, so it might be the start of a new era for that country."
 AtM_news.104.a:0 "Albania is back into our pockets"
 AtM_news.104.b:0 "It's Albania, who cares"
 
 AtM_news.105.t:0 "Failed Army Coup in Albania"
 AtM_news.105.desc:0 "Chaos today surrounded Tirana as a planned military coup has been unveiled by the government, which promply led to arrests and massive purges within the armed forces.\n\nnWhile these are only suppositions, it is possible that this coup was orchestrated directly by Rome, which has been pursuing a goal of unifying the mediterranean, in hopes to create a strategic alliance alternative to the ones of the superpowers. And that would probably be the reason why the Italian government has been issued a statement in which it called for the Albanian people to resist their government.\n\nWhile the future is still uncertain, this situation might lead into a direct Mediterranean intervention in albanian politics, also by the means of military force."
 AtM_news.105.a:0 "They'll see what we have in store for them"
 AtM_news.105.b:0 "The Balkans tremble"
 
 AtM_news.106.t:0 "Germany annexes Austria!"
 AtM_news.106.desc:0 "In the peacedeal conducted by Germany after the defeat Austria, Germany has made the controversial decision to re-annex Austria."
 AtM_news.106.a:0 "This has to be some sort of violation"