 ##################################################################################
 
 news_aftermath.1.t:0 "Nuclear Bombs dropped on Japan"
 news_aftermath.1.desc:0 "After the rejection of a capitulation ultimatum on the 27th of July 1945, the U.S. saw itself in a position, where it needed to act to end the war. Under the order of Truman, the first Atomic Bomb called "Little Boy" was dropped on Hiroshima as a lot of military industries as well as stationed divisions were located there. This was seen by many as a solution, which wouldn't cause as many deaths as an invasion into mainland Japan. Although many of the Scientists who worked on the bomb discouraged the use of the bomb, on August 6th, 1945 at approximately 8:16 AM, The Bomber "Enola Gay" dropped the Atomic Bomb "Little Boy", which detonated at 580m height, causing the deaths of around 90.000 to 200.000 and 80% of the city destruction after the detonation of the bomb."
 news_aftermath.1.a:0 "The Atomic Age has Begun..."
 news_aftermath.1.b:0 "May our country survive!"
 news_aftermath.1.c:0 "It was a necessary evil."
 
