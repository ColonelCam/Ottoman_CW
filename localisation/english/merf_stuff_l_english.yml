  NOR_fascism_party:0 "Nasjonal Samling"

  merf.2.t:0 "Scandinavian Nationalists Unite"
  merf.2.d:0 "After the conclusion of the Swedish Civil War, the Danish and Swedish authorities have finally rejoiced in unification as they begin their project for a greater Nordic reich.\n\nAfter a brief conference, the nations have elected the Swedish leader Sven Olov Lindholm as their absolute dictator, and they now greedily eye the missing piece of the puzzle- Norway."
  merf.2.a:0 "I thought we banished fascism?!"

  merf.4.t:0 "The Anslutnig of Norway"
  merf.4.d:0 "After a large military buildup on the border, Scandinavian troops began invading Norway today. At the same time, Pro-Unification elements led by Vidkun Quisling staged a coup in Oslo, and the Scandinavian foreign ministry delivered an ultimatum demanding the immediate disbandment of the Norwegian army.\n\nWithout so much as a shot fired, the Norwegian government had no choice to accept, and Norway has essentially just been annexed into the Scandinavian reich."
  merf.4.a:0 "That's Britain's problem. Whatever."

  merf.6.t:0 "Scandinavia's Great Re-Alignment"
  merf.6.d:0 "'This Age of Unfettered Capitalism must come to an end,' Scandinavian dictator Sven Lindholm began his speech with today. 'The hedonistic dens of sin that permeate the globe are the greatest threat to humanity's survival, and no cost is too great to overcome them.' And then came the shocking part. 'Communism is not our enemy and, to be honest, it never has been. It is for this reason I am embracing our left wing friends in the name of Anti-Capitalism. We need America to fight alongside us, not against us.'\n\nIt appears that Scandinavia is engaging in a great realignment, away from Fascism and towards International Communism."
  merf.6.a:0 "Shocking!"

  merf.8.t:0 "Scandinavia joins the I.W.W."
  merf.8.d:0 "Following Lindholm's new direction for Scandinavia, the American President has decided they have become sufficiently reformed and are now amicable to be admitted to America's international alliance- the International Workers of the World.\n\nThis represents a huge alignment on the global stage, as America now has a direct line to put pressure on Central Europe."
  merf.8.a:0 "A Spectre is Haunting Europe..."

  merf.10.t:0 "The Oslo Putsch"
  merf.10.d:0 "Highly dissatisfied with Lindholm's chosen direction for Scandinavia, especially aligning with the communists, and with Scandinavian sovereignty now being directly threatened, former unionists in Norway have renounced the united Scandinavian dream and declared independence.\n\nWith thunderous applause from gathered crowds in Oslo, who deeply reject the war, the Norwegian state has been resurrect and militia have been mobilised to secure their sovereignty against Copenhagen."
  merf.10.a:0 "Good... luck?"

  merfam.2.t:0 "Quebecois Independence Referendum"
  merfam.2.d:0 "Following much internal strife from communist elements, the Premier of Canada has today announced a referendum on the independence of the province of Quebec.\n\nHoping to calm down tensions with a decisive vote for unity, the PM's plan has drawn ire from some who consider it too great a gamble.\n\nThe Americans are also hungrily eyeing the situation, ready to pounce at the slightest sign of weakness..."
  merfam.2.a:0 "Canada must not fall..."

  merfam.4.t:0 "Evidence of Rigging in Quebec!"
  merfam.4.d:0 "Following the successful vote for unity in the Quebec Independence Referendum, many thought the Canadian Prime Minister's gamble had succeeded. However, in the days immediately after, journalists and anonymous sources provided irrefutable evidence that the government had rigged the referendum! With America ever fanning the flames of dissent, this has caused such an uproar that radical, socialist elements have seized state legislature in Quebec and unilaterally declared independence.\n\nThe Canadian PM won't back down, however, even with his own communist insurgents to deal with..."
  merfam.4.a:0 "Will this affect the price of Maple Syrup?"

  merfam.6.t:0 "America Intervenes in the Quebec Emergency!"
  merfam.6.d:0 "After 10 days of stand-off between the Canadian government and communist insurgents, the stalemate has finally been broken today as American forces crossed the border and began skirmishes with the Royal Mounted Police. This coincided with a popular uprising in Vancouver, as it seems the American dream of uniting the Western Hemisphere inches slightly closer to completion..."
  merfam.6.a:0 "The Eagle Strikes!"

  merfam.8.t:0 "General Strike in Mexico"
  merfam.8.d:0 "Following continued unrest from the growing but suppressed Mexican communist movement, the trade unions have called a general strike to completely paralyze the Mexican government. Army units ordered to force the strikers back to work are defecting en masse, and many are worried that another revolution may be imminent..."
  merfam.8.a:0 "This has American fingers all over it."

  merfam.10.t:0 "The Chihuahua Rebellion"
  merfam.10.d:0 "The Border Provinces of Chihuahua, Nuevo Leon as well as the Yucatan Peninsula have declared open revolt against the Mexican government as they denounce Mexico City as being incapable of fair governance. At the same time, American troops have crossed the border and seized Baja California in what the Mexican government has decried as blatant opportunism. It seems a Mexican Civil War is in full swing."
  merfam.10.a:0 "How is this not just Imperialism with extra steps??"