 phm_events.1.t:0 "It's time to reclaim the homeland"
 phm_events.1.desc:0 "After a year of preparation, we are now having a great chance to bring the revolution and Mao Zedong's ideals back to home. We have contacted communist insurgent forces in the mainland and trained some communist sympathizers from the diaspora community. Saboteurs from our government sent to Nanjing stated that Chiang Kai Shek's regime is extremely unpopular and currently having a constitutional crisis. A plan were designed by our top generals few months ago, determined that by American support, we will conduct landing operations and rebellion beyond the frontline. All of the elements above is giving us an oppoturnity better than ever. And today will be the first day of the campaign."
 phm_events.1.a:0 "+1000 social credit"
 phm_events.2.t:0 "Second wave of army"
 phm_events.2.desc:0 "Extra insurgents"
 phm_events.2.a:0 "Yummy"
 phm_events.3.t:0 "Third wave of army"
 phm_events.3.desc:0 "Troops from the Diaspora community, also more insurgents"
 phm_events.3.a:0 "Chinese is surely stand by the revolution!"
 AtM_phm_news.1.t:0 "Communist return to China"
 AtM_phm_news.1.desc:0 "The international community saw in panic and horror as the Chinese Red Army under Mao Zedong have begun to landing in important ports in mainlan, including Guangzhou, Shanghai and Coastal parts of Fujian and Zhenjiang province.At the same time, communist rebellion have been reported inside rural, remote and mountainous parts of China, which certainly received underground equipment support from the exiled Taibei government, according to Nanjing authority. Experts are monitoring the situation closely as leaders across the world show their concern to the Chinese situation."
 AtM_phm_news.1.a:0 "Heh, guess they can't beat the communist allegations"
 CHI_last_stand:0 "China's Last Stand Against Communism"
